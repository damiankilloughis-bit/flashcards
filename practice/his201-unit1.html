<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS-201 Unit 1 Practice Exam</title>
<style>:root{--bg:#111418;--panel:#1a1f27;--panel2:#222935;--line:#2c3441;--text:#e6e9ef;--muted:#9aa4b2;--accent:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 80px}.top{position:sticky;top:0;background:var(--bg);padding:12px 0;display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:18px;margin:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}.btn.p{background:#1d4ed8;border-color:#2563eb}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}.qn{color:var(--muted);font-size:13px}
.ch{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px}
.tf{display:flex;gap:8px}.tf .ch{text-align:center}.ch.sel{border-color:var(--accent);background:#1e3a5f}.ch.ok{border-color:#22c55e;background:rgba(34,197,94,.18)}.ch.bad{border-color:#ef4444;background:rgba(239,68,68,.18)}
.card.right{border-color:#22c55e}.card.wrong{border-color:#ef4444}.ex{margin-top:8px;color:var(--muted);font-size:14px}#score{font-size:20px;font-weight:600}#timer{font-variant-numeric:tabular-nums}.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}</style></head>
<body><div class="wrap"><div class="top"><h1>HIS-201 Unit 1 Practice</h1><div><span id="timer"></span> <button class="btn" id="tbtn">Start 60:00 timer</button></div></div>
<div id="res" class="card" hidden><div id="score"></div><div class="row"><button class="btn" id="copy">Copy my wrong answers</button><button class="btn" id="retake">Retake</button></div><div id="msg" class="ex"></div></div>
<div id="qs"></div><div class="row"><button class="btn p" id="sub">Submit</button></div><p class="ex"><a style="color:var(--accent)" href="../">Back to flashcards</a></p></div>
<script>const Q=[{"q": "Based on interpreting information from the text, which of the following best explains why Native Americans proved so vulnerable to Eurasian diseases?", "c": ["Because the Americas' north-south axis kept Native peoples from trading with one another", "Because Native Americans raised relatively few domesticated animals\u2014the source of diseases such as smallpox and measles\u2014they never acquired the immunity that surviving Eurasian adults had", "Because the extinction of megafauna left Native Americans malnourished", "All these answers are correct"], "a": 1, "x": "Eurasian diseases came from domesticated animals; childhood exposure gave Eurasian survivors immunity.", "ch": 1}, {"q": "T/F: Mesoamerican pioneers began domesticating corn about 10,000 years ago and later added squash, beans, and tomatoes.", "c": ["True", "False"], "a": 1, "x": "SQUASH came first about 10,000 years ago; corn was added later.", "ch": 1}, {"q": "Which of the following IS NOT an accurate description of the Algonquins?", "c": ["They were the third major group of Eastern Woodlands peoples", "They lived along the Atlantic seaboard and the Great Lakes", "They were patrilineal, with property and prestige descending through men", "They lived in larger, more centralized communities than the Iroquois"], "a": 3, "x": "Algonquins lived in SMALLER communities than the Muskogeans or Iroquois.", "ch": 1}, {"q": "It may be argued that agriculture made the Olmecs the first city builders in the Americas because:", "c": ["Corn had to be traded long distances, which required cities", "The Olmecs domesticated llamas for transport", "Expanding food supplies increased populations and allowed people to specialize\u2014as craftworkers, merchants, architects, artists, warriors, and priests\u2014so villages grew into urban centers", "Hunting megafauna demanded large, permanent armies"], "a": 2, "x": "Food surpluses allowed specialization and urban centers by about 1500 BCE.", "ch": 1}, {"q": "Based on interpreting information from the text, which of the following best describes the motives behind Prince Henry 'the Navigator''s sponsorship of Portuguese voyages?", "c": ["He hoped to prove the earth was round", "He promoted Portuguese maritime interests, Catholicism, and opposition to Islam\u2014funding voyages and a maritime school to defeat the Atlantic current problem", "He sought a Northwest Passage to China for England", "All these answers are correct"], "a": 1, "x": "Henry promoted maritime interests, Catholicism and opposition to Islam.", "ch": 2}, {"q": "The authors of your text suggest that the English colonization of Ireland established which precedent?", "c": ["That Catholics had the right to conquer Protestants", "That any nearby territory was fair game for settlement", "That English colonies should be governed by Irish law", "That a people perceived as 'savage' could be treated more brutally than Europeans\u2014denied land, offices, juries, trades, and weapons"], "a": 3, "x": "English violence in Ireland set a precedent for brutality toward 'savage' peoples.", "ch": 2}, {"q": "T/F: John Calvin, a French lawyer turned theologian, taught that Christians should accept the existing social order rather than reshape society according to biblical law.", "c": ["True", "False"], "a": 1, "x": "That was LUTHER's view; Calvin urged reshaping society by biblical law.", "ch": 2}, {"q": "Christopher Columbus ultimately gained Spanish backing because:", "c": ["Portuguese experts endorsed his calculation of the distance to China", "Ferdinand and Isabella, having captured Granada and completed the reconquista in 1492, then accepted the proposal they had first rejected", "He promised to find a Northwest Passage", "The pope ordered Spain to fund him"], "a": 1, "x": "Ferdinand and Isabella accepted after capturing Granada in 1492.", "ch": 2}, {"q": "This chapter tells the story of Roanoke to make the point that:", "c": ["English colonizers alienated the Native people\u2014Lane's men killed Wingina\u2014and the Spanish Armada delayed John White's return, leaving the colony to vanish", "Native Americans welcomed and protected the English colonists", "Sir Francis Drake founded England's first permanent colony", "The colonists moved to Jamestown"], "a": 0, "x": "Grenville and Lane alienated Roanoke; the Armada delayed White until 1590.", "ch": 2}, {"q": "_____ claimed one-fifth of the silver extracted in Spanish America, while about 16,000 tons of silver left for Europe during the 16th century.", "c": ["The Catholic Church", "The conquistador nobility", "The Spanish Crown", "Portuguese merchants"], "a": 2, "x": "Spain's Crown claimed one-fifth of extracted silver.", "ch": 2}, {"q": "This English colonist's brief imposition of order\u2014and bullying of Indians for food\u2014helped early Jamestown survive until he returned to England in 1609 after a gunpowder injury:", "c": ["John Smith", "John Rolfe", "Walter Raleigh", "Nathaniel Bacon"], "a": 0, "x": "Captain John Smith briefly imposed order and left in 1609.", "ch": 3}, {"q": "Which of the following IS NOT an accurate description of Chesapeake immigrants during the 1620s tobacco boom?", "c": ["Indentured servants made up three-quarters of Virginia's immigrants", "Most were between 15 and 24 years old", "Men outnumbered women six to one", "Most were married men who brought their families"], "a": 3, "x": "Most were young single servants, not families.", "ch": 3}, {"q": "This chapter tells the story of Powhatan's confederacy to make the point that:", "c": ["The English survived only because Powhatan's people taught them to grow tobacco", "Powhatan readily accepted James I as his king", "Powhatan tolerated the English because their labor, trade goods, and guns could help him subdue Indian rivals\u2014but tobacco fields ultimately displaced his control", "The English and Powhatans lived peacefully for a century"], "a": 2, "x": "Powhatan used the English against rivals; tobacco displaced his control.", "ch": 3}, {"q": "T/F: The House of Burgesses, which first met in 1619, made laws together with the governor and a council appointed by the king.", "c": ["True", "False"], "a": 1, "x": "The council was appointed by the Virginia COMPANY, not the king.", "ch": 3}, {"q": "As the tobacco boom weakened in the 1630s and 1640s:", "c": ["Virginians produced more corn and cattle", "Nutrition and health improved", "Survivors of indenture increasingly established modest farms", "All these answers are correct"], "a": 3, "x": "All three appear in the book.", "ch": 3}, {"q": "_____ was founded both as a buffer between British colonies and Spanish Florida and as a refuge where trustees gave land to the 'worthy poor' and banned slavery and hard liquor.", "c": ["Maryland", "Georgia", "South Carolina", "North Carolina"], "a": 1, "x": "Georgia's trustees' plan.", "ch": 3}, {"q": "Based on interpreting information from the text, which of the following best explains why France depended on Indian allies in the fur trade?", "c": ["Indian partners such as the Hurons did most of the trapping and hauling\u2014while New France, derided as a 'comptoir,' struggled to attract settlers", "French law forbade colonists from trapping", "The Dutch had banned French traders from the St. Lawrence", "All these answers are correct"], "a": 0, "x": "Pelt revenue barely sustained Champlain; he struggled to bring settlers.", "ch": 4}, {"q": "The authors of your text suggest that the Beaver Wars were:", "c": ["A minor conflict between French and Dutch traders", "Fought mainly by Puritans against the Wampanoags", "At least as profoundly transformative for the colonial north as the Indian slave wars were for the south", "Ended by the Glorious Revolution"], "a": 2, "x": "The book's own comparison.", "ch": 4}, {"q": "Which of the following IS NOT an accurate description of the Puritan doctrine of predestination?", "c": ["Each person could earn salvation through good works and sacraments", "God ordained the outcome of history", "God determined each person's eternal fate", "Puritans found comfort and meaning in a sovereign God directing all creation"], "a": 0, "x": "Earning salvation through works contradicts predestination.", "ch": 4}, {"q": "T/F: First-generation New Englanders lived to an average age of about 70\u2014nearly twice as long as Virginians\u2014and their population doubled about every 50 years.", "c": ["True", "False"], "a": 1, "x": "It doubled about every 27 years.", "ch": 4}, {"q": "New Netherland became New York when:", "c": ["The Dutch sold it to William Penn", "The Iroquois drove out the Dutch", "James II merged it with Pennsylvania", "The English conquered New Amsterdam in 1664"], "a": 3, "x": "English conquest turned New Amsterdam into New York (1664).", "ch": 4}, {"q": "It may be argued that the Glorious Revolution affected the colonies chiefly because:", "c": ["It created the Navigation Acts", "William and Mary dismantled the Dominion of New England and reinstated representative assemblies\u2014settling that Parliament was supreme", "It brought James II to the throne", "All these answers are correct"], "a": 1, "x": "William and Mary dismantled the Dominion and restored assemblies.", "ch": 4}, {"q": "William Penn's Quakers differed from the Puritans in believing that:", "c": ["The state should guarantee freedom of worship to all", "Government should enforce one true church", "Dissenters like Roger Williams should be banished", "Only church members should vote"], "a": 0, "x": "Quaker toleration vs. Puritan orthodoxy.", "ch": 4}, {"q": "Based on interpreting information from the text, which of the following best explains why Spain established Texas?", "c": ["Fearing another French expedition like La Salle's might raise an Indian army against New Spain, Spain built missions and presidios as a buffer", "Spain wanted Texas silver mines for export", "Spain hoped to block Russians moving south from Alaska", "All these answers are correct"], "a": 0, "x": "Texas was a buffer after La Salle; Russians spurred California, not Texas.", "ch": 5}, {"q": "T/F: In 1729 some newly arrived slaves joined the Natchez uprising, and the costly French victory\u2014won with Choctaw allies\u2014persuaded authorities to import more slaves into Louisiana.", "c": ["True", "False"], "a": 1, "x": "It persuaded authorities to STOP importing slaves.", "ch": 5}, {"q": "Which of the following IS NOT an accurate description of the backcountry?", "c": ["Families moved three or four times, hindering social bonds", "Good roads and navigable rivers carried crops cheaply to market", "Few could afford a slave or servant", "It was, more than anywhere else in America, a society of equals"], "a": 1, "x": "There were NO roads or navigable rivers, so families were self-sufficient.", "ch": 5}, {"q": "The Great Awakening resulted in all of the following EXCEPT:", "c": ["The triumph of rational Christianity among most colonists", "Splits within Congregational and Presbyterian churches", "Scores of new Presbyterian and Baptist churches in the South and backcountry", "Americans more divided along religious lines"], "a": 0, "x": "The Awakening was partly a reaction against rational Christianity.", "ch": 5}, {"q": "Compared with English law, Spanish law gave a woman like 'Soledad':", "c": ["Nothing if her father died without a will", "Only her 'paraphernalia' as a widow", "Equal inheritance with her brothers and continued ownership of her dowry\u2014returned in full at widowhood or divorce", "No legal control over her personal property"], "a": 2, "x": "Spanish law: equal inheritance, dowry still hers.", "ch": 5}, {"q": "It may be argued that most white colonists liked being English because:", "c": ["Parliament closely supervised colonial assemblies", "Britain's 'benign neglect' left them relatively autonomous, with wider landownership, a larger middle class, and more representative governments than England", "They had a titled aristocracy like England's", "All these answers are correct"], "a": 1, "x": "Benign neglect gave relative autonomy and opportunity.", "ch": 5}, {"q": "This colonist, Pennsylvania's 'most successful entrepreneur, inventor, and politician,' was most impressed by the Enlightenment's emphasis on useful knowledge and experimentation:", "c": ["George Whitefield", "Jonathan Edwards", "William Penn", "Benjamin Franklin"], "a": 3, "x": "Franklin.", "ch": 5}],L="ABCD";let ans={},done=false,tid=null;
function render(){const box=document.getElementById('qs');box.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='card';d.id='q'+i;
d.innerHTML=`<div class="qn">Question ${i+1} of ${Q.length}</div><div>${q.q}</div>`;const w=document.createElement('div');if(q.c.length==2)w.className='tf';
q.c.forEach((c,j)=>{const b=document.createElement('button');b.className='ch';b.textContent=(q.c.length==2?'':L[j]+'. ')+c;b.onclick=()=>{if(done)return;ans[i]=j;[...w.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};w.appendChild(b)});
d.appendChild(w);box.appendChild(d)})}
function lab(q,j){return j==null?'(no answer)':(q.c.length==2?'':L[j]+'. ')+q.c[j]}
function submit(){if(done)return;done=true;clearInterval(tid);let s=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i),bs=d.querySelectorAll('.ch'),ok=ans[i]===q.a;if(ok)s++;
d.classList.add(ok?'right':'wrong');bs[q.a].classList.add('ok');if(!ok&&ans[i]!=null)bs[ans[i]].classList.add('bad');
const e=document.createElement('div');e.className='ex';e.textContent=(ok?'Correct. ':'Wrong. Correct answer: '+lab(q,q.a)+'. ')+q.x+' (Ch. '+q.ch+')';d.appendChild(e)});
document.getElementById('score').textContent=`Score: ${s} / ${Q.length} (${Math.round(100*s/Q.length)}%)`;const r=document.getElementById('res');r.hidden=false;document.getElementById('sub').hidden=true;window.scrollTo(0,0)}
document.getElementById('sub').onclick=()=>{const n=Q.length-Object.keys(ans).length;if(n&&!confirm(n+' unanswered. Submit anyway?'))return;submit()};
document.getElementById('copy').onclick=()=>{const t=Q.map((q,i)=>ans[i]===q.a?null:`Q${i+1}: ${q.q}\nMy answer: ${lab(q,ans[i])}\nCorrect: ${lab(q,q.a)}\nChapter ${q.ch}`).filter(Boolean).join('\n\n')||'No wrong answers!';
const m=document.getElementById('msg');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent='Copied.',()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();m.textContent='Copied.'})};
document.getElementById('retake').onclick=()=>{ans={};done=false;clearInterval(tid);document.getElementById('timer').textContent='';document.getElementById('tbtn').hidden=false;document.getElementById('res').hidden=true;document.getElementById('sub').hidden=false;document.getElementById('msg').textContent='';render();window.scrollTo(0,0)};
document.getElementById('tbtn').onclick=e=>{e.target.hidden=true;let t=3600;const el=document.getElementById('timer');const f=()=>{el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t--<=0){clearInterval(tid);alert('Time is up!');submit()}};f();tid=setInterval(f,1000)};
render();</script></body></html>
