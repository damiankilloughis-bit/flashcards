<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENG-205 Practice — Midsummer Acts 3–4</title>
<style>:root{--bg:#111418;--panel:#1a1f27;--panel2:#222935;--line:#2c3441;--text:#e6e9ef;--muted:#9aa4b2;--accent:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 80px}.top{position:sticky;top:0;background:var(--bg);padding:12px 0;display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:18px;margin:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}.btn.p{background:#1d4ed8;border-color:#2563eb}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}.qn{color:var(--muted);font-size:13px}
.ch{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px}
.tf{display:flex;gap:8px}.tf .ch{text-align:center}.ch.sel{border-color:var(--accent);background:#1e3a5f}.ch.ok{border-color:#22c55e;background:rgba(34,197,94,.18)}.ch.bad{border-color:#ef4444;background:rgba(239,68,68,.18)}
.card.right{border-color:#22c55e}.card.wrong{border-color:#ef4444}.ex{margin-top:8px;color:var(--muted);font-size:14px}#score{font-size:20px;font-weight:600}#timer{font-variant-numeric:tabular-nums}.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}</style></head>
<body><div class="wrap"><div class="top"><h1>ENG-205 Practice — Midsummer Acts 3–4</h1><div><span id="timer"></span> <button class="btn" id="tbtn">Start 15:00 timer</button></div></div>
<div id="res" class="card" hidden><div id="score"></div><div class="row"><button class="btn" id="copy">Copy my wrong answers</button><button class="btn" id="retake">Retake</button></div><div id="msg" class="ex"></div></div>
<div id="qs"></div><div class="row"><button class="btn p" id="sub">Submit</button></div></div>
<script>const Q=[{"q": "Where does Act 3, Scene 1 of the Cummings edition open?", "c": ["Athens. A room in Quince's house.", "A wood, with Titania lying asleep.", "Athens. An apartment in the palace of Theseus.", "The temple, just after the three marriages."], "a": 1, "x": "The heading is “A Wood. TITANIA lying asleep,” after which Quince, Snug, Bottom, Flute, Snout, and Starveling enter to rehearse.", "w": ["That is the setting of Act 1, Scene 2 and Act 4, Scene 2, not 3.1.", null, "That is the setting of Act 5, Scene 1.", "The marriages are decided in Act 4 and celebrated in Act 5; they have not happened yet in 3.1."]}, {"q": "What does Peter Quince call the hawthorn-brake the mechanicals will use?", "c": ["their tiring-house", "their green-plot stage", "their wedding almanack", "Ninus' royal tomb"], "a": 0, "x": "Quince says, “This green plot shall be our stage, this hawthorn-brake our tiring-house,” meaning a dressing room, an “attiring” room.", "w": [null, "The green plot is their stage, not the hawthorn-brake.", "Bottom later asks for a calendar or almanack to “find out moonshine.”", "Ninus' tomb is the meeting place in the story of Pyramus and Thisbe, which Flute misnames “Ninny’s tomb.”"]}, {"q": "Bottom wants a prologue mainly because", "c": ["Snug cannot roar loudly enough to be heard in the palace.", "the ladies cannot abide Pyramus killing himself.", "the duke has already heard the battle with the Centaurs.", "Flute refuses to play a woman's part before the duke."], "a": 1, "x": "He says there are things in the comedy “that will never please. First Pyramus must draw a sword to kill himself, which the ladies cannot abide.” The prologue should say they will do no harm and that he is Bottom the weaver, not Pyramus.", "w": ["The lion is a later worry; the first reason for a prologue is the suicide.", null, "Theseus rejects the Centaurs entertainment in Act 5; it is not Bottom's concern here.", "Flute does play Thisbe; in this scene his problem is speaking all his part at once, not refusing the role."]}, {"q": "How do the mechanicals plan to “present Wall”?", "c": ["They will leave a casement of the great chamber-window open.", "A man will carry a bush of thorns and a lanthorn.", "A man will wear plaster or loam and hold his fingers in a cranny.", "They will draw a curtain across the green plot to stand for stone."], "a": 2, "x": "Bottom says some man must present Wall with plaster, loam, or rough-cast, “and let him hold his fingers thus,” so Pyramus and Thisbe can whisper through that cranny.", "w": ["The open casement is one plan for real moonlight, not for Wall.", "The bush of thorns and lanthorn are for the person of Moonshine.", null, "No curtain is proposed; Wall is a man wearing building materials."]}, {"q": "When Bottom says, “Thisby, the flowers have odious savours sweet,” Quince corrects him to", "c": ["odours", "odium", "odyssey", "odorous"], "a": 3, "x": "Quince says, “Odorous, odorous.” In the Cummings text, “odious” means hateful, and Quince wants the word for a sweet smell.", "w": ["Bottom then repeats “odours savours sweet,” but the correction Quince gives is “odorous.”", "Odium would still mean hatred, which is the problem with “odious.”", "That word is not in the exchange.", null]}, {"q": "What does Puck fix on Bottom’s head during the rehearsal?", "c": ["a coronet of musk-roses", "an ass’s nole", "a lion’s mane of loam and rough-cast", "a hawthorn wreath from the tiring-house"], "a": 1, "x": "Puck later tells Oberon, “An ass’s nole I fixed on his head.” The stage direction in 3.1 is “Re-enter PUCK, and BOTTOM with an ass’s head.”", "w": ["Titania sticks musk-roses in Bottom’s head later, in Act 4, Scene 1, after he already has the ass’s head.", null, "Loam and rough-cast are for the actor playing Wall, not for Bottom’s transformation.", "The hawthorn-brake is only their tiring-house; Puck does not wreath Bottom with it."]}, {"q": "What are Titania’s first words when she wakes in Act 3, Scene 1?", "c": ["“Methought I was enamour’d of an ass.”", "“Bless thee, Bottom! bless thee! thou art translated.”", "“What angel wakes me from my flowery bed?”", "“Tie up my love’s tongue, bring him silently.”"], "a": 2, "x": "Waking to Bottom’s song, she asks, “What angel wakes me from my flowery bed?” (3.1.65), then swears she loves him on first view.", "w": ["She says this later, in 4.1.60, after Oberon releases her with Dian’s bud.", "This is Quince’s line when he sees the ass’s head (3.1.60).", null, "This is her last command in the scene, to the fairies leading Bottom to her bower (3.1.115)."]}, {"q": "Which of the following is NOT one of the four fairies Titania calls to attend on Bottom?", "c": ["Peaseblossom", "Cobweb", "Moonshine", "Mustardseed"], "a": 2, "x": "She calls “Peaseblossom! Cobweb! Moth! and Mustardseed!” Moonshine is a part in the mechanicals’ play, later taken by Starveling, not a fairy servant.", "w": ["Peaseblossom is the first fairy she names.", "Cobweb is the second; Bottom later jokes about using a cobweb on a cut finger.", null, "Mustardseed is the fourth; Bottom jokes that beef has “devoured many a gentleman of your house.”"]}, {"q": "At the beginning of Act 3, Scene 2, before Oberon charms Demetrius, who loves whom?", "c": ["Both Lysander and Demetrius already love Helena.", "Both men still love Hermia, and Helena loves Demetrius.", "Lysander again loves Hermia, and Demetrius already loves Helena.", "Lysander loves Helena, and Demetrius still loves Hermia."], "a": 3, "x": "Puck has already anointed Lysander by mistake in Act 2, so Lysander is pursuing Helena, but Demetrius still enters with Hermia. Puck says, “This is the woman; but not this the man.”", "w": ["Both men love Helena only after Oberon charms sleeping Demetrius later in this scene.", "Lysander no longer loves Hermia at this point; the misapplied juice has turned him to Helena.", "That pairing is the restored state after Puck remedies Lysander in 4.1, not the start of 3.2.", null]}, {"q": "Who says, “Lord, what fools these mortals be!” (3.2.120)?", "c": ["Oberon", "Bottom", "Titania", "Puck"], "a": 3, "x": "Puck says it as he and Oberon stand aside to watch Lysander plead with Helena, just before Demetrius wakes and woos her too.", "w": ["Oberon is present and tells Puck to “stand aside,” but the “fools” line is Puck’s.", "Bottom is with Titania and does not speak this line.", "Titania is in her bower with Bottom in this part of the act.", null]}, {"q": "After Demetrius wakes in Act 3, Scene 2, both he and Lysander woo Helena.", "c": ["True", "False"], "a": 0, "x": "Oberon has just charmed Demetrius’s eyes, so Demetrius wakes and calls Helena “goddess, nymph, perfect, divine!” Lysander is already juice-struck from Act 2, and both men now vow love to her.", "w": [null, "The double wooing is the main comic tangle of the scene; it is not false."]}, {"q": "Helena says of Hermia, “And though she be but little, she is”", "c": ["shrewd", "fierce", "curst", "fond"], "a": 1, "x": "In 3.2.343 Helena says, “She was a vixen when she went to school: / And though she be but little, she is fierce.” Hermia hears it as another insult about her height.", "w": ["Helena is not praising Hermia’s beauty in this line.", null, "The word in the line is “fierce,” not “false.”", "“Fond” appears elsewhere in the play in the sense of foolish, but not in this line."]}, {"q": "How does Puck keep Lysander and Demetrius from fighting a duel?", "c": ["He leads them astray in fog, mimicking each man's voice.", "He anoints both men’s eyes with Dian’s bud at the same moment.", "He has Titania’s fairies bind them with musk-roses and honeysuckle.", "He calls Theseus’s huntsmen to wake them with horns."], "a": 0, "x": "Oberon tells him to cover the “starry welkin” with fog “as black as Acheron,” “frame thy tongue” like each man, and lead them until “death-counterfeiting sleep” comes. Only then does Puck remedy Lysander’s eyes.", "w": [null, "Dian’s bud is what Oberon later uses on Titania, not on both men here; Lysander gets a separate remedy, and Demetrius is left in love with Helena.", "The musk-roses and ivy/honeysuckle images belong to Titania’s doting on Bottom, not to the duel.", "The huntsmen’s horns wake the lovers in Act 4, Scene 1, after they are already asleep."]}, {"q": "Titania gives Oberon the changeling boy", "c": ["only after Dian’s bud has restored her usual sight.", "in exchange for Oberon’s promise to leave Bottom unharmed.", "while she is still charmed and doting on Bottom.", "at Theseus’s temple on the wedding day."], "a": 2, "x": "In 4.1 Oberon tells Puck that, after taunting her, “I then did ask of her her changeling child; / Which straight she gave me,” and “now I have the boy, I will undo / This hateful imperfection of her eyes.” The gift comes before the remedy.", "w": ["He releases her with Dian’s bud only after he already has the boy.", "No such bargain is stated; he upbraids her and she yields the child while still under the spell.", null, "The boy is taken to Oberon’s bower in fairy land, not to the Athenian temple."]}, {"q": "When the four lovers wake before Theseus in Act 4, Scene 1, he", "c": ["enforces Athenian law and sends Hermia to a nunnery.", "overbears Egeus's will so the three couples can be married.", "orders Demetrius to marry Hermia, as Egeus first asked.", "postpones all marriages until the next new moon."], "a": 1, "x": "After Demetrius says his love for Hermia has “melted as doth the snow” and that he was betrothed to Helena “ere I saw Hermia,” Theseus says, “Egeus, I will overbear your will,” and “These couples shall eternally be knit.”", "w": ["That was the threat in Act 1 if Hermia refused Demetrius; Theseus now sets it aside.", null, "Demetrius no longer wants Hermia, and Theseus accepts the new pairings.", "The original wedding to Hippolyta was “four happy days” off in Act 1; here Theseus takes them to the temple “by and by.”"]}];
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function reshuffle(){shuf(Q);Q.forEach(q=>{const o=shuf(q.c.map((_,i)=>i));const c=o.map(i=>q.c[i]),w=o.map(i=>q.w[i]);q.a=o.indexOf(q.a);q.c=c;q.w=w})}
reshuffle();L="ABCD";let ans={},done=false,tid=null;
function render(){const box=document.getElementById('qs');box.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='card';d.id='q'+i;
d.innerHTML=`<div class="qn">Question ${i+1} of ${Q.length}</div><div>${q.q}</div>`;const w=document.createElement('div');if(q.c.length==2)w.className='tf';
q.c.forEach((c,j)=>{const b=document.createElement('button');b.className='ch';b.textContent=(q.c.length==2?'':L[j]+'. ')+c;b.onclick=()=>{if(done)return;ans[i]=j;[...w.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};w.appendChild(b)});
d.appendChild(w);box.appendChild(d)})}
function lab(q,j){return j==null?'(no answer)':(q.c.length==2?'':L[j]+'. ')+q.c[j]}
function submit(){if(done)return;done=true;clearInterval(tid);let s=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i),bs=d.querySelectorAll('.ch'),ok=ans[i]===q.a;if(ok)s++;
d.classList.add(ok?'right':'wrong');bs[q.a].classList.add('ok');if(!ok&&ans[i]!=null)bs[ans[i]].classList.add('bad');
const e=document.createElement('div');e.className='ex';
let msg;
if(ok){msg='Correct. '+q.x;}
else if(ans[i]!=null){msg='Wrong. Your answer ('+lab(q,ans[i])+'): '+q.w[ans[i]]+' Correct answer: '+lab(q,q.a)+'. '+q.x;}
else{msg='Wrong. Correct answer: '+lab(q,q.a)+'. '+q.x;}
const wl=q.w.map((r,j)=>j!==q.a&&r?'\n• '+lab(q,j)+' — '+r:'').join('');e.style.whiteSpace='pre-line';e.textContent=msg+(wl?'\nWhy the other choices are wrong:'+wl:'');d.appendChild(e)});
document.getElementById('score').textContent=`Score: ${s} / ${Q.length} (${Math.round(100*s/Q.length)}%)`;const r=document.getElementById('res');r.hidden=false;document.getElementById('sub').hidden=true;window.scrollTo(0,0)}
document.getElementById('sub').onclick=()=>{const n=Q.length-Object.keys(ans).length;if(n&&!confirm(n+' unanswered. Submit anyway?'))return;submit()};
document.getElementById('copy').onclick=()=>{const t=Q.map((q,i)=>ans[i]===q.a?null:`Q${i+1}: ${q.q}\nMy answer: ${lab(q,ans[i])}\nCorrect: ${lab(q,q.a)}`).filter(Boolean).join('\n\n')||'No wrong answers!';
const m=document.getElementById('msg');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent='Copied.',()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();m.textContent='Copied.'})};
document.getElementById('retake').onclick=()=>{ans={};reshuffle();done=false;clearInterval(tid);document.getElementById('timer').textContent='';document.getElementById('tbtn').hidden=false;document.getElementById('res').hidden=true;document.getElementById('sub').hidden=false;document.getElementById('msg').textContent='';render();window.scrollTo(0,0)};
document.getElementById('tbtn').onclick=e=>{e.target.hidden=true;let t=900;const el=document.getElementById('timer');const f=()=>{el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t--<=0){clearInterval(tid);alert('Time is up!');submit()}};f();tid=setInterval(f,1000)};
render();</script></body></html>
