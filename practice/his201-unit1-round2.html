<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS-201 Unit 1 Practice Exam Round 2</title>
<style>:root{--bg:#111418;--panel:#1a1f27;--panel2:#222935;--line:#2c3441;--text:#e6e9ef;--muted:#9aa4b2;--accent:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 80px}.top{position:sticky;top:0;background:var(--bg);padding:12px 0;display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:18px;margin:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}.btn.p{background:#1d4ed8;border-color:#2563eb}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}.qn{color:var(--muted);font-size:13px}
.ch{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px}
.tf{display:flex;gap:8px}.tf .ch{text-align:center}.ch.sel{border-color:var(--accent);background:#1e3a5f}.ch.ok{border-color:#22c55e;background:rgba(34,197,94,.18)}.ch.bad{border-color:#ef4444;background:rgba(239,68,68,.18)}
.card.right{border-color:#22c55e}.card.wrong{border-color:#ef4444}.ex{margin-top:8px;color:var(--muted);font-size:14px}#score{font-size:20px;font-weight:600}#timer{font-variant-numeric:tabular-nums}.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}</style></head>
<body><div class="wrap"><div class="top"><h1>HIS-201 Unit 1 Practice — Round 2</h1><div><span id="timer"></span> <button class="btn" id="tbtn">Start 60:00 timer</button></div></div>
<div id="res" class="card" hidden><div id="score"></div><div class="ex">Tip: Before picking "All these answers are correct," confirm every choice.</div><div class="row"><button class="btn" id="copy">Copy my wrong answers</button><button class="btn" id="retake">Retake</button></div><div id="msg" class="ex"></div></div>
<div id="qs"></div><div class="row"><button class="btn p" id="sub">Submit</button></div><p class="ex"><a style="color:var(--accent)" href="../">Back to flashcards</a></p></div>
<script>const Q=[{"q": "Based on interpreting information from the text, which crop did Mesoamerican pioneers domesticate FIRST, about 10,000 years ago?", "c": ["Squash", "Corn", "Beans", "Tomatoes"], "a": 0, "x": "Squash came first; beans, tomatoes and especially corn were added later.", "ch": 1}, {"q": "T/F: The Algonquins lived along the Atlantic coast and Great Lakes in smaller communities than the Muskogeans or Iroquois.", "c": ["True", "False"], "a": 0, "x": "The book says Algonquin communities were smaller.", "ch": 1}, {"q": "_____ promoted Portuguese maritime interests, Catholicism, and opposition to Islam\u2014funding voyages and founding a maritime school to defeat the Atlantic current problem.", "c": ["Ferdinand of Aragon", "Henry VII of England", "Mehmet II", "Prince Henry 'the Navigator'"], "a": 3, "x": "Prince Henry the Navigator.", "ch": 2}, {"q": "Which of the following IS NOT among the ways English colonizers treated the conquered Catholic Irish?", "c": ["They denied them land and offices", "They denied them juries and testimony", "They granted Irish Catholics seats in Parliament", "They denied them trades and weapons"], "a": 2, "x": "The English denied the Irish land, offices, juries, testimony, trades and weapons.", "ch": 2}, {"q": "T/F: Spain's Crown claimed one-tenth of the silver extracted in Spanish America.", "c": ["True", "False"], "a": 1, "x": "The Crown claimed one-FIFTH.", "ch": 2}, {"q": "Which of the following accurately describes Captain John Smith at Jamestown?", "c": ["He briefly imposed order", "He bullied Indians for food", "He returned to England in 1609 after an accidental gunpowder injury", "All these answers are correct"], "a": 3, "x": "All three are in the book.", "ch": 3}, {"q": "James Oglethorpe's Georgia trustees did all of the following EXCEPT:", "c": ["Import enslaved Africans from Barbados to start rice plantations", "Give land rather than sell it", "Cap holdings at 500 acres", "Ban hard liquor"], "a": 0, "x": "Trustees banned slavery at first.", "ch": 3}, {"q": "Rivals derided New France as a 'comptoir,' meaning:", "c": ["A Catholic mission town", "A storehouse for the skins of dead animals", "A military fortress", "A royal colony"], "a": 1, "x": "Comptoir = storehouse for skins of dead animals.", "ch": 4}, {"q": "Low death rates and high birthrates made early New England's population double about every:", "c": ["10 years", "50 years", "100 years", "27 years"], "a": 3, "x": "Doubled about every 27 years.", "ch": 4}, {"q": "T/F: New Amsterdam became New York in 1664 when the Dutch sold the colony to William Penn.", "c": ["True", "False"], "a": 1, "x": "English CONQUEST turned New Amsterdam into New York.", "ch": 4}, {"q": "After the Glorious Revolution, Massachusetts's new 1691 charter did all of the following EXCEPT:", "c": ["Restore the Dominion of New England", "Make Massachusetts a royal colony with a Crown-appointed governor", "Impose religious toleration", "Make property ownership rather than church membership the basis of voting"], "a": 0, "x": "William and Mary dismantled the Dominion; the 1691 charter did the other three.", "ch": 4}, {"q": "Which group believed that the state should guarantee freedom of worship to all?", "c": ["John Winthrop's Puritans", "The Plymouth Separatists", "William Penn's Quakers", "The French Jesuits"], "a": 2, "x": "Quaker toleration.", "ch": 4}, {"q": "It may be argued that Spain built missions and presidios in Texas primarily because:", "c": ["Russians were moving south from Alaska", "English traders had reached the Rio Grande", "News of La Salle's French colony convinced Spanish officials that the French could threaten New Spain and its silver mines", "All these answers are correct"], "a": 2, "x": "Texas responded to La Salle; Russians spurred California. Not all are correct.", "ch": 5}, {"q": "Backcountry families were largely self-sufficient because:", "c": ["Colonial law banned backcountry trade", "Seaport merchants refused their crops", "They had many slaves", "There were no roads or navigable rivers to send crops to market"], "a": 3, "x": "No roads or navigable rivers to markets.", "ch": 5}, {"q": "The authors of your text suggest that the Great Awakening was, in part, a reaction against:", "c": ["Catholicism", "Quakerism", "Rational Christianity", "The Navigation Acts"], "a": 2, "x": "The Awakening partly reacted against rational Christianity.", "ch": 5}, {"q": "T/F: Under English law, if a father died without a will, his daughter inherited land equally with her brothers.", "c": ["True", "False"], "a": 1, "x": "The ELDEST SON inherited all land and buildings.", "ch": 5}, {"q": "Which peoples could be matrilineal, with women owning land, tools, and children?", "c": ["The Algonquins", "The Natchez and Iroquois", "The Taino", "The Navajos"], "a": 1, "x": "Natchez and Iroquois could be matrilineal; Algonquins were patrilineal.", "ch": 1}, {"q": "The distinctive buildings of the Iroquois and Hurons were:", "c": ["Longhouses\u2014some 100 feet long, sheltering up to 10 families", "Temple mounds", "Cliff dwellings", "Great Houses like Pueblo Bonito"], "a": 0, "x": "Longhouses, not temple mounds.", "ch": 1}, {"q": "Which of the following was part of the Columbian exchange?", "c": ["The transfer of American plants to Eurasia and Africa", "Escaped hogs and European rats overrunning some Caribbean islands", "The spread of Eurasian germs to the Americas", "All these answers are correct"], "a": 1, "x": "The exchange included plants, animals and germs.", "ch": 2}, {"q": "Spain's Crown prevented a colonial conquistador nobility by:", "c": ["Executing every conquistador", "Selling titles to Aztec nobles", "Retiring or outlasting conquistadors such as Francisco Pizarro", "Letting conquistadors rule as independent lords"], "a": 2, "x": "The Crown retired or outlasted conquistadors.", "ch": 2}, {"q": "In 1614 Pocahontas's marriage to John Rolfe:", "c": ["Strengthened Powhatan's relationship with the English", "Started the 1622 war", "Made Rolfe king of the confederacy", "Ended the tobacco boom"], "a": 0, "x": "It strengthened Powhatan's relationship with the English.", "ch": 3}, {"q": "Jamestown's colonists chose an inland peninsula to avoid _____, but its marshes and trees bred mosquitoes.", "c": ["French pirates", "Spanish attack", "Powhatan's warriors", "Dutch traders"], "a": 1, "x": "They chose the site to avoid Spanish attack.", "ch": 3}, {"q": "The coureurs de bois were:", "c": ["Jesuit missionaries", "Dutch fur buyers at Fort Orange", "Iroquois war chiefs", "French traders\u2014'runners in the woods'\u2014who lived among Indians"], "a": 3, "x": "Coureurs de bois = runners in the woods.", "ch": 4}, {"q": "French Jesuits who set up missions among Indian allies were fired by:", "c": ["The Counter-Reformation", "The Great Awakening", "The Enlightenment", "Predestination"], "a": 0, "x": "Jesuits were fired by the Counter-Reformation.", "ch": 4}, {"q": "Which of the following was true of first-generation New Englanders?", "c": ["They lived to an average age of about 70", "About 90 percent of children reached adulthood", "Typical families had 7\u20138 children reaching maturity", "All these answers are correct"], "a": 3, "x": "All three are in the book.", "ch": 4}, {"q": "The Dominion of New England:", "c": ["Consolidated New England colonies under a royal governor and appointed council", "Abolished the northern colonial assemblies", "Added New York and New Jersey by 1688", "All these answers are correct"], "a": 3, "x": "All three are in the book.", "ch": 4}, {"q": "The Dutch West India Company set up Fort Orange 150 miles upriver at present-day:", "c": ["Boston", "Philadelphia", "Albany", "Quebec"], "a": 2, "x": "Fort Orange = present-day Albany.", "ch": 4}, {"q": "Spain's colonization of California, its last major North American project, was sparked by fear of:", "c": ["La Salle's French colony", "English seamen", "Russians moving south from Alaska", "All these answers are correct"], "a": 2, "x": "California = fear of Russians. Not all are correct.", "ch": 5}, {"q": "About how many Scots-Irish immigrants came to the British colonies in the 1700s?", "c": ["About 25,000", "About 1 million", "About 5,000", "About 250,000"], "a": 3, "x": "About 250,000 Scots-Irish.", "ch": 5}, {"q": "Jonathan Edwards was:", "c": ["An English evangelist who toured the colonies in 1739", "Pennsylvania's leading Enlightenment inventor", "Pastor of a Congregational church in Northampton, Massachusetts, whose Calvinist preaching mixed God's grace with terrifying pictures of damnation", "A Quaker founder of Pennsylvania"], "a": 2, "x": "Edwards, Northampton Congregational pastor.", "ch": 5}, {"q": "T/F: As a widow under English law, 'Constance' recovered her full dowry plus half of the property accumulated in the marriage.", "c": ["True", "False"], "a": 1, "x": "That was Spanish 'Soledad'; Constance had no claim on her dowry and controlled one-third of her husband's property.", "ch": 5}],L="ABCD";let ans={},done=false,tid=null;
function render(){const box=document.getElementById('qs');box.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='card';d.id='q'+i;
d.innerHTML=`<div class="qn">Question ${i+1} of ${Q.length}</div><div>${q.q}</div>`;const w=document.createElement('div');if(q.c.length==2)w.className='tf';
q.c.forEach((c,j)=>{const b=document.createElement('button');b.className='ch';b.textContent=(q.c.length==2?'':L[j]+'. ')+c;b.onclick=()=>{if(done)return;ans[i]=j;[...w.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};w.appendChild(b)});
d.appendChild(w);box.appendChild(d)})}
function lab(q,j){return j==null?'(no answer)':(q.c.length==2?'':L[j]+'. ')+q.c[j]}
function submit(){if(done)return;done=true;clearInterval(tid);let s=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i),bs=d.querySelectorAll('.ch'),ok=ans[i]===q.a;if(ok)s++;
d.classList.add(ok?'right':'wrong');bs[q.a].classList.add('ok');if(!ok&&ans[i]!=null)bs[ans[i]].classList.add('bad');
const e=document.createElement('div');e.className='ex';e.textContent=(ok?'Correct. ':'Wrong. Correct answer: '+lab(q,q.a)+'. ')+q.x+' (Ch. '+q.ch+')';d.appendChild(e)});
document.getElementById('score').textContent=`Score: ${s} / ${Q.length} (${Math.round(100*s/Q.length)}%)`;const r=document.getElementById('res');r.hidden=false;document.getElementById('sub').hidden=true;window.scrollTo(0,0)}
document.getElementById('sub').onclick=()=>{const n=Q.length-Object.keys(ans).length;if(n&&!confirm(n+' unanswered. Submit anyway?'))return;submit()};
document.getElementById('copy').onclick=()=>{const t=Q.map((q,i)=>ans[i]===q.a?null:`Q${i+1}: ${q.q}\nMy answer: ${lab(q,ans[i])}\nCorrect: ${lab(q,q.a)}\nChapter ${q.ch}`).filter(Boolean).join('\n\n')||'No wrong answers!';
const m=document.getElementById('msg');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent='Copied.',()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();m.textContent='Copied.'})};
document.getElementById('retake').onclick=()=>{ans={};done=false;clearInterval(tid);document.getElementById('timer').textContent='';document.getElementById('tbtn').hidden=false;document.getElementById('res').hidden=true;document.getElementById('sub').hidden=false;document.getElementById('msg').textContent='';render();window.scrollTo(0,0)};
document.getElementById('tbtn').onclick=e=>{e.target.hidden=true;let t=3600;const el=document.getElementById('timer');const f=()=>{el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t--<=0){clearInterval(tid);alert('Time is up!');submit()}};f();tid=setInterval(f,1000)};
render();</script></body></html>
