<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS-201 Unit 1 Practice Exam Round 3</title>
<style>:root{--bg:#111418;--panel:#1a1f27;--panel2:#222935;--line:#2c3441;--text:#e6e9ef;--muted:#9aa4b2;--accent:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 80px}.top{position:sticky;top:0;background:var(--bg);padding:12px 0;display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:18px;margin:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}.btn.p{background:#1d4ed8;border-color:#2563eb}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}.qn{color:var(--muted);font-size:13px}
.ch{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px}
.tf{display:flex;gap:8px}.tf .ch{text-align:center}.ch.sel{border-color:var(--accent);background:#1e3a5f}.ch.ok{border-color:#22c55e;background:rgba(34,197,94,.18)}.ch.bad{border-color:#ef4444;background:rgba(239,68,68,.18)}
.card.right{border-color:#22c55e}.card.wrong{border-color:#ef4444}.ex{margin-top:8px;color:var(--muted);font-size:14px}#score{font-size:20px;font-weight:600}#timer{font-variant-numeric:tabular-nums}.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}</style></head>
<body><div class="wrap"><div class="top"><h1>HIS-201 Unit 1 Practice — Round 3</h1><div><span id="timer"></span> <button class="btn" id="tbtn">Start 60:00 timer</button></div></div>
<div id="res" class="card" hidden><div id="score"></div><div class="ex">Tip: Before picking "All these answers are correct," confirm every choice.</div><div class="row"><button class="btn" id="copy">Copy my wrong answers</button><button class="btn" id="retake">Retake</button></div><div id="msg" class="ex"></div></div>
<div id="qs"></div><div class="row"><button class="btn p" id="sub">Submit</button></div><p class="ex"><a style="color:var(--accent)" href="../">Back to flashcards</a></p></div>
<script>const Q=[{"q": "Of all the silver extracted in Spanish America, the share claimed by Spain's Crown was:", "c": ["One-fifth", "One-quarter", "One-half", "One-tenth"], "a": 0, "x": "The Crown claimed one-fifth.", "ch": 2}, {"q": "T/F: About 16,000 tons of silver left Spanish America for Europe during the 16th century, and Spain's Crown claimed one-fifth of the silver extracted.", "c": ["True", "False"], "a": 0, "x": "Both facts are in the book.", "ch": 2}, {"q": "Based on interpreting information from the text, Georgia's trustees recruited settlers who were:", "c": ["Debtors released in large numbers from England's prisons", "European paupers willing to work who professed Protestantism", "Barbados planters who brought enslaved Africans with them", "Catholic refugees seeking toleration like Maryland's settlers"], "a": 1, "x": "Not simply debtors; trustees recruited willing Protestant paupers.", "ch": 3}, {"q": "Georgia's trustees provided each assisted settler with:", "c": ["Passage, 100 acres, and two enslaved laborers", "Land for sale at low prices with yearly quitrents due", "Passage, 50 acres, tools, and one year of supplies", "A 500-acre estate and a seat in an assembly"], "a": 2, "x": "Trustees paid passage and gave 50 acres, tools and a year of supplies.", "ch": 3}, {"q": "T/F: Under Massachusetts's 1691 charter, church membership rather than property ownership became the basis for voting.", "c": ["True", "False"], "a": 1, "x": "The charter made PROPERTY ownership, not church membership, the basis.", "ch": 4}, {"q": "The Dominion of New England came to an end when:", "c": ["James II expanded it to include Pennsylvania and Maryland", "Metacom's War destroyed its royal governor's authority", "Parliament repealed all of the Navigation Acts after the year 1700", "William and Mary dismantled it after the Glorious Revolution"], "a": 3, "x": "William and Mary dismantled the Dominion.", "ch": 4}, {"q": "James II's Dominion of New England:", "c": ["Abolished all of the northern colonial assemblies", "Placed the colonies under a royal governor and council", "Added New York and New Jersey to the union by 1688", "All these answers are correct"], "a": 3, "x": "All three: the book lists each.", "ch": 4}, {"q": "After the Glorious Revolution, William and Mary:", "c": ["Dismantled the Dominion of New England", "Reinstated the northern representative assemblies", "Gave Massachusetts a new royal charter in 1691", "All these answers are correct"], "a": 3, "x": "All three: the book lists each.", "ch": 4}, {"q": "Under Spanish law, a widow like 'Soledad' recovered:", "c": ["Only her clothes and jewelry, called her 'paraphernalia'", "Her full dowry plus at least half the marital property", "Control of one-third of her husband's property for life", "Nothing at all unless her husband left a written will"], "a": 1, "x": "Spanish widows got the dowry back plus at least one-half of marital property.", "ch": 5}, {"q": "T/F: Under English law, when a father died without a will, his eldest son inherited all land and buildings.", "c": ["True", "False"], "a": 0, "x": "The eldest son inherited all land and buildings.", "ch": 5}, {"q": "T/F: Among the matrilineal Natchez and Iroquois, women owned land, tools, and children.", "c": ["True", "False"], "a": 0, "x": "The book says so of both peoples.", "ch": 1}, {"q": "A single Iroquois or Huron longhouse could shelter as many as:", "c": ["2 families", "100 families", "10 families", "90 families"], "a": 2, "x": "Up to 10 families, in longhouses up to 100 feet long.", "ch": 1}, {"q": "Jamestown's 104 colonists chose an inland peninsula mainly to:", "c": ["Avoid attack by Spanish ships", "Avoid raids by Powhatan's warriors", "Gain fresh water for tobacco", "All these answers are correct"], "a": 0, "x": "They chose it to avoid Spanish attack; not all are correct.", "ch": 3}, {"q": "The Counter-Reformation that fired the French Jesuits was:", "c": ["A movement by Calvinists to purge bishops and ceremony", "A movement by Lutherans to spread justification by faith", "A movement by Quakers to follow their inner Light Within", "A movement by devout Catholics to correct church abuses"], "a": 3, "x": "The book's definition of the Counter-Reformation.", "ch": 4}, {"q": "Like Texas and Florida, California was sparked by fear of foreign competition\u2014in this case from:", "c": ["Frenchmen", "Englishmen", "Russians", "Dutchmen"], "a": 2, "x": "Russians moving south from Alaska.", "ch": 5}, {"q": "T/F: About 135,000 Scots-Irish arrived in the 1700s, outnumbering the roughly 250,000 Germans.", "c": ["True", "False"], "a": 1, "x": "About 250,000 SCOTS-IRISH and about 135,000 GERMANS.", "ch": 5}, {"q": "This Northampton, Massachusetts, pastor's Calvinist preaching mixed God's grace with terrifying pictures of eternal damnation:", "c": ["George Whitefield", "Jonathan Edwards", "Benjamin Franklin", "Roger Williams"], "a": 1, "x": "Jonathan Edwards.", "ch": 5}, {"q": "George Whitefield began his first American preaching tour in:", "c": ["1739", "1729", "1692", "1754"], "a": 0, "x": "Whitefield's first tour was 1739.", "ch": 5}, {"q": "Spanish silver mining required capitalist investment in:", "c": ["Sugar mills, slaves, and caravels", "Tobacco presses and servants", "Fur posts, guns, and trade cloth", "Stamp mills, pumps, and mercury"], "a": 3, "x": "Stamp mills, water-powered crushers, pumps and mercury.", "ch": 2}, {"q": "After the trustees repealed their limits, royal Georgia developed:", "c": ["A rice-and-Indian-trade economy like South Carolina's", "A tobacco economy like that of Virginia and Maryland", "A sugar economy like that of Barbados and Jamaica", "A fur economy like New France's along the St. Lawrence"], "a": 0, "x": "Royal Georgia came to resemble South Carolina.", "ch": 3}],L="ABCD";let ans={},done=false,tid=null;
function render(){const box=document.getElementById('qs');box.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='card';d.id='q'+i;
d.innerHTML=`<div class="qn">Question ${i+1} of ${Q.length}</div><div>${q.q}</div>`;const w=document.createElement('div');if(q.c.length==2)w.className='tf';
q.c.forEach((c,j)=>{const b=document.createElement('button');b.className='ch';b.textContent=(q.c.length==2?'':L[j]+'. ')+c;b.onclick=()=>{if(done)return;ans[i]=j;[...w.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};w.appendChild(b)});
d.appendChild(w);box.appendChild(d)})}
function lab(q,j){return j==null?'(no answer)':(q.c.length==2?'':L[j]+'. ')+q.c[j]}
function submit(){if(done)return;done=true;clearInterval(tid);let s=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i),bs=d.querySelectorAll('.ch'),ok=ans[i]===q.a;if(ok)s++;
d.classList.add(ok?'right':'wrong');bs[q.a].classList.add('ok');if(!ok&&ans[i]!=null)bs[ans[i]].classList.add('bad');
const e=document.createElement('div');e.className='ex';e.textContent=(ok?'Correct. ':'Wrong. Correct answer: '+lab(q,q.a)+'. ')+q.x+' (Ch. '+q.ch+')';d.appendChild(e)});
document.getElementById('score').textContent=`Score: ${s} / ${Q.length} (${Math.round(100*s/Q.length)}%)`;const r=document.getElementById('res');r.hidden=false;document.getElementById('sub').hidden=true;window.scrollTo(0,0)}
document.getElementById('sub').onclick=()=>{const n=Q.length-Object.keys(ans).length;if(n&&!confirm(n+' unanswered. Submit anyway?'))return;submit()};
document.getElementById('copy').onclick=()=>{const t=Q.map((q,i)=>ans[i]===q.a?null:`Q${i+1}: ${q.q}\nMy answer: ${lab(q,ans[i])}\nCorrect: ${lab(q,q.a)}\nChapter ${q.ch}`).filter(Boolean).join('\n\n')||'No wrong answers!';
const m=document.getElementById('msg');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent='Copied.',()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();m.textContent='Copied.'})};
document.getElementById('retake').onclick=()=>{ans={};done=false;clearInterval(tid);document.getElementById('timer').textContent='';document.getElementById('tbtn').hidden=false;document.getElementById('res').hidden=true;document.getElementById('sub').hidden=false;document.getElementById('msg').textContent='';render();window.scrollTo(0,0)};
document.getElementById('tbtn').onclick=e=>{e.target.hidden=true;let t=3600;const el=document.getElementById('timer');const f=()=>{el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t--<=0){clearInterval(tid);alert('Time is up!');submit()}};f();tid=setInterval(f,1000)};
render();</script></body></html>
