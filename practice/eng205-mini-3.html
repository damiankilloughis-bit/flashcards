<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENG-205 Mini Quiz — Part 3: Sir Gawain</title>
<style>:root{--bg:#111418;--panel:#1a1f27;--panel2:#222935;--line:#2c3441;--text:#e6e9ef;--muted:#9aa4b2;--accent:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 80px}.top{position:sticky;top:0;background:var(--bg);padding:12px 0;display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:18px;margin:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}.btn.p{background:#1d4ed8;border-color:#2563eb}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}.qn{color:var(--muted);font-size:13px}
.ch{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px}
.tf{display:flex;gap:8px}.tf .ch{text-align:center}.ch.sel{border-color:var(--accent);background:#1e3a5f}.ch.ok{border-color:#22c55e;background:rgba(34,197,94,.18)}.ch.bad{border-color:#ef4444;background:rgba(239,68,68,.18)}
.card.right{border-color:#22c55e}.card.wrong{border-color:#ef4444}.ex{margin-top:8px;color:var(--muted);font-size:14px}#score{font-size:20px;font-weight:600}#timer{font-variant-numeric:tabular-nums}.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}</style></head>
<body><div class="wrap"><div class="top"><h1>ENG-205 Mini Quiz — Part 3: Sir Gawain</h1><div><span id="timer"></span> <button class="btn" id="tbtn">Start 15:00 timer</button></div></div>
<div id="res" class="card" hidden><div id="score"></div><div class="row"><button class="btn" id="copy">Copy my wrong answers</button><button class="btn" id="retake">Retake</button></div><div id="msg" class="ex"></div></div>
<div id="qs"></div><div class="row"><button class="btn p" id="sub">Submit</button></div></div><script>const Q=[{"q": "What does the Green Knight carry into Arthur's hall?", "c": ["Holly and an axe", "A green girdle and a lance", "A pentangle shield and a sword", "A hunting horn and a fox skin"], "a": 0, "ch": "3", "x": "The holly shows he comes in peace; the axe is for the game.", "w": [null, "The girdle belongs to Fitt III.", "The pentangle is Gawain's.", "The fox belongs to Bertilak's third hunt."]}, {"q": "Who first grabs the axe before Gawain steps in?", "c": ["King Arthur", "Sir Lancelot", "Bertilak", "Guinevere"], "a": 0, "ch": "3", "x": "Stung by the Green Knight's mockery, Arthur takes the axe until Gawain asks to take his place.", "w": [null, "Not in the poem's account.", "Bertilak is the Green Knight himself.", "She doesn't take the axe."]}, {"q": "Which is one of the pentangle's \"five fives\"?", "c": ["Christ's five wounds", "The five husbands of the lady", "The five gifts from Arthur's court", "The five days of his winter journey"], "a": 0, "ch": "3", "x": "His faith rests on the five wounds; the others are five senses, five fingers, five joys of Mary, and five virtues.", "w": [null, "That's the Wife of Bath's history.", "Not part of the pentangle.", "Not a set in the pentangle."]}, {"q": "In Armitage, the fifth set of five virtues includes", "c": ["friendship, fraternity, purity, politeness, pity", "courage, strength, wealth, fame, and beauty of form", "prayer, fasting, alms, penance, pilgrimage", "loyalty, glory, revenge, gift-giving, and kinship"], "a": 0, "ch": "3", "x": "The last five are social and moral virtues of the perfect knight.", "w": [null, "Not the poem's list.", "Not the poem's list.", "Those sound like Beowulf's heroic code."]}, {"q": "When does the lady give Gawain three kisses and the girdle?", "c": ["Third morning, fox-hunt day", "On the first morning, the day of the deer hunt", "On the second morning, the day of the boar hunt", "On New Year's morning, at the Green Chapel"], "a": 0, "ch": "3", "x": "Day three: three kisses and the girdle, while Bertilak hunts the fox.", "w": [null, "Day one: one kiss.", "Day two: two kisses.", "She isn't at the chapel."]}, {"q": "What does Gawain refuse from the lady on the third day before accepting the girdle?", "c": ["A ring", "A sword", "A horse", "A shield"], "a": 0, "ch": "3", "x": "He turns down a rich ring, then accepts the girdle after hearing it protects life.", "w": [null, "Not offered.", "Gringolet is already his.", "Not offered."]}, {"q": "Exactly what Gawain hands Bertilak on the third evening:", "c": ["three kisses, no girdle", "three kisses and the girdle", "the girdle but no kisses", "nothing, claiming he won nothing"], "a": 0, "ch": "3", "x": "He breaks the bargain by keeping the girdle secret.", "w": [null, "He hides the girdle.", "He gives the kisses.", "He gives the kisses."]}, {"q": "Why does the first swing at the Green Chapel stop?", "c": ["Gawain flinches", "The axe blade breaks on the stone", "Morgan le Fay appears and stops him", "Gawain shows him the pentangle"], "a": 0, "ch": "3", "x": "The knight holds off when Gawain shrinks from the blade.", "w": [null, "The axe doesn't break.", "She never appears at the chapel.", "Not what happens."]}, {"q": "The Green Knight compares Gawain to other knights as", "c": ["a pearl beside peas", "a lion among lambs", "a fox among hounds", "gold beside rusty iron"], "a": 0, "ch": "3", "x": "He's \"by the far the most faultless fellow on earth,\" lacking only some loyalty because he loved his life.", "w": [null, "Not the poem's image.", "Not the poem's image.", "Not the poem's image."]}, {"q": "Morgan le Fay's two aims in sending the Green Knight were to", "c": ["test Camelot's pride and scare Guinevere", "kill Arthur and take his crown", "marry Gawain to the lady of the castle", "steal Gawain's pentangle shield"], "a": 0, "ch": "3", "x": "Bertilak says she put pride on trial and hoped Guinevere would die of fright.", "w": [null, "Not her stated plot.", "The lady is Bertilak's wife.", "Not her plot."]}];function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function reshuffle(){shuf(Q);Q.forEach(q=>{const o=shuf(q.c.map((_,i)=>i));const c=o.map(i=>q.c[i]),w=o.map(i=>q.w[i]);q.a=o.indexOf(q.a);q.c=c;q.w=w})}reshuffle();L="ABCD";let ans={},done=false,tid=null;
function render(){const box=document.getElementById('qs');box.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='card';d.id='q'+i;
d.innerHTML=`<div class="qn">Question ${i+1} of ${Q.length}</div><div>${q.q}</div>`;const w=document.createElement('div');if(q.c.length==2)w.className='tf';
q.c.forEach((c,j)=>{const b=document.createElement('button');b.className='ch';b.textContent=(q.c.length==2?'':L[j]+'. ')+c;b.onclick=()=>{if(done)return;ans[i]=j;[...w.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};w.appendChild(b)});
d.appendChild(w);box.appendChild(d)})}
function lab(q,j){return j==null?'(no answer)':(q.c.length==2?'':L[j]+'. ')+q.c[j]}
function submit(){if(done)return;done=true;clearInterval(tid);let s=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i),bs=d.querySelectorAll('.ch'),ok=ans[i]===q.a;if(ok)s++;
d.classList.add(ok?'right':'wrong');bs[q.a].classList.add('ok');if(!ok&&ans[i]!=null)bs[ans[i]].classList.add('bad');
const e=document.createElement('div');e.className='ex';
let msg;
if(ok){msg='Correct. '+q.x+' (Part '+q.ch+')';}
else if(ans[i]!=null){msg='Wrong. Your answer ('+lab(q,ans[i])+'): '+q.w[ans[i]]+' Correct answer: '+lab(q,q.a)+'. '+q.x+' (Part '+q.ch+')';}
else{msg='Wrong. Correct answer: '+lab(q,q.a)+'. '+q.x+' (Part '+q.ch+')';}
const wl=q.w.map((r,j)=>j!==q.a&&r?'\n• '+lab(q,j)+' — '+r:'').join('');e.style.whiteSpace='pre-line';e.textContent=msg+(wl?'\nWhy the other choices are wrong:'+wl:'');d.appendChild(e)});
document.getElementById('score').textContent=`Score: ${s} / ${Q.length} (${Math.round(100*s/Q.length)}%)`;const r=document.getElementById('res');r.hidden=false;document.getElementById('sub').hidden=true;window.scrollTo(0,0)}
document.getElementById('sub').onclick=()=>{const n=Q.length-Object.keys(ans).length;if(n&&!confirm(n+' unanswered. Submit anyway?'))return;submit()};
document.getElementById('copy').onclick=()=>{const t=Q.map((q,i)=>ans[i]===q.a?null:`Q${i+1}: ${q.q}\nMy answer: ${lab(q,ans[i])}\nCorrect: ${lab(q,q.a)}\nPart ${q.ch}`).filter(Boolean).join('\n\n')||'No wrong answers!';
const m=document.getElementById('msg');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent='Copied.',()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();m.textContent='Copied.'})};
document.getElementById('retake').onclick=()=>{ans={};reshuffle();done=false;clearInterval(tid);document.getElementById('timer').textContent='';document.getElementById('tbtn').hidden=false;document.getElementById('res').hidden=true;document.getElementById('sub').hidden=false;document.getElementById('msg').textContent='';render();window.scrollTo(0,0)};
document.getElementById('tbtn').onclick=e=>{e.target.hidden=true;let t=900;const el=document.getElementById('timer');const f=()=>{el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t--<=0){clearInterval(tid);alert('Time is up!');submit()}};f();tid=setInterval(f,1000)};
render();</script></body></html>
