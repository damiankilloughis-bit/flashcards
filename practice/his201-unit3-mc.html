<script>
const Q=[{"n": 1, "ch": "10", "st": "A post-War of 1812 program of economic centralization, designed to promote internal economic development, was pushed by a group of aggressive young Republican nationalists. Which of the following did this program NOT include?", "cc": ["Funding the war debt.", "A protective tariff.", "A national bank.", "Federal subsidies for public works projects."], "ans": "A", "r": "NOT part: Funding the war debt. The \"New Nationalism\" was a national bank (Second Bank, 1816), a protective tariff (Tariff of 1816), and internal improvements (federal support for roads and canals).", "fl": false}, {"n": 2, "ch": "10", "st": "Of the following statements, which one is the most accurate in explaining why the Panic of 1819 was so significant?", "cc": ["As the first major American depression, it affected city folk and rural Americans alike.", "The nation had never before experienced economic hard times.", "In reaction, land sales rose to speculative heights.", "It prompted a frenzy of canal building."], "ans": "A", "r": "It was the first major depression in the nation's history. When cotton prices collapsed in 1819, land values fell 50-75 percent, and it hit city people and rural Americans alike (especially new cotton planters in the Southwest).", "fl": false}, {"n": 3, "ch": "10", "st": "One of the factors contributing to the growth of urbanized life in America in the early 19th century was the arrival of immigrants.", "cc": null, "ans": "True", "r": "Immigrants added to urban growth. Immigration revived after 1815 and rose after 1830 (about 600,000 in the 1830s); 20 percent of New Yorkers were foreign-born by 1820 and half by 1850.", "fl": false}, {"n": 4, "ch": "10", "st": "The most profound economic development by mid-19c America was the", "cc": ["Development of a national banking system.", "Creation of corporations.", "Decline of the small-town merchant and the general store.", "Rise of the factory."], "ans": "D", "r": "The rise of the factory. Manufacturing shifted from the master-apprentice workshop system toward mechanization and the factory system.", "fl": true}, {"n": 5, "ch": "10", "st": "The factory system began in which industry?", "cc": ["Production of firearms.", "Whiskey distilling.", "Iron smelting.", "Textile production."], "ans": "D", "r": "Textiles (cloth). Cloth was the first manufacturing process to use machines on a large scale, and the factory system began in the Northeast, where capital, water power, and transportation were available (Lowell, MA, 1820).", "fl": false}, {"n": 6, "ch": "10", "st": "In the wake of the national market economy, which of the following became characteristic of Americans?", "cc": ["Moving away from greed and materialism.", "A belief that history was the story of inevitable social disintegration.", "The hunger for respect and recognition through the ability to make money.", "A general preoccupation with economic theory and business systems."], "ans": "C", "r": "A hunger for respect and recognition through the ability to make money. With no legal aristocracy, wealth became the sign of status (\"the almighty dollar\").", "fl": false}, {"n": 7, "ch": "10", "st": "Taken as a body of legal doctrine, the rulings of the Marshall Court", "cc": ["Expanded individual economic rights by limiting government’s role in stimulating the economy.", "Protected minority groups against the abuse of power by majorities.", "Enlarged federal power to an extraordinary degree.", "Limited the rights of private property by expanding the powers of government."], "ans": "C", "r": "They enlarged federal power. Marshall convinced the Court \"to uphold the sanctity of private property and the power of the federal government to promote economic growth\" (McCulloch, Gibbons, Dartmouth College, Fletcher v.", "fl": true}, {"n": 8, "ch": "10", "st": "In its social impact, the national market economy did all of the following EXCEPT", "cc": ["Elevate the status of workers.", "Produce greater per capita wealth in American society.", "Stimulate materialism.", "Reorganize society toward greater specialization."], "ans": "A", "r": "EXCEPT: Elevate the status of workers. Workers' status declined: work became alienating, crafts declined, and the gap between rich and poor widened, while wealth, materialism, and specialization all grew.", "fl": false}, {"n": 9, "ch": "10", "st": "A transportation network grew rapidly as investors poured capital into improvement projects, especially after the opening of the Erie Canal in New York State in 1825.", "cc": null, "ans": "True", "r": "The Erie Canal (opened 1825), not a \"Buffalo Canal.\" It ran from Albany to Buffalo, and its success led to a canal boom (more than 3,300 miles of canals by 1840).", "fl": false}, {"n": 10, "ch": "10", "st": "Which of the following was NOT characteristic of the economic changes that swept most of America in the early nineteenth century?", "cc": ["Economic activity was increasingly becoming more specialized.", "Subsistence agriculture was on the rise.", "The social structure of the nation became more stratified.", "Local economies became tied into regional and national markets."], "ans": "B", "r": "NOT characteristic: Subsistence agriculture on the rise. Farming became commercial, with regional specialization and cash and credit instead of barter.", "fl": false}, {"n": 11, "ch": "10", "st": "Which of the following is the most accurate concerning those individuals referred to as Mountain Men?", "cc": ["The mountain men illustrated that some Americans lived beyond the reach of the market economy.", "The mountain man was, in his own way, as caught up in the national integrated economic network as a farmer.", "The mountain man was usually fleeing the routines and materialistic pursuits of a market-driven “civilization.”", "The mountain man functioned as an independent businessman, vulnerable to the market but at least able to be his own boss in an enterprise not yet dominated by large eastern organizations."], "ans": "B", "r": "They were as caught up in the national economic network as farmers. The fur trade \"was not a sporting pursuit but a business,\" dominated by companies like John Jacob Astor's American Fur Company, and the trappers were \"expectant capitalists\" who went west to make money.", "fl": false}, {"n": 12, "ch": "10", "st": "The Erie Canal effectively connected the _______________ and the _______________ and rapidly proved its worth in facilitating trade across New York and the Northeast.", "cc": ["Mississippi River; Atlantic Ocean", "St. Lawrence River; Gulf of Mexico", "Great Lakes; Mississippi River", "Great Lakes; Hudson River"], "ans": "D", "r": "The Great Lakes (Lake Erie at Buffalo) and the Hudson River (at Albany), linking the West to New York City.", "fl": false}, {"n": 13, "ch": "10", "st": "Americans seemed notably materialistic to foreign visitors, since _____________ became the most obvious symbol of social status.", "cc": ["Land", "Wealth", "Home ownership", "Slave ownership"], "ans": "B", "r": "Wealth. With no legal aristocracy, wealth equaled status: \"Wealth is something substantial.", "fl": false}, {"n": 14, "ch": "10", "st": "Many Americans were marked by anxiety in the midst of their early nineteenth-century prosperity because in a national market economy plagued by cyclical depressions, prosperity seemed so fleeting.", "cc": null, "ans": "True", "r": "In a market economy with boom-and-bust cycles, prosperity seemed fleeting. Americans expected the bubble to burst and another \"panic\" to come, so their optimism was \"tinged by insecurity and anxiety.\"", "fl": false}, {"n": 15, "ch": "10", "st": "For their work force, the textile factories at Lowell, MA before 1845 depended upon", "cc": ["Children.", "Displaced farmers.", "Young women.", "Migrants."], "ans": "C", "r": "Young women: daughters of New England farm families (\"mill girls,\" ages 16-30) who lived in company boardinghouses. Irish immigrants replaced many of them after 1845.", "fl": false}, {"n": 16, "ch": "10", "st": "The following pairs match inventions with their inventors. Which pair is incorrectly matched?", "cc": ["Eli Whitney – cotton gin.", "Alexander Graham Bell–telegraph.", "James Watt – steam engine.", "Robert Fulton – steamboat."], "ans": "B", "r": "Incorrect: Alexander Graham Bell and the telegraph. Samuel F.", "fl": false}, {"n": 17, "ch": "10", "st": "The national market economy made Americans susceptible to the boom-and-bust cycle, as first became evident with the _____________, when world demand for cotton dropped.", "cc": ["Panic of 1819", "Great Depression", "Spirit of ’76", "Global Recession"], "ans": "A", "r": "The Panic of 1819. Cotton prices collapsed on the Liverpool market, and the first major depression followed (1819-1823).", "fl": false}, {"n": 18, "ch": "10", "st": "The accelerating growth of a national market was due in large measure to the fact that the cost of overland transportation dropped by 95% between 1825 and 1855.", "cc": null, "ans": "True", "r": "It fell 95 percent (and speed rose five-fold), which drove the growth of a national market.", "fl": false}, {"n": 19, "ch": "11", "st": "Three major issues dominated Jackson’s administration, all the result of the nation’s rapid geographic and economic expansion. Which of the following IS NOT one of these three issues?", "cc": ["Indian removal to the West", "The protective tariff", "Money and banking issues", "Controls on both slave and free black communities"], "ans": "D", "r": "NOT one: Controls on slave and free black communities. The three were (1) Indian removal (demand for new lands), (2) the protective tariff (South Carolina nullification), and (3) money and banking (the Bank).", "fl": false}, {"n": 20, "ch": "11", "st": "All of the following were true of John Quincy Adams EXCEPT that", "cc": ["He was a talented diplomat who served as secretary of state before he became president.", "He was a shrewd politician who was wildly popular among “the people,” especially in the South.", "While serving as president he tried to promote both manufacturing and agriculture.", "On a national level, he tried to promote the arts, literature, and science during his presidency."], "ans": "B", "r": "EXCEPT: He was a shrewd politician who was wildly popular with \"the people.\" Adams was a talented diplomat and secretary of state with \"hardly a political bone in his body\"; he was cold and tactless.", "fl": false}, {"n": 21, "ch": "11", "st": "Which pair were responsible for putting together a compromise that ended the crisis over nullification?", "cc": ["Jackson and Webster", "Adams and Clay", "Clay and Calhoun", "Jackson and Biddle"], "ans": "C", "r": "Henry Clay and John C. Calhoun.", "fl": true}, {"n": 22, "ch": "11", "st": "John C. Calhoun’s theory of nullification addressed the need to protect minority rights in an increasingly democratic political system by arguing that", "cc": ["The U.S. Constitution did not sanction unfair taxation in the form of tariffs.", "Since the people and not the states formed the U.S., the people had the right to hold special elections to nullify or confirm federal laws.", "States’ rights and responsibilities detailed in the Constitution required states to check and balance presidential power.", "Since the U.S. was a group of sovereign states, individual states had the right to nullify federal laws."], "ans": "D", "r": "Because the U.S. was a compact of sovereign states, a state (through a convention) could nullify a federal law that exceeded Congress's powers. If an amendment gave Congress the power, the state could accept it or secede.", "fl": false}, {"n": 23, "ch": "11", "st": "This individual’s conspiracy to start a slave rebellion terrorized South Carolinian slave owners in 1822. He was", "cc": ["Martin Van Buren.", "James Polk.", "Denmark Vesey.", "James Monroe."], "ans": "C", "r": "Denmark Vesey, a literate, well-traveled free black carpenter in Charleston. On flimsy evidence he and 34 others were hanged and 37 banished.", "fl": false}, {"n": 24, "ch": "11", "st": "Andrew Jackson was notable for having used the presidential veto fewer times than all of his predecessors combined.", "cc": null, "ans": "False", "r": "He used it more: 12 vetoes compared with 9 by all previous presidents combined, and he vetoed on policy grounds. (The quiz's \"fewer times\" statement is false.)", "fl": false}, {"n": 25, "ch": "11", "st": "Both African Americans and Native Americans were prohibited from participating in the political process during the period often referred to as the Age of Jackson.", "cc": null, "ans": "False", "r": "Women, slaves, most free African Americans, and Indians could not vote. Not all black men were barred: they could vote on equal terms in five New England states, and New York's $250 property requirement disenfranchised about 90 percent.", "fl": true}, {"n": 26, "ch": "11", "st": "The forced removal of the Cherokees to Oklahoma in 1838, a deadly march under Army escort, is known as the Path of Perils.", "cc": null, "ans": "False", "r": "The Trail of Tears. Under Van Buren the Army rounded up about 15,000 Cherokees at bayonet point, and about one-quarter died on the march west.", "fl": false}, {"n": 27, "ch": "11", "st": "An example of a grass-roots movement in the United States that demonstrated an increasing fear of special privilege was", "cc": ["The Anti-Mason movement.", "The Anti-Democracy movement.", "The Anti-Commerce movement.", "The Anti-Government movement."], "ans": "A", "r": "The Anti-Mason movement. It campaigned against the Freemasons as a secret, aristocratic society, pioneered the national nominating convention, and later fed into the Whigs.", "fl": false}, {"n": 28, "ch": "11", "st": "Which of the following statements about the nullification crisis of 1832 is FALSE?", "cc": ["The issue under discussion was the tariff, but the right of secession was also debated.", "Jackson eventually backed down from the controversy and gave in completely to South Carolina’s demands.", "Andrew Jackson determined that the president had the right to use force to preserve the Union.", "The nullification theory, according to Calhoun, gave the South a legal device to justify secession."], "ans": "B", "r": "FALSE: Jackson backed down and gave in completely to South Carolina. Jackson declared the Union perpetual and got the Force Bill; only the compromise tariff lowered rates, and South Carolina repealed its ordinance.", "fl": false}, {"n": 29, "ch": "11", "st": "The chapter introduction tells the story of politicians Powhatan Ellis and Franklin Plummer to make the point that", "cc": ["Appealing to common folk was an effective campaign technique in an age that prized equality and opportunity.", "People had rather strange names in the 1800s.", "These two men, frontiersmen who identified with the common folk, typified the democratic-minded politician in the age of Jackson.", "Andrew Jackson was more a figurehead than a really influential leader."], "ans": "A", "r": "Appealing to common folk was an effective campaign technique in an age that prized equality and opportunity. Plummer (\"Plummer for the People\") beat aristocratic politicians by being branded a man of the people, and Ellis was painted as an aristocratic dandy.", "fl": false}, {"n": 30, "ch": "11", "st": "Which of the following tribes in Florida resisted the government’s attempts at removal?", "cc": ["The Cherokee.", "The Apache.", "The Huron.", "The Seminole."], "ans": "D", "r": "The Seminoles, led by Osceola, held out in the Florida Everglades until 1842.", "fl": false}, {"n": 31, "ch": "11", "st": "The outcome of the 1824 election, determined by the House of Representatives, angered Jackson’s supporters when _____________ was named secretary of state.", "cc": ["Henry Clay", "John Quincy Adams", "John Calhoun", "John Marshall"], "ans": "A", "r": "Henry Clay. Clay helped the House choose John Quincy Adams, and Adams then named him secretary of state, so Jacksonians charged a \"corrupt bargain.\"", "fl": false}, {"n": 32, "ch": "11", "st": "The authors of your text argue that political parties were accepted by the people as a means of keeping political and economic abuses at bay.", "cc": null, "ans": "True", "r": "They accepted parties as essential and useful. Van Buren argued that parties were \"inseparable from free governments\" because competing parties check each other's abuses and inform the people (unlike the Revolutionary generation, which feared parties).", "fl": false}, {"n": 33, "ch": "11", "st": "Scholars find that during the Jacksonian era democracy lessened the effects of racism on American life.", "cc": null, "ans": "False", "r": "Racism intensified rather than lessened: whites stressed \"innate\" racial differences, black voting rights were taken away, minstrel shows spread, and race riots broke out. Tocqueville found prejudice stronger in states that had abolished slavery.", "fl": false}, {"n": 34, "ch": "11", "st": "The _____________ Party was successful in the 1840 presidential election.", "cc": ["Democratic", "Whig", "Tea", "Republican"], "ans": "B", "r": "The Whig Party, with William Henry Harrison and a \"log cabin and hard cider\" campaign. Harrison beat Van Buren 234 to 60 in the Electoral College, with nearly four-fifths of eligible voters turning out.", "fl": false}, {"n": 35, "ch": "11", "st": "Which of the following would you NOT expect of the Whigs in the 1830s and 1840s?", "cc": ["Support for humanitarian reforms.", "Support for regulating the new market economy.", "A belief that government should foster moral welfare.", "A pessimistic outlook, especially about the role of government."], "ans": "D", "r": "NOT expected: A pessimistic outlook, especially about the role of government. Whigs were optimistic about the market, believed in active government, and backed humanitarian and moral reform.", "fl": false}, {"n": 36, "ch": "11", "st": "Each of the following was an example of social equality in U.S. society EXCEPT", "cc": ["Equal numbers of men and women in inns and taverns", "The availability of only one class of seats in railroad cars and stagecoaches.", "The freedom to strike up a conversation with anyone, including strangers.", "Chewing tobacco and spitting out the juice in public settings"], "ans": "A", "r": "EXCEPT: Equal numbers of men and women in inns and taverns. The text's examples are one class of seats on stagecoaches and railcars, common tables, \"coarse familiarity of address,\" and tobacco spitting everywhere.", "fl": false}, {"n": 37, "ch": "11", "st": "Through the Jacksonian era the right to vote was closely held by males only; females were unable to participate in political suffrage.", "cc": null, "ans": "True", "r": "The vote was held by males only; women were not given the vote even as white manhood suffrage spread.", "fl": false}, {"n": 38, "ch": "11", "st": "Which of the following leaders advocated the idea of state nullification in order to oppose the tariff?", "cc": ["Andrew Jackson", "Henry Clay", "Daniel Webster", "John C. Calhoun"], "ans": "D", "r": "John C. Calhoun, Jackson's vice president, who secretly wrote the South Carolina Exposition and Protest (1828) in response to the Tariff of Abominations.", "fl": false}, {"n": 39, "ch": "12", "st": "A leading figure in the early women's movement was:", "cc": ["Prudence Crandall", "Dorthea Dix", "Elizabeth Cady Stanton", "Walt Whitman"], "ans": "C", "r": "Elizabeth Cady Stanton. With Lucretia Mott she organized the 1848 Seneca Falls convention and its Declaration of Sentiments (\"All men and women are created equal\").", "fl": false}, {"n": 40, "ch": "12", "st": "The evangelist preacher Charles Finney was instrumental in spreading the spirit of the Second Great Awakening", "cc": null, "ans": "True", "r": "He was \"the founder of modern revivalism\" and spread the spirit of the Second Great Awakening. His revivals along the Erie Canal (Rochester) used \"new measures,\" and he preached free will: all who wanted to could be saved.", "fl": false}, {"n": 41, "ch": "12", "st": "Which was NOT TRUE of the new middle-class family?", "cc": ["Larger because increased prosperity allowed parents to support more children", "Increasingly understood as a haven of order and morality", "Increasingly understood as woman's domain", "Orderly household divided into private, service, and social spaces"], "ans": "A", "r": "NOT true: It grew larger because prosperity let parents support more children. Middle-class families actually became smaller as couples delayed marriage and used birth control; the home became a private, orderly haven and the woman's domain.", "fl": false}, {"n": 42, "ch": "12", "st": "Most important of the new black independent churches:", "cc": ["African Catholic Church of America", "American Baptist Church for Blacks", "African Methodist Episcopal Church", "African-American Baptist Church"], "ans": "C", "r": "The African Methodist Episcopal (AME) Church, organized in Philadelphia in 1816 with Richard Allen as its first bishop; about 20,000 members by 1856.", "fl": false}, {"n": 43, "ch": "12", "st": "In what way did evangelical churches come to influence American society in the Second Great Awakening?", "cc": ["Championing missionary activity worldwide", "Redefining terms of marriage", "Promoting political reforms", "Challenging slavery"], "ans": "A", "r": "Revivalists sent converts into benevolent and reform societies, which taught Sunday school at home and \"dispatch[ed] missionaries abroad\"; the text also names changes in drinking, ideals of women and family, and attitudes toward Catholics (Ch.12, p.275).", "fl": true}, {"n": 44, "ch": "12", "st": "First major women's rights convention took place in:", "cc": ["Brook Farm MA", "Oneida NY", "Seneca Falls NY", "Boston MA"], "ans": "C", "r": "Seneca Falls, New York, in 1848, organized by Stanton and Mott with about 100 supporters.", "fl": false}, {"n": 45, "ch": "12", "st": "Chapter 12 introduction tells the story of Lyman Beecher and his offspring to make the point that:", "cc": ["Preachers stressed wickedness of American society", "Zealous evangelical Protestants sought to hasten the coming of Christ's kingdom on earth through diverse strategies for reforming society", "Beecher family stood for older values and tried to halt change while others sought to harness change", "Transcendentalist Beecher represented the secular Romantic side"], "ans": "B", "r": "Zealous evangelical Protestants sought to bring Christ's kingdom on earth through many strategies for reforming society. Beecher used revivals and the \"Benevolent Empire\"; his children went on to attack slavery and women's subordination.", "fl": false}, {"n": 46, "ch": "12", "st": "NOT an author/poet associated with the American Renaissance:", "cc": ["Nathaniel Hawthorne", "Charles Dickens", "Edgar Allan Poe", "Margaret Fuller"], "ans": "B", "r": "NOT: Charles Dickens (a British novelist). Hawthorne, Poe, and Margaret Fuller (a Transcendentalist) were Americans of the era.", "fl": true}, {"n": 47, "ch": "12", "st": "Robert Owen recruited followers by teaching that:", "cc": ["Character shaped by skull shape", "Only privileged few could be perfect", "Individual self-reliance key to progress", "Shared property and equality of work division would foster tolerant people"], "ans": "D", "r": "A just society in which property was held in common and work equally shared would foster tolerant, rational human beings capable of self-government. New Harmony, Indiana, dissolved in 1827.", "fl": false}, {"n": 48, "ch": "12", "st": "The issue of abolishing slavery was impacted by the gag rule regarding its debate in Congress.", "cc": null, "ans": "True", "r": "A House rule (1836) that automatically tabled any petition about slavery. It backfired by letting abolitionists defend white civil liberties, and the House repealed it in 1844.", "fl": false}, {"n": 49, "ch": "12", "st": "Finney's revivals upheld the doctrine that:", "cc": ["Predestined", "Deliverance was available to all who were converted", "Women should be religious leaders", "Religion a way to become wealthy"], "ans": "B", "r": "That deliverance was available to all who were converted: free will, so all men and women who wanted to could be saved (not Calvinist predestination).", "fl": false}, {"n": 50, "ch": "12", "st": "Romanticism, a reaction against the Enlightenment, stressed individual intuition and feeling rather than reason as the means to truth.", "cc": null, "ans": "True", "r": "A European reaction against the Enlightenment that stressed emotion and intuition, not reason, as sources of truth, and glorified the individual.", "fl": false}, {"n": 51, "ch": "12", "st": "Women made up the greater number of converts at revivals during the Second Great Awakening.", "cc": null, "ans": "True", "r": "Women. Female converts outnumbered males by about three to two, and women dominated antebellum revivals and churches.", "fl": false}, {"n": 52, "ch": "12", "st": "Term for social organizations whose goal was prohibition of drinking and distributing alcohol:", "cc": ["Evangelicals", "Abolitionists", "Temperance societies", "Quakers"], "ans": "C", "r": "Temperance societies. The American Temperance Society (1826) spawned about 5,000 local societies, and by 1845 drinking fell below two gallons a year; Maine passed state prohibition in 1851.", "fl": false}, {"n": 53, "ch": "12", "st": "Religious revivalism in the antebellum period:", "cc": ["Quest for social order and control in market economy", "Desire for social and moral improvement", "Both", "None"], "ans": "C", "r": "Both a search for stability and order amid market change (revivals \"brought a sense of stability and peace amid widespread change\") and a desire for social and moral improvement (they \"motivated believers to create a better world\").", "fl": true}, {"n": 54, "ch": "12", "st": "Catholic immigrants came primarily from all EXCEPT:", "cc": ["French Canada", "Middle East", "Germany", "Ireland"], "ans": "B", "r": "NOT a main source: the Middle East. Catholic immigrants were mostly Irish and German (the text names Irish and German settlers).", "fl": true}, {"n": 55, "ch": "12", "st": "Utopian ideas arose in response to belief that social disruption was caused by the development of ___ and ___:", "cc": ["Commercialism; capitalism", "Evangelism; revivals", "Socialism; republicanism", "None"], "ans": "A", "r": "They blamed the competitive commercial and capitalist market society (Brook Farm offered \"a more wholesome and simple life than can be led amidst the pressure of our competitive institutions\") and formed model communities to remake society by example.", "fl": true}, {"n": 56, "ch": "12", "st": "Fugitive slave who became a leading abolitionist, in Garrison's inner circle:", "cc": ["Frederick Douglass", "Noyes", "Owen", "Lyman Beecher"], "ans": "A", "r": "Frederick Douglass. He escaped slavery in Maryland, was first a follower of Garrison, and later broke with him and started his own newspaper in Rochester.", "fl": false}, {"n": 57, "ch": "12", "st": "Text explains the ideal of domesticity:", "cc": ["Opposed by revivalists", "Government should ignore foreign policy", "Held women's sphere was home and family", "Stressed father's spiritual leadership"], "ans": "C", "r": "Woman's sphere was the home and family. The \"cult of domesticity\" made wives and mothers the moral \"angels\" of the household, in a sphere separate from men's business.", "fl": false}, {"n": 58, "ch": "12", "st": "Essential conviction of William Lloyd Garrison about slavery:", "cc": ["Necessary evil", "Economic drain", "Contradiction to Constitution", "A sin"], "ans": "D", "r": "That slavery was a sin. He demanded immediate emancipation without compensation, rejected colonization, and used \"moral suasion\" (The Liberator, January 1, 1831).", "fl": false}, {"n": 59, "ch": "13", "st": "Which did NOT contribute to Southern illiteracy rates ~20% higher than North?", "cc": ["Southern colleges inferior to northern ones", "Since South rural, people cared less about education than northerners", "Since planters educated children privately, most opposed a state-supported school system", "Few slaveowners taught slaves to read and write"], "ans": "D", "r": "Did NOT contribute: Few slaveowners taught slaves to read and write. (The illiteracy figure is for native-born whites.) The text's causes: the rural South showed less interest in education, southern colleges were inferior, and planters who educated their children privately opposed state-supported schools.", "fl": false}, {"n": 60, "ch": "13", "st": "In sheer numbers, backbone of southern society:", "cc": ["Planters with huge estates", "Yeoman farmers who owned no slaves", "Whites who owned only a few slaves", "Whites who owned 20-50 slaves"], "ans": "B", "r": "Yeoman farmers who owned no slaves. They were more than half the white population and mostly semisubsistence farmers raising corn and hogs.", "fl": false}, {"n": 61, "ch": "13", "st": "NOT a distinctive feature of southern agricultural system:", "cc": ["Cotton, rice, sugar could be grown only in the South", "Staple crops wore out soil, damaged environment", "Based on slavery", "Rural agricultural economy more stable but less profitable than boom-and-bust North"], "ans": "D", "r": "NOT distinctive: A rural agricultural economy that was more stable but less profitable than the boom-and-bust North. The South was prosperous and grew faster than the North after 1839-1843.", "fl": false}, {"n": 62, "ch": "13", "st": "Major difference NA vs Latin American slavery: in Latin America ___ were much more frequent:", "cc": ["Slave escapes", "Slaves buying own freedom", "Slave revolts", "None"], "ans": "C", "r": "In Latin America slave revolts were much more frequent (Haiti, Jamaica, Brazil), sometimes involving thousands of slaves; in the U.S. revolts were rare.", "fl": false}, {"n": 63, "ch": "13", "st": "Last significant attempt by white southerners to take action against slavery:", "cc": ["Bill of Rights", "Constitution", "Seneca Falls", "Virginia Debate of 1832"], "ans": "D", "r": "The Virginia Debate of 1832. After Nat Turner's revolt, the legislature refused, 73 to 58, to consider ending slavery.", "fl": false}, {"n": 64, "ch": "13", "st": "Upper-class plantation mistress:", "cc": ["Accepted sexual code keeping white women pure but tolerating white men/slave women relations", "Life of leisure, artistic pursuits", "Luxury of criticizing her role and slavery", "Faced an unexpected variety of burdensome managerial and service duties"], "ans": "D", "r": "Far from leisure, she faced a variety of burdensome managerial and service duties (\"the mistress of a plantation was the most complete slave on it\"), and many were troubled by the sexual double standard and miscegenation.", "fl": false}, {"n": 65, "ch": "13", "st": "Tidewater vs frontier planters:", "cc": ["Tidewater cotton, frontier tobacco/rice/sugar", "Frontier cotton gentry typically self-made, claiming status through wealth accumulation", "Tidewater closer ties to Britain, European hierarchy", "More opposition to slavery on frontier"], "ans": "B", "r": "The frontier cotton gentry were typically self-made men who claimed status by building wealth, while the Tidewater gentry modeled themselves on the English country gentleman.", "fl": false}, {"n": 66, "ch": "13", "st": "Why open slave rebellion less common in US than Latin America:", "cc": ["Had families and didn't want to risk getting caught", "Satisfied", "Turn the other cheek", "Freed at a certain age"], "ans": "A", "r": "In most of the South whites outnumbered blacks, the government was more powerful, most slaves were native-born, and family life was much stronger. Slaves with families did not want to risk them, and many potential leaders became fugitives instead.", "fl": false}, {"n": 67, "ch": "13", "st": "After 1830 southerners defended slavery more aggressively for all EXCEPT:", "cc": ["Rise of abolitionism", "Increasing dependence of southern economy on slave-grown staples", "Perceived decline in southern influence in national politics", "Nat Turner's revolt"], "ans": "C", "r": "Best-supported EXCEPT: A perceived decline in southern influence in national politics. The Ch.13 text ties the turn to abolitionism (Garrison's Liberator, 1831), Nat Turner's revolt (1831), and growing dependence on slave-grown staples.", "fl": true}, {"n": 68, "ch": "13", "st": "Nat Turner led a revolt despite relatively humane treatment by his master.", "cc": null, "ans": "True", "r": "His master gave him unusual privileges, and Turner called him kind and trusting. Still, after an eclipse in 1831 Turner, a literate slave preacher, led a revolt that killed 57 whites.", "fl": false}, {"n": 69, "ch": "13", "st": "Prosperity of southern agriculture kept South overwhelmingly rural; few cities; wealth depended on agricultural exports.", "cc": null, "ans": "True", "r": "It kept the South overwhelmingly rural (84 percent of its labor force farmed in 1860), with few cities (New Orleans was the only large one), and its wealth depended on agricultural exports like cotton.", "fl": false}, {"n": 70, "ch": "13", "st": "After 1831 free black southerners faced all EXCEPT:", "cc": ["Could not purchase own enslaved family members", "Could not travel state to state", "Could not vote or hold office", "Had to carry free papers"], "ans": "A", "r": "EXCEPT: They could not buy their own enslaved family members. In fact about 3,600 free blacks owned slaves in 1830, often family members.", "fl": false}, {"n": 71, "ch": "13", "st": "Slaves concentrated along the old eastern seaboard (Tidewater) and in new plantation areas of the Deep South.", "cc": null, "ans": "True", "r": "Along the old eastern seaboard (the Tidewater, especially coastal South Carolina and Georgia) and in the new plantation areas of the Deep South (the Black Belt of Alabama and Mississippi and the Mississippi valley), on fertile land with good transportation.", "fl": false}, {"n": 72, "ch": "13", "st": "Under the ___ system a specific assignment was given to each slave; workday over when completed:", "cc": ["Gang", "Hourly", "Piece-work", "Task"], "ans": "D", "r": "The task system (most common in the rice fields). In the gang system (cotton districts), an overseer or driver supervised gangs of 20-25.", "fl": false}, {"n": 73, "ch": "13", "st": "Most important function of religion for slaves:", "cc": ["Spirituals", "Framework for achieving their own freedom", "Grow Methodist/Baptist populations", "Literacy via Bible"], "ans": "B", "r": "Slaves built a Christianity of their own beyond the master's control, and spirituals carried hidden hopes of freedom (\"Canaan\" = the North) (Ch.13, pp.308-309).", "fl": true}, {"n": 74, "ch": "13", "st": "Industrial workers' resistance similar to slaves' resistance:", "cc": ["Marx", "Struck back at overseers/foremen who whipped", "Destroyed property to decrease owner's wealth", "Planned open revolts"], "ans": "C", "r": "The text's day-to-day resistance centers on abusing the master's property (broken tools, mishandled animals, careless work); it makes no direct comparison to industrial workers (Ch.13, p.306).", "fl": true}, {"n": 75, "ch": "13", "st": "NOT TRUE of abolitionist movement:", "cc": ["Black abolitionists demanded immediate end in North, South within thirty years", "Women drew on benevolent societies", "Foremost early figure was journalist Garrison", "Women played no active role"], "ans": "D", "r": "NOT true: Women played no active role. Women were very active (the Grimke sisters, Abby Kelly), drawing on benevolent societies, and Garrison was the foremost early figure.", "fl": false}, {"n": 76, "ch": "13", "st": "Best generalization of N vs S economies after depression of 1839-1843:", "cc": ["Southern rural economy growing faster than North's, but wealth more evenly distributed among northern farmers", "Most southerners farmers, most northerners in cities", "North growing faster due to manufacturing, but southern rural economy afforded infinite opportunities", "South shifting toward manufacturing and fishing"], "ans": "A", "r": "The southern rural economy grew faster than the North's, but per capita income stayed lower and wealth was more evenly distributed among northern farmers than in the plantation South.", "fl": false}, {"n": 77, "ch": "13", "st": "Manufacturing lagged in South because:", "cc": ["High profits from agriculture discouraged other investments", "Slaves couldn't do industrial work", "Lacked capital", "Lacked white workforce"], "ans": "A", "r": "High profits from agriculture (cotton) discouraged other investment. The South made only 9 percent of the nation's manufactured goods.", "fl": false}, {"n": 78, "ch": "13", "st": "Free blacks in the South:", "cc": ["Hierarchy favoring darker skin", "Mostly in Upper South", "Mostly urban", "Primarily mulattoes"], "ans": "B", "r": "About 260,000 (7 percent of southern blacks) were free. More than 85 percent lived in the Upper South; they were more urban, more literate, disproportionately female, and much more likely to be of mixed ancestry (mulatto) than slaves.", "fl": false}, {"n": 79, "ch": "1B", "st": "Based on interpreting information from the text, in McCulloch v. Maryland (1819) Chief Justice John Marshall's Supreme Court:", "cc": ["struck down New York's steamboat monopoly and defined interstate commerce broadly", "ruled that a state charter, like Dartmouth College's, was a contract no state could alter", "upheld the Second Bank's constitutionality, ruling a bank need only be useful under the \"necessary and proper\" clause", "declared the national bank unconstitutional because the Constitution never mentions a bank by name"], "ans": "C", "r": "McCulloch upheld the Second Bank under the \"necessary and proper\" clause and Hamilton's doctrine of implied powers (Ch.10, p.229).", "fl": false}, {"n": 80, "ch": "1B", "st": "Which Supreme Court case affirmed federal power to regulate interstate commerce and struck down a New York steamboat monopoly, resulting in more business competition?", "cc": ["Fletcher v. Peck (1810)", "Worcester v. Georgia (1832)", "Dartmouth College v. Woodward (1819)", "Gibbons v. Ogden (1824)"], "ans": "D", "r": "Gibbons v. Ogden defined commerce broadly and ended the NY steamboat monopoly (Ch.10, p.229).", "fl": false}, {"n": 81, "ch": "1B", "st": "The Marshall Court decisions in Fletcher v. Peck (1810) and Dartmouth College v. Woodward (1819) both rested on the principle that:", "cc": ["states could nullify federal laws that exceeded Congress's delegated powers", "Indian nations held full authority over their own lands", "states could not impair the obligation of contracts, including charters", "Congress could make all laws \"necessary and proper\" to run a national bank"], "ans": "C", "r": "Fletcher voided a Georgia law revoking a land grant, and Dartmouth ruled state charters are contracts (Ch.10, p.229).", "fl": false}, {"n": 82, "ch": "1B", "st": "The Tariff of 1828, which its opponents labeled the \"Tariff of Abominations,\" led directly to which of the following?", "cc": ["Jackson's veto of the recharter of the Second Bank of the United States", "The South Carolina Exposition and Protest, secretly written by John C. Calhoun", "The Specie Circular requiring gold or silver for public lands", "The Webster-Hayne debate, which ended with the tariff's repeal"], "ans": "B", "r": "The Tariff of Abominations prompted the Exposition and Protest, which laid out nullification; its author was VP Calhoun (Ch.11, p.260).", "fl": false}, {"n": 83, "ch": "1B", "st": "In the Webster-Hayne debate of 1830, Daniel Webster answered the states' rights position of Robert Hayne by declaring that:", "cc": ["a state could secede if a constitutional amendment went against it", "it was \"the people's constitution, the people's government,\" not a compact of states", "the national bank was unconstitutional and should be shut down", "the tariff ought to be lowered gradually to satisfy South Carolina"], "ans": "B", "r": "Webster's nationalist reply: \"It is the people's constitution, the people's government... answerable to the people\" (Ch.11, p.261).", "fl": false}, {"n": 84, "ch": "1B", "st": "Which of the following was NOT part of the resolution of the nullification crisis in 1833?", "cc": ["Congress passed the Force Bill giving Jackson military powers", "Jackson signed a compromise tariff lowering rates on March 1, 1833", "Federal troops occupied Charleston and arrested John C. Calhoun", "South Carolina repealed its nullification ordinance"], "ans": "C", "r": "No troops occupied Charleston; the Force Bill and compromise tariff were signed the same day and SC repealed its ordinance (Ch.11, p.261).", "fl": false}, {"n": 85, "ch": "1B", "st": "Based on interpreting information from the text, how did Andrew Jackson respond to the Supreme Court's ruling in Worcester v. Georgia (1832)?", "cc": ["He called the decision \"stillborn\" and ignored it, continuing Indian removal", "He enforced it by sending the army to protect Cherokee lands in Georgia", "He asked Congress to repeal the Indian Removal Act of 1830", "He appointed Roger Taney to overturn it the following year"], "ans": "A", "r": "Marshall ruled tribes had full authority over their lands, but Jackson ignored the ruling and removal went on under the 1830 Removal Act (Ch.11, p.254).", "fl": false}, {"n": 86, "ch": "1B", "st": "In the Bank War, Andrew Jackson responded to Nicholas Biddle's early request to recharter the Second Bank of the United States by:", "cc": ["signing the recharter in exchange for Henry Clay's support on the tariff", "asking the Supreme Court to overturn McCulloch v. Maryland in a new case", "turning the bank into an Independent Treasury with Biddle in charge", "vetoing the recharter in 1832 and moving federal deposits to state \"pet banks\""], "ans": "D", "r": "Jackson vetoed the 1832 recharter, removed the deposits to state banks, and the charter expired in 1836 (Ch.11, p.262).", "fl": false}, {"n": 87, "ch": "1B", "st": "Which statement best describes the cause-and-effect role of Jackson's Specie Circular (July 1836)?", "cc": ["Requiring gold or silver for public land came too late to stop the speculative bubble that burst in 1837", "It rechartered the national bank and ended the Panic of 1819", "It ended the depression that followed the Panic of 1837 under Van Buren", "It required that Cherokees be paid in specie for lands taken under removal"], "ans": "A", "r": "The Circular required specie for public land; sales dropped too late, and the Panic of 1837 followed under Van Buren (Ch.11, p.264).", "fl": false}, {"n": 88, "ch": "1B", "st": "Andrew Jackson defended his \"spoils system\" as a democratic reform because:", "cc": ["it kept experienced opponents in office to serve the whole nation", "it let the Senate choose all federal officeholders by majority vote", "rotating supporters into office prevented an entrenched bureaucracy", "it opened offices only to those who passed a civil service exam"], "ans": "C", "r": "Jackson gave offices to supporters and called it \"rotation in office,\" a guard against entrenched bureaucrats (Ch.11, pp.252-253).", "fl": false}];
const T={"10":"Chapter 10 — The Opening of America","11":"Chapter 11 — The Rise of Democracy","12":"Chapter 12 — Afire with Faith","13":"Chapter 13 — The Old South","1B":"Laws, Court Cases & Politics"};

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function score(){const a=Object.values(st);document.getElementById('score').textContent=a.filter(x=>x).length+' / '+a.length+' correct'+(pool?' (missed-only round)':'')}
function render(){const f=document.getElementById('filt').value,box=document.getElementById('qs');box.innerHTML='';let cur=null;
 Q.forEach(q=>{if(pool&&!pool.has(q.n))return;if(f!=='all'&&q.ch!==f)return;
  if(q.ch!==cur){cur=q.ch;const h=document.createElement('h2');h.textContent=T[cur];box.appendChild(h)}
  const c=document.createElement('div');c.className='card';c.id='q'+q.n;
  let ch=q.cc?q.cc.map((t,i)=>`<button class="ch" data-a="${L[i]}">${L[i]}. ${esc(t)}</button>`).join(''):`<div class="tf"><button class="ch" data-a="True">True</button><button class="ch" data-a="False">False</button></div>`;
  c.innerHTML=`<div class="qn">Question ${q.n}</div><div><b>${q.cc?'':'True or False: '}${esc(q.st)}</b></div>${ch}<div class="ex" hidden></div>`;
  c.querySelectorAll('.ch').forEach(b=>b.onclick=()=>answer(q,c,b));box.appendChild(c)})}
function answer(q,c,b){if(c.dataset.done)return;c.dataset.done=1;const pick=b.dataset.a,ok=pick===q.ans;st[q.n]=ok;
 c.querySelectorAll('.ch').forEach(x=>{x.disabled=true;if(x.dataset.a===q.ans)x.classList.add('ok')});if(!ok)b.classList.add('bad');
 c.classList.add(ok?'right':'wrong');const ex=c.querySelector('.ex');ex.hidden=false;
 let why='';if(!ok){const pt=q.cc?q.cc[L.indexOf(pick)]:pick;why=`<div>You chose <b>${esc(pick)}</b>${q.cc?' ('+esc(pt)+')':''}, which is not the best answer per the text; see the reason below.</div>`}
 ex.innerHTML=`<div><b>${ok?'✓ Correct':'✗ Incorrect'}</b>. Answer: <b>${q.ans}${q.cc?'. '+esc(q.cc[L.indexOf(q.ans)]):''}</b></div>${why}<div style="margin-top:4px">${esc(q.r)}</div>${q.fl?'<div class="flag">⚠ Uncertain: the textbook doesn\'t state this quiz answer outright; best-supported answer.</div>':''}`;score()}
document.getElementById('filt').onchange=render;
document.getElementById('restart').onclick=()=>{st={};pool=null;render();score();scrollTo(0,0)};
document.getElementById('missed').onclick=()=>{const m=Object.keys(st).filter(k=>!st[k]).map(Number);if(!m.length){alert(Object.keys(st).length?'No misses yet. Nice!':'Answer some questions first.');return}pool=new Set(m);st={};render();score();scrollTo(0,0)};
render();score();
