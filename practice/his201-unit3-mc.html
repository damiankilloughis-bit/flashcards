<script>
const Q=[{"n": 1, "ch": "10", "st": "A post-War of 1812 program of economic centralization, designed to promote internal economic development, was pushed by a group of aggressive young Republican nationalists. Which of the following did this program NOT include?", "cc": ["Funding the war debt.", "A protective tariff.", "A national bank.", "Federal subsidies for public works projects."], "ans": "A", "r": "The text lists the New Nationalism program as a \"NATIONAL BANK\" (Second Bank, 1816), a protective tariff (Tariff of 1816), and federal internal improvements (roads and canals). Funding the war debt is not on the list, so it is the odd one out.", "fl": false}, {"n": 2, "ch": "10", "st": "Of the following statements, which one is the most accurate in explaining why the Panic of 1819 was so significant?", "cc": ["As the first major American depression, it affected city folk and rural Americans alike.", "The nation had never before experienced economic hard times.", "In reaction, land sales rose to speculative heights.", "It prompted a frenzy of canal building."], "ans": "A", "r": "The book calls it \"the Panic of 1819, the first major depression in the nation's history.\" When cotton prices collapsed, the hard times reached city workers and rural farmers alike.", "fl": false}, {"n": 3, "ch": "10", "st": "One of the factors contributing to the growth of urbanized life in America in the early 19th century was the arrival of immigrants.", "cc": null, "ans": "True", "r": "True. Immigration \"revived after 1815,\" and \"by 1820, 20 percent of New York City's inhabitants were foreign-born.\" The \"influx of foreign-born and rural migrants was all that kept city populations rising.\"", "fl": false}, {"n": 4, "ch": "10", "st": "The most profound economic development by mid-19c America was the", "cc": ["Development of a national banking system.", "Creation of corporations.", "Decline of the small-town merchant and the general store.", "Rise of the factory."], "ans": "D", "r": "The book says manufacturing shifted \"from the master-apprentice system of production... toward mechanization and the rise of the factory system,\" and that \"the factory system fundamentally transformed\" work and the environment. The other choices are not presented as the era's defining change: the bank is a policy issue, and corporations and general stores get no such emphasis.", "fl": false}, {"n": 5, "ch": "10", "st": "The factory system began in which industry?", "cc": ["Production of firearms.", "Whiskey distilling.", "Iron smelting.", "Textile production."], "ans": "D", "r": "\"The factory system originated in the Northeast,\" and Lowell, its first great example, \"became the nation's most famous center of textile manufacturing.\" The War of 1812 had already \"stimulated the growth of manufacturing, particularly in textiles.\"", "fl": false}, {"n": 6, "ch": "10", "st": "In the wake of the national market economy, which of the following became characteristic of Americans?", "cc": ["Moving away from greed and materialism.", "A belief that history was the story of inevitable social disintegration.", "The hunger for respect and recognition through the ability to make money.", "A general preoccupation with economic theory and business systems."], "ans": "C", "r": "\"Wealth and its trappings became the most obvious symbols of status.\" Materialism \"represented a quest for respect and recognition.\"", "fl": false}, {"n": 7, "ch": "10", "st": "Taken as a body of legal doctrine, the rulings of the Marshall Court", "cc": ["Expanded individual economic rights by limiting government’s role in stimulating the economy.", "Protected minority groups against the abuse of power by majorities.", "Enlarged federal power to an extraordinary degree.", "Limited the rights of private property by expanding the powers of government."], "ans": "C", "r": "In McCulloch, \"by upholding Hamilton's doctrine of implied powers, Marshall enlarged federal power to an extraordinary degree.\" Overall he upheld \"the sanctity of private property and the power of the federal government to promote economic growth.\" That rules out the choices about limiting government or limiting property rights.", "fl": false}, {"n": 8, "ch": "10", "st": "In its social impact, the national market economy did all of the following EXCEPT", "cc": ["Elevate the status of workers.", "Produce greater per capita wealth in American society.", "Stimulate materialism.", "Reorganize society toward greater specialization."], "ans": "A", "r": "Workers' status did not rise: \"Even well-paid workers sensed their decline in status.\" The market did raise wealth and materialism (\"greater emphasis on the acquisition of material goods\") and pushed specialization, which makes those three true effects.", "fl": false}, {"n": 9, "ch": "10", "st": "A transportation network grew rapidly as investors poured capital into improvement projects, especially after the opening of the Erie Canal in New York State in 1825.", "cc": null, "ans": "True", "r": "True. Canals drew heavy capital \"especially after the success of the wondrous Erie Canal. Built between 1818 and 1825,\" it was followed by a canal boom in other states.", "fl": false}, {"n": 10, "ch": "10", "st": "Which of the following was NOT characteristic of the economic changes that swept most of America in the early nineteenth century?", "cc": ["Economic activity was increasingly becoming more specialized.", "Subsistence agriculture was on the rise.", "The social structure of the nation became more stratified.", "Local economies became tied into regional and national markets."], "ans": "B", "r": "Subsistence farming was not rising. Americans \"sold cotton or wheat and bought manufactured cloth\" and \"relied, even in many rural villages, on cash and paper money instead of bartering.\" The markets also \"encouraged regional specialization\" and widened \"the gulf between rich and poor,\" so the other three choices describe real changes.", "fl": false}, {"n": 11, "ch": "10", "st": "Which of the following is the most accurate concerning those individuals referred to as Mountain Men?", "cc": ["The mountain men illustrated that some Americans lived beyond the reach of the market economy.", "The mountain man was, in his own way, as caught up in the national integrated economic network as a farmer.", "The mountain man was usually fleeing the routines and materialistic pursuits of a market-driven “civilization.”", "The mountain man functioned as an independent businessman, vulnerable to the market but at least able to be his own boss in an enterprise not yet dominated by large eastern organizations."], "ans": "B", "r": "\"The fur trade was not a sporting pursuit but a business,\" and the trapper \"was part of a vast economic structure.\" Most went west \"not to flee civilization but to make money... They, like farmers, were expectant capitalists.\"", "fl": false}, {"n": 12, "ch": "10", "st": "The Erie Canal effectively connected the _______________ and the _______________ and rapidly proved its worth in facilitating trade across New York and the Northeast.", "cc": ["Mississippi River; Atlantic Ocean", "St. Lawrence River; Gulf of Mexico", "Great Lakes; Mississippi River", "Great Lakes; Hudson River"], "ans": "D", "r": "The canal \"stretched 364 miles from Albany on the Hudson River to Buffalo on Lake Erie,\" connecting the Great Lakes and the Hudson.", "fl": false}, {"n": 13, "ch": "10", "st": "Americans seemed notably materialistic to foreign visitors, since _____________ became the most obvious symbol of social status.", "cc": ["Land", "Wealth", "Home ownership", "Slave ownership"], "ans": "B", "r": "\"Wealth and its trappings became the most obvious symbols of status.\" One magazine put it this way: \"Wealth is something substantial. Everybody knows that and feels it.\"", "fl": false}, {"n": 14, "ch": "10", "st": "Many Americans were marked by anxiety in the midst of their early nineteenth-century prosperity because in a national market economy plagued by cyclical depressions, prosperity seemed so fleeting.", "cc": null, "ans": "True", "r": "True. Because Americans believed \"the bubble would burst and another 'panic' would set in,\" prosperity \"seemed all too fleeting\" and \"their optimism was often tinged by insecurity and anxiety.\"", "fl": false}, {"n": 15, "ch": "10", "st": "For their work force, the textile factories at Lowell, MA before 1845 depended upon", "cc": ["Children.", "Displaced farmers.", "Young women.", "Migrants."], "ans": "C", "r": "\"Instead of relying primarily on child labor or a permanent working class, the Lowell mills employed daughters of New England farm families, who became the first factory workers in the United States.\"", "fl": false}, {"n": 16, "ch": "10", "st": "The following pairs match inventions with their inventors. Which pair is incorrectly matched?", "cc": ["Eli Whitney – cotton gin.", "Alexander Graham Bell–telegraph.", "James Watt – steam engine.", "Robert Fulton – steamboat."], "ans": "B", "r": "The telegraph was \"Samuel F. B. Morse's telegraph,\" not Bell's. The text pairs \"Eli Whitney\" with the cotton gin and Robert Fulton with the steamboat Clermont (1807).", "fl": false}, {"n": 17, "ch": "10", "st": "The national market economy made Americans susceptible to the boom-and-bust cycle, as first became evident with the _____________, when world demand for cotton dropped.", "cc": ["Panic of 1819", "Great Depression", "Spirit of ’76", "Global Recession"], "ans": "A", "r": "\"The initial shock of this boom-and-bust psychology came with the Panic of 1819,\" when cotton prices on the Liverpool market collapsed.", "fl": false}, {"n": 18, "ch": "10", "st": "The accelerating growth of a national market was due in large measure to the fact that the cost of overland transportation dropped by 95% between 1825 and 1855.", "cc": null, "ans": "True", "r": "True. \"From 1825 to 1855... the cost of transportation on land fell 95 percent while its speed increased five-fold.\"", "fl": false}, {"n": 19, "ch": "11", "st": "Three major issues dominated Jackson’s administration, all the result of the nation’s rapid geographic and economic expansion. Which of the following IS NOT one of these three issues?", "cc": ["Indian removal to the West", "The protective tariff", "Money and banking issues", "Controls on both slave and free black communities"], "ans": "D", "r": "The text names three problems from the nation's growing pains: \"demand for new lands\" (Indian removal), \"the tariff and South Carolina nullification,\" and \"credit and banking\" (the Bank). Controls on slave and free black communities is not one of the three.", "fl": false}, {"n": 20, "ch": "11", "st": "All of the following were true of John Quincy Adams EXCEPT that", "cc": ["He was a talented diplomat who served as secretary of state before he became president.", "He was a shrewd politician who was wildly popular among “the people,” especially in the South.", "While serving as president he tried to promote both manufacturing and agriculture.", "On a national level, he tried to promote the arts, literature, and science during his presidency."], "ans": "B", "r": "Adams was a \"talented diplomat\" and secretary of state but had \"hardly a political bone in his body.\" He was cold and tactless, not \"wildly popular,\" and his plans to promote \"manufacturing, agriculture, arts, literature, science\" alarmed opponents.", "fl": false}, {"n": 21, "ch": "11", "st": "Which pair were responsible for putting together a compromise that ended the crisis over nullification?", "cc": ["Jackson and Webster", "Adams and Clay", "Clay and Calhoun", "Jackson and Biddle"], "ans": "C", "r": "The text says South Carolina's leader Calhoun \"accepted\" the compromise tariff of 1833, which Jackson signed \"March 1, 1833.\" Only choice C includes Calhoun. Jackson and Webster both opposed nullification (Proclamation, Force Bill, the reply to Hayne), Adams was out of office, and Biddle belongs to the Bank War.", "fl": false}, {"n": 22, "ch": "11", "st": "John C. Calhoun’s theory of nullification addressed the need to protect minority rights in an increasingly democratic political system by arguing that", "cc": ["The U.S. Constitution did not sanction unfair taxation in the form of tariffs.", "Since the people and not the states formed the U.S., the people had the right to hold special elections to nullify or confirm federal laws.", "States’ rights and responsibilities detailed in the Constitution required states to check and balance presidential power.", "Since the U.S. was a group of sovereign states, individual states had the right to nullify federal laws."], "ans": "D", "r": "Calhoun held that the Union was \"a compact among sovereign states\" and that state conventions could \"nullify\" federal laws exceeding Congress's powers.", "fl": false}, {"n": 23, "ch": "11", "st": "This individual’s conspiracy to start a slave rebellion terrorized South Carolinian slave owners in 1822. He was", "cc": ["Martin Van Buren.", "James Polk.", "Denmark Vesey.", "James Monroe."], "ans": "C", "r": "Denmark Vesey was a \"literate, well-traveled free black carpenter\" in Charleston, accused in 1822 of plotting to seize and burn the city; \"Vesey and 34 others\" were hanged.", "fl": false}, {"n": 24, "ch": "11", "st": "Andrew Jackson was notable for having used the presidential veto fewer times than all of his predecessors combined.", "cc": null, "ans": "False", "r": "False. Jackson used the veto more, not fewer times: he \"vetoed 12 bills vs. 9 by all previous presidents combined,\" and he vetoed on policy grounds.", "fl": false}, {"n": 25, "ch": "11", "st": "Both African Americans and Native Americans were prohibited from participating in the political process during the period often referred to as the Age of Jackson.", "cc": null, "ans": "False", "r": "False. Not all African Americans were shut out: black men \"could vote equally only in five New England states.\" New York and some other states restricted or took away their vote.", "fl": false}, {"n": 26, "ch": "11", "st": "The forced removal of the Cherokees to Oklahoma in 1838, a deadly march under Army escort, is known as the Path of Perils.", "cc": null, "ans": "False", "r": "False. The 1838 removal of the Cherokees is called the \"Trail of Tears,\" not the Path of Perils.", "fl": false}, {"n": 27, "ch": "11", "st": "An example of a grass-roots movement in the United States that demonstrated an increasing fear of special privilege was", "cc": ["The Anti-Mason movement.", "The Anti-Democracy movement.", "The Anti-Commerce movement.", "The Anti-Government movement."], "ans": "A", "r": "The Anti-Masons \"campaigned against Freemasons,\" whom they saw as a \"secret, aristocratic\" society. That was a grass-roots attack on special privilege, and the movement pioneered \"the national nominating convention.\"", "fl": false}, {"n": 28, "ch": "11", "st": "Which of the following statements about the nullification crisis of 1832 is FALSE?", "cc": ["The issue under discussion was the tariff, but the right of secession was also debated.", "Jackson eventually backed down from the controversy and gave in completely to South Carolina’s demands.", "Andrew Jackson determined that the president had the right to use force to preserve the Union.", "The nullification theory, according to Calhoun, gave the South a legal device to justify secession."], "ans": "B", "r": "False statement: Jackson did not give in. His Proclamation declared the Union \"perpetual, no right of secession,\" and Congress passed the \"Force Bill\" (military powers). Only the compromise tariff lowered rates, and then South Carolina \"repealed\" its ordinance.", "fl": false}, {"n": 29, "ch": "11", "st": "The chapter introduction tells the story of politicians Powhatan Ellis and Franklin Plummer to make the point that", "cc": ["Appealing to common folk was an effective campaign technique in an age that prized equality and opportunity.", "People had rather strange names in the 1800s.", "These two men, frontiersmen who identified with the common folk, typified the democratic-minded politician in the age of Jackson.", "Andrew Jackson was more a figurehead than a really influential leader."], "ans": "A", "r": "Plummer won by casting himself as the champion of the people against the \"aristocrats of Natchez\" (\"Plummer for the People, and the People for Plummer\"), and Ellis was branded an \"aristocrat and dandy.\" The story shows that appealing to common folk won votes in an age that prized equality and opportunity.", "fl": false}, {"n": 30, "ch": "11", "st": "Which of the following tribes in Florida resisted the government’s attempts at removal?", "cc": ["The Cherokee.", "The Apache.", "The Huron.", "The Seminole."], "ans": "D", "r": "Under Osceola the \"Seminoles held out until 1842 in Florida Everglades.\"", "fl": false}, {"n": 31, "ch": "11", "st": "The outcome of the 1824 election, determined by the House of Representatives, angered Jackson’s supporters when _____________ was named secretary of state.", "cc": ["Henry Clay", "John Quincy Adams", "John Calhoun", "John Marshall"], "ans": "A", "r": "Clay \"rallied House votes for Adams,\" and \"two days later Adams named Clay secretary of state,\" so Jackson's supporters \"charged 'corrupt bargain.'\"", "fl": false}, {"n": 32, "ch": "11", "st": "The authors of your text argue that political parties were accepted by the people as a means of keeping political and economic abuses at bay.", "cc": null, "ans": "True", "r": "True. Van Buren argued parties were \"inseparable from free governments\" and \"highly useful to the country\": \"competing parties check each other and inform\" the people, unlike the Revolutionary generation, which feared parties.", "fl": false}, {"n": 33, "ch": "11", "st": "Scholars find that during the Jacksonian era democracy lessened the effects of racism on American life.", "cc": null, "ans": "False", "r": "False. Racism grew: after 1815 whites stressed \"'innate' racial differences,\" and \"racism increases in both South and North.\" Tocqueville found \"the prejudice of race... stronger in the states that have abolished slavery.\"", "fl": false}, {"n": 34, "ch": "11", "st": "The _____________ Party was successful in the 1840 presidential election.", "cc": ["Democratic", "Whig", "Tea", "Republican"], "ans": "B", "r": "The Whigs nominated William Henry Harrison and ran the \"log cabins and hard cider\" campaign, the \"first modern presidential campaign,\" and Harrison won the 1840 election.", "fl": false}, {"n": 35, "ch": "11", "st": "Which of the following would you NOT expect of the Whigs in the 1830s and 1840s?", "cc": ["Support for humanitarian reforms.", "Support for regulating the new market economy.", "A belief that government should foster moral welfare.", "A pessimistic outlook, especially about the role of government."], "ans": "D", "r": "The Whigs were not pessimistic about government: the text stresses the \"Whig belief in active government\" to \"protect rights, ensure equal opportunity.\" Northern Whigs \"favored temperance, anti-slavery legislation, aid to education\" (the \"party of morality\"), which covers the other three choices.", "fl": false}, {"n": 36, "ch": "11", "st": "Each of the following was an example of social equality in U.S. society EXCEPT", "cc": ["Equal numbers of men and women in inns and taverns", "The availability of only one class of seats in railroad cars and stagecoaches.", "The freedom to strike up a conversation with anyone, including strangers.", "Chewing tobacco and spitting out the juice in public settings"], "ans": "A", "r": "Visitors' examples of the \"democratic spirit\" were \"one class of seats on stagecoaches/railcars,\" a \"common table,\" a \"coarse familiarity of address\" with anyone, and \"tobacco spitting everywhere.\" Equal numbers of men and women in taverns is not among them.", "fl": false}, {"n": 37, "ch": "11", "st": "Through the Jacksonian era the right to vote was closely held by males only; females were unable to participate in political suffrage.", "cc": null, "ans": "True", "r": "True. The reforms brought \"white manhood suffrage,\" and women stayed outside the vote; even in the 1840 campaign women could only attend rallies, make speeches, and write pamphlets.", "fl": false}, {"n": 38, "ch": "11", "st": "Which of the following leaders advocated the idea of state nullification in order to oppose the tariff?", "cc": ["Andrew Jackson", "Henry Clay", "Daniel Webster", "John C. Calhoun"], "ans": "D", "r": "Calhoun, Jackson's vice president, was later revealed as the author of the \"South Carolina Exposition and Protest\" (1828), which laid out \"the theory of nullification\" against the Tariff of Abominations.", "fl": false}, {"n": 39, "ch": "12", "st": "A leading figure in the early women's movement was:", "cc": ["Prudence Crandall", "Dorthea Dix", "Elizabeth Cady Stanton", "Walt Whitman"], "ans": "C", "r": "\"Elizabeth Cady Stanton and Lucretia Mott launched the women's rights movement.\" Stanton was \"one of the instigators and guiding spirits at the Seneca Falls Convention.\"", "fl": false}, {"n": 40, "ch": "12", "st": "The evangelist preacher Charles Finney was instrumental in spreading the spirit of the Second Great Awakening", "cc": null, "ans": "True", "r": "True. \"The man who embodied this transformed evangelicalism was Charles Grandison Finney, the founder of modern revivalism.\"", "fl": false}, {"n": 41, "ch": "12", "st": "Which was NOT TRUE of the new middle-class family?", "cc": ["Larger because increased prosperity allowed parents to support more children", "Increasingly understood as a haven of order and morality", "Increasingly understood as woman's domain", "Orderly household divided into private, service, and social spaces"], "ans": "A", "r": "Not true: families got smaller, not larger. Young adults delayed marriage, and \"smaller family size resulted, since wives... began to use birth control.\" The home was seen as a \"haven\" of moral virtue with the mother \"firmly at its center.\"", "fl": false}, {"n": 42, "ch": "12", "st": "Most important of the new black independent churches:", "cc": ["African Catholic Church of America", "American Baptist Church for Blacks", "African Methodist Episcopal Church", "African-American Baptist Church"], "ans": "C", "r": "\"The most important was the African Methodist Episcopal (AME) Church, organized at Philadelphia in 1816,\" with Richard Allen as its first bishop.", "fl": false}, {"n": 43, "ch": "12", "st": "In what way did evangelical churches come to influence American society in the Second Great Awakening?", "cc": ["Redefining terms of marriage", "Championing missionary activity worldwide", "Promoting political reforms", "Challenging slavery"], "ans": "A", "r": "Zealous evangelicals \"did a great deal more than... dispatch missionaries abroad\": their activism \"significantly affected three aspects of American culture: drinking habits, ideals of women and the family, and Protestant attitudes toward... Roman Catholics.\" Reshaping \"ideals of women and the family\" (marriage) is the way the book names. Missionary work abroad was something they did, not their influence on American society, and political reform and abolition came later (\"From 1840 onward\").", "fl": false}, {"n": 44, "ch": "12", "st": "First major women's rights convention took place in:", "cc": ["Brook Farm MA", "Oneida NY", "Seneca Falls NY", "Boston MA"], "ans": "C", "r": "\"In 1848 Stanton and Mott organized a conference in Seneca Falls, New York, that attracted about a hundred supporters\" and issued the Declaration of Sentiments.", "fl": false}, {"n": 45, "ch": "12", "st": "Chapter 12 introduction tells the story of Lyman Beecher and his offspring to make the point that:", "cc": ["Preachers stressed wickedness of American society", "Zealous evangelical Protestants sought to hasten the coming of Christ's kingdom on earth through diverse strategies for reforming society", "Beecher family stood for older values and tried to halt change while others sought to harness change", "Transcendentalist Beecher represented the secular Romantic side"], "ans": "B", "r": "\"Lyman Beecher embodied the spirit of antebellum evangelical Protestantism,\" and the chapter follows the many reform paths he and his children took. Evangelicals' \"more optimistic view of human potential fostered revivals and sparked ambitious programs for reforming individuals and society,\" aimed at the millennium (Finney: \"the millennium may come in this country in three years\").", "fl": false}, {"n": 46, "ch": "12", "st": "NOT an author/poet associated with the American Renaissance:", "cc": ["Nathaniel Hawthorne", "Charles Dickens", "Edgar Allan Poe", "Margaret Fuller"], "ans": "B", "r": "The text identifies Dickens as English: Americans \"eagerly awaiting the latest installment of Charles Dickens's novels from England.\" Hawthorne (The Scarlet Letter) and Margaret Fuller (a Transcendentalist) appear in the American Renaissance section. Poe is not discussed, but Dickens is the only one the book places outside America.", "fl": false}, {"n": 47, "ch": "12", "st": "Robert Owen recruited followers by teaching that:", "cc": ["Character shaped by skull shape", "Only privileged few could be perfect", "Individual self-reliance key to progress", "Shared property and equality of work division would foster tolerant people"], "ans": "D", "r": "Owen envisioned \"a just society—one in which property was held in common and work equally shared,\" which \"would foster tolerant, rational human beings capable\" of self-government.", "fl": false}, {"n": 48, "ch": "12", "st": "The issue of abolishing slavery was impacted by the gag rule regarding its debate in Congress.", "cc": null, "ans": "True", "r": "True. In 1836 the House adopted \"the so-called gag rule,\" which \"automatically tabled without consideration any petition dealing with slavery.\" It backfired and was repealed in 1844.", "fl": false}, {"n": 49, "ch": "12", "st": "Finney's revivals upheld the doctrine that:", "cc": ["Predestined", "Deliverance was available to all who were converted", "Women should be religious leaders", "Religion a way to become wealthy"], "ans": "B", "r": "The new evangelical outlook granted \"more power to free will and human effort\": \"all men and women might choose and win salvation.\" That rejects predestination.", "fl": false}, {"n": 50, "ch": "12", "st": "Romanticism, a reaction against the Enlightenment, stressed individual intuition and feeling rather than reason as the means to truth.", "cc": null, "ans": "True", "r": "True. \"Romanticism began in Europe as a reaction against the Enlightenment... Romanticism instead emphasized the importance of emotion and intuition as sources of truth.\"", "fl": false}, {"n": 51, "ch": "12", "st": "Women made up the greater number of converts at revivals during the Second Great Awakening.", "cc": null, "ans": "True", "r": "True. \"In most revivals, female converts outnumbered males by about three to two.\"", "fl": false}, {"n": 52, "ch": "12", "st": "Term for social organizations whose goal was prohibition of drinking and distributing alcohol:", "cc": ["Evangelicals", "Abolitionists", "Temperance societies", "Quakers"], "ans": "C", "r": "\"In 1826 the American Temperance Society was founded, taking voluntary abstinence as its goal,\" and \"approximately 5,000 local temperance societies\" followed.", "fl": false}, {"n": 53, "ch": "12", "st": "Religious revivalism in the antebellum period:", "cc": ["Quest for social order and control in market economy", "Desire for social and moral improvement", "Both", "None"], "ans": "C", "r": "Both. Revivals \"brought a sense of stability and peace amid widespread change\" during an economic panic, and men \"under intense pressure from the market economy\" found in evangelicalism \"a discipline that called for self-control.\" Revivals also \"motivated believers to create a better world around them\" (social and moral improvement).", "fl": false}, {"n": 54, "ch": "12", "st": "Catholic immigrants came primarily from all EXCEPT:", "cc": ["French Canada", "Middle East", "Germany", "Ireland"], "ans": "B", "r": "The book names the sources: \"French Canadian Catholic emigrants\" into New England, then \"Catholic immigrants from the British Isles [Ireland] and German-speaking countries.\" The Middle East is never mentioned.", "fl": false}, {"n": 55, "ch": "12", "st": "Utopian ideas arose in response to belief that social disruption was caused by the development of ___ and ___:", "cc": ["Commercialism; capitalism", "Evangelism; revivals", "Socialism; republicanism", "None"], "ans": "A", "r": "Utopians believed \"competition, inequality, and acquisitiveness were corrupting American society\"; Brook Farm sought \"a more wholesome and simple life than can be led amidst the pressure of our competitive institutions.\" That points to commercialism and capitalism, not evangelism or republicanism.", "fl": false}, {"n": 56, "ch": "12", "st": "Fugitive slave who became a leading abolitionist, in Garrison's inner circle:", "cc": ["Frederick Douglass", "Noyes", "Owen", "Lyman Beecher"], "ans": "A", "r": "\"Frederick Douglass assumed the greatest prominence. Having escaped from slavery in Maryland... Initially a follower of Garrison,\" he later broke with him.", "fl": false}, {"n": 57, "ch": "12", "st": "Text explains the ideal of domesticity:", "cc": ["Opposed by revivalists", "Government should ignore foreign policy", "Held women's sphere was home and family", "Stressed father's spiritual leadership"], "ans": "C", "r": "The \"cult of domesticity\" cast \"wives and mothers as the 'angels' of their households,\" with the home a \"haven\" and \"the mother firmly at its center.\"", "fl": false}, {"n": 58, "ch": "12", "st": "Essential conviction of William Lloyd Garrison about slavery:", "cc": ["Necessary evil", "Economic drain", "Contradiction to Constitution", "A sin"], "ans": "D", "r": "Garrison held that southerners should be convinced by \"'moral suasion'... to renounce slavery as a sin.\"", "fl": false}, {"n": 59, "ch": "13", "st": "Which did NOT contribute to Southern illiteracy rates ~20% higher than North?", "cc": ["Southern colleges inferior to northern ones", "Since South rural, people cared less about education than northerners", "Since planters educated children privately, most opposed a state-supported school system", "Few slaveowners taught slaves to read and write"], "ans": "D", "r": "Slaves' illiteracy was not a cause of the white illiteracy figure, which counts \"native-born white citizens.\" The text's causes: \"As a rural society the South showed far less interest in education. Southern colleges were inferior,\" and \"wealthy planters... generally opposed a state-supported school system.\"", "fl": false}, {"n": 60, "ch": "13", "st": "In sheer numbers, backbone of southern society:", "cc": ["Planters with huge estates", "Yeoman farmers who owned no slaves", "Whites who owned only a few slaves", "Whites who owned 20-50 slaves"], "ans": "B", "r": "\"In terms of numbers, yeoman farm families were the backbone of southern society, accounting for more than half the southern white population. They owned no slaves.\"", "fl": false}, {"n": 61, "ch": "13", "st": "NOT a distinctive feature of southern agricultural system:", "cc": ["Cotton, rice, sugar could be grown only in the South", "Staple crops wore out soil, damaged environment", "Based on slavery", "Rural agricultural economy more stable but less profitable than boom-and-bust North"], "ans": "D", "r": "The South was not less profitable: \"slavery remained a highly profitable investment,\" and after the 1839-1843 depression \"the southern economy grew faster than that in the North.\" The South's staples, soil-wearing crops, and slavery are the features that set it apart.", "fl": false}, {"n": 62, "ch": "13", "st": "Major difference NA vs Latin American slavery: in Latin America ___ were much more frequent:", "cc": ["Slave escapes", "Slaves buying own freedom", "Slave revolts", "None"], "ans": "C", "r": "\"In Latin America, slave revolts were frequent, involving hundreds and even thousands of slaves.\" By contrast, \"slave revolts were rare in the United States.\"", "fl": false}, {"n": 63, "ch": "13", "st": "Last significant attempt by white southerners to take action against slavery:", "cc": ["Bill of Rights", "Constitution", "Seneca Falls", "Virginia Debate of 1832"], "ans": "D", "r": "After the Turner revolt the Virginia legislature \"refused, by a vote of 73 to 58, to consider legislation to end slavery. The debate marked the last significant attempt of white southerners to challenge the peculiar institution.\"", "fl": false}, {"n": 64, "ch": "13", "st": "Upper-class plantation mistress:", "cc": ["Accepted sexual code keeping white women pure but tolerating white men/slave women relations", "Life of leisure, artistic pursuits", "Luxury of criticizing her role and slavery", "Faced an unexpected variety of burdensome managerial and service duties"], "ans": "D", "r": "\"Once she married and became a plantation mistress, a southern woman was often shocked by the size of her responsibilities\": nursing, clothing, food, and supervising servants. As the saying went, \"the mistress of a plantation was the most complete slave on it.\"", "fl": false}, {"n": 65, "ch": "13", "st": "Tidewater vs frontier planters:", "cc": ["Tidewater cotton, frontier tobacco/rice/sugar", "Frontier cotton gentry typically self-made, claiming status through wealth accumulation", "Tidewater closer ties to Britain, European hierarchy", "More opposition to slavery on frontier"], "ans": "B", "r": "\"The ideal of the Tidewater South was the English country gentleman,\" while \"the cotton gentry were self-made men who through hard work, aggressive business tactics, and good luck had risen from ordinary backgrounds.\"", "fl": false}, {"n": 66, "ch": "13", "st": "Why open slave rebellion less common in US than Latin America:", "cc": ["Had families and didn't want to risk getting caught", "Satisfied", "Turn the other cheek", "Freed at a certain age"], "ans": "A", "r": "In the U.S. \"whites outnumbered\" blacks, \"the government was much more powerful, most slaves were native-born, and family life was much stronger. Slaves recognized the odds against them.\" Strong families meant too much to risk.", "fl": false}, {"n": 67, "ch": "13", "st": "After 1830 southerners defended slavery more aggressively for all EXCEPT:", "cc": ["Rise of abolitionism", "Increasing dependence of southern economy on slave-grown staples", "Perceived decline in southern influence in national politics", "Nat Turner's revolt"], "ans": "C", "r": "The text dates the turn to the early 1830s, when \"the South found itself increasingly under attack\": Garrison's abolitionist Liberator (1831) and Nat Turner's revolt (1831), as \"the South's economy became more and more dependent on slave-produced staples.\" A decline in national political influence is not given as a cause.", "fl": false}, {"n": 68, "ch": "13", "st": "Nat Turner led a revolt despite relatively humane treatment by his master.", "cc": null, "ans": "True", "r": "True. Turner \"was given unusual privileges by his master, whom he described as a kind and trusting man,\" yet he led the 1831 revolt.", "fl": false}, {"n": 69, "ch": "13", "st": "Prosperity of southern agriculture kept South overwhelmingly rural; few cities; wealth depended on agricultural exports.", "cc": null, "ans": "True", "r": "True. \"The region remained overwhelmingly rural, with 84 percent of its labor force engaged in farming in 1860... few cities developed in the South.\" Cotton was \"its primary export and the major source of southern wealth.\"", "fl": false}, {"n": 70, "ch": "13", "st": "After 1831 free black southerners faced all EXCEPT:", "cc": ["Could not purchase own enslaved family members", "Could not travel state to state", "Could not vote or hold office", "Had to carry free papers"], "ans": "A", "r": "After Turner's revolt free blacks \"were forbidden to enter a different state, had to carry papers certifying their freedom... and could not vote, hold office.\" They were not barred from buying family: \"some did well enough to own slaves themselves... commonly their 'property' was their wives or children.\"", "fl": false}, {"n": 71, "ch": "13", "st": "Slaves concentrated along the old eastern seaboard (Tidewater) and in new plantation areas of the Deep South.", "cc": null, "ans": "True", "r": "True. \"In areas of fertile soil, flat or rolling countryside, and good transportation, slavery and the plantation system dominated\": the old Tidewater coast and the new Deep South cotton lands such as Alabama's Black Belt.", "fl": false}, {"n": 72, "ch": "13", "st": "Under the ___ system a specific assignment was given to each slave; workday over when completed:", "cc": ["Gang", "Hourly", "Piece-work", "Task"], "ans": "D", "r": "\"Other planters preferred the task system, under which each slave was given a specific daily assignment to complete, after which he or she was finished for the day.\"", "fl": false}, {"n": 73, "ch": "13", "st": "Most important function of religion for slaves:", "cc": ["Spirituals", "Framework for achieving their own freedom", "Grow Methodist/Baptist populations", "Literacy via Bible"], "ans": "B", "r": "\"Most slaves sought a Christianity firmly their own, beyond the control of the master,\" and spirituals of \"Canaan\" meant \"the North and freedom.\" Songs let slaves voice \"their yearning for freedom.\" Spirituals are a means, not the main function, and church growth and Bible literacy are not stressed.", "fl": false}, {"n": 74, "ch": "13", "st": "Industrial workers' resistance similar to slaves' resistance:", "cc": ["Marx", "Struck back at overseers/foremen who whipped", "Destroyed property to decrease owner's wealth", "Planned open revolts"], "ans": "C", "r": "The text's day-to-day resistance is property-focused: \"Many slaves resisted by abusing their masters' property. They mishandled animals, broke tools and machinery,\" and the most common form was \"theft.\" Open revolts were \"rare,\" striking back at overseers is not the pattern described, and Marx is not mentioned.", "fl": false}, {"n": 75, "ch": "13", "st": "NOT TRUE of abolitionist movement:", "cc": ["Black abolitionists demanded immediate end in North, South within thirty years", "Women drew on benevolent societies", "Foremost early figure was journalist Garrison", "Women played no active role"], "ans": "D", "r": "Not true: women were very active. \"Angelina and Sarah Grimké... left their native state to speak against the institution,\" and women \"took up the cause of women's rights\" through the antislavery movement. Garrison was the foremost early figure.", "fl": false}, {"n": 76, "ch": "13", "st": "Best generalization of N vs S economies after depression of 1839-1843:", "cc": ["Southern rural economy growing faster than North's, but wealth more evenly distributed among northern farmers", "Most southerners farmers, most northerners in cities", "North growing faster due to manufacturing, but southern rural economy afforded infinite opportunities", "South shifting toward manufacturing and fishing"], "ans": "A", "r": "\"Following the depression of 1839-1843, the southern economy grew faster than that in the North. Even so, per capita income in the South remained below that of the free states, and wealth was not as evenly distributed in the plantation South as in northern agricultural areas.\"", "fl": false}, {"n": 77, "ch": "13", "st": "Manufacturing lagged in South because:", "cc": ["High profits from agriculture discouraged other investments", "Slaves couldn't do industrial work", "Lacked capital", "Lacked white workforce"], "ans": "A", "r": "The South made \"only 9 percent of the nation's manufactured goods,\" and \"as long as high profits from cotton continued,\" calls for industry \"made little headway.\"", "fl": false}, {"n": 78, "ch": "13", "st": "Free blacks in the South:", "cc": ["Hierarchy favoring darker skin", "Mostly in Upper South", "Mostly urban", "Primarily mulattoes"], "ans": "B", "r": "Of 260,000 free black southerners, \"more than 85 percent of them lived in the Upper South.\" They were \"much more likely to be of mixed ancestry\" but not \"primarily\" mulatto, and \"most free black southerners lived in rural areas.\"", "fl": false}, {"n": 79, "ch": "1B", "st": "Based on interpreting information from the text, in McCulloch v. Maryland (1819) Chief Justice John Marshall's Supreme Court:", "cc": ["struck down New York's steamboat monopoly and defined interstate commerce broadly", "ruled that a state charter, like Dartmouth College's, was a contract no state could alter", "upheld the Second Bank's constitutionality, ruling a bank need only be useful under the \"necessary and proper\" clause", "declared the national bank unconstitutional because the Constitution never mentions a bank by name"], "ans": "C", "r": "In McCulloch v. Maryland (1819) \"the Court upheld the constitutionality of the Second Bank of the United States.\" Following Hamilton, \"by upholding Hamilton's doctrine of implied powers, Marshall enlarged federal power to an extraordinary degree\" (Ch.10).", "fl": false}, {"n": 80, "ch": "1B", "st": "Which Supreme Court case affirmed federal power to regulate interstate commerce and struck down a New York steamboat monopoly, resulting in more business competition?", "cc": ["Fletcher v. Peck (1810)", "Worcester v. Georgia (1832)", "Dartmouth College v. Woodward (1819)", "Gibbons v. Ogden (1824)"], "ans": "D", "r": "In Gibbons v. Ogden (1824) Marshall defined \"the right to regulate interstate commerce,\" \"striking down a steamboat monopoly granted by the state of New York\" (Ch.10).", "fl": false}, {"n": 81, "ch": "1B", "st": "The Marshall Court decisions in Fletcher v. Peck (1810) and Dartmouth College v. Woodward (1819) both rested on the principle that:", "cc": ["states could nullify federal laws that exceeded Congress's delegated powers", "Indian nations held full authority over their own lands", "states could not impair the obligation of contracts, including charters", "Congress could make all laws \"necessary and proper\" to run a national bank"], "ans": "C", "r": "In Fletcher v. Peck the Court \"struck down a Georgia law\" revoking a land grant, and in Dartmouth College the Court ruled \"that state charters were also contracts and could not be altered by later legislatures\" (Ch.10).", "fl": false}, {"n": 82, "ch": "1B", "st": "The Tariff of 1828, which its opponents labeled the \"Tariff of Abominations,\" led directly to which of the following?", "cc": ["Jackson's veto of the recharter of the Second Bank of the United States", "The South Carolina Exposition and Protest, secretly written by John C. Calhoun", "The Specie Circular requiring gold or silver for public lands", "The Webster-Hayne debate, which ended with the tariff's repeal"], "ans": "B", "r": "The 1828 \"Tariff of Abominations\" produced the \"South Carolina Exposition and Protest\" (the theory of nullification), later revealed to be by VP John C. Calhoun (Ch.11).", "fl": false}, {"n": 83, "ch": "1B", "st": "In the Webster-Hayne debate of 1830, Daniel Webster answered the states' rights position of Robert Hayne by declaring that:", "cc": ["a state could secede if a constitutional amendment went against it", "it was \"the people's constitution, the people's government,\" not a compact of states", "the national bank was unconstitutional and should be shut down", "the tariff ought to be lowered gradually to satisfy South Carolina"], "ans": "B", "r": "Webster: \"It is the people's constitution, the people's government, made for the people, made by the people, and answerable to the people\" (Ch.11).", "fl": false}, {"n": 84, "ch": "1B", "st": "Which of the following was NOT part of the resolution of the nullification crisis in 1833?", "cc": ["Congress passed the Force Bill giving Jackson military powers", "Jackson signed a compromise tariff lowering rates on March 1, 1833", "Federal troops occupied Charleston and arrested John C. Calhoun", "South Carolina repealed its nullification ordinance"], "ans": "C", "r": "No troops occupied Charleston. The Force Bill passed, Jackson signed the compromise tariff \"March 1, 1833, same day as Force Bill,\" and South Carolina \"repealed\" its ordinance (Ch.11).", "fl": false}, {"n": 85, "ch": "1B", "st": "Based on interpreting information from the text, how did Andrew Jackson respond to the Supreme Court's ruling in Worcester v. Georgia (1832)?", "cc": ["He called the decision \"stillborn\" and ignored it, continuing Indian removal", "He enforced it by sending the army to protect Cherokee lands in Georgia", "He asked Congress to repeal the Indian Removal Act of 1830", "He appointed Roger Taney to overturn it the following year"], "ans": "A", "r": "In Worcester v. Georgia (1832) Marshall ruled the tribes had full authority over their lands; \"Jackson called decision 'stillborn' and ignored it,\" and removal continued (Ch.11).", "fl": false}, {"n": 86, "ch": "1B", "st": "In the Bank War, Andrew Jackson responded to Nicholas Biddle's early request to recharter the Second Bank of the United States by:", "cc": ["signing the recharter in exchange for Henry Clay's support on the tariff", "asking the Supreme Court to overturn McCulloch v. Maryland in a new case", "turning the bank into an Independent Treasury with Biddle in charge", "vetoing the recharter in 1832 and moving federal deposits to state \"pet banks\""], "ans": "D", "r": "Jackson vetoed the 1832 recharter, then had Roger Taney move the federal deposits into selected state (\"pet\") banks: \"I never will restore the deposits.\" The charter \"expired 1836\" (Ch.11).", "fl": false}, {"n": 87, "ch": "1B", "st": "Which statement best describes the cause-and-effect role of Jackson's Specie Circular (July 1836)?", "cc": ["Requiring gold or silver for public land came too late to stop the speculative bubble that burst in 1837", "It rechartered the national bank and ended the Panic of 1819", "It ended the depression that followed the Panic of 1837 under Van Buren", "It required that Cherokees be paid in specie for lands taken under removal"], "ans": "A", "r": "The Specie Circular (July 1836) let the government accept \"only specie for public land\"; land sales \"dropped but too late,\" and the Panic of 1837 followed under Van Buren (Ch.11).", "fl": false}, {"n": 88, "ch": "1B", "st": "Andrew Jackson defended his \"spoils system\" as a democratic reform because:", "cc": ["it kept experienced opponents in office to serve the whole nation", "it let the Senate choose all federal officeholders by majority vote", "rotating supporters into office prevented an entrenched bureaucracy", "it opened offices only to those who passed a civil service exam"], "ans": "C", "r": "Jackson \"defended [the spoils system] as democratic reform\": \"rotation in office guards against entrenched bureaucrats\" (Ch.11).", "fl": false}];

 Q.forEach(q=>{if(pool&&!pool.has(q.n))return;if(f!=='all'&&q.ch!==f)return;

  let ch=q.cc?q.cc.map((t,i)=>`<button class="ch" data-a="${L[i]}">${L[i]}. ${esc(t)}</button>`).join(''):`<div class="tf"><button class="ch" data-a="True">True</button><button class="ch" data-a="False">False</button></div>`;
  c.innerHTML=`<div class="qn">Question ${q.n}</div><div><b>${q.cc?'':'True or False: '}${esc(q.st)}</b></div>${ch}<div class="ex" hidden></div>`;
  c.querySelectorAll('.ch').forEach(b=>b.onclick=()=>answer(q,c,b));box.appendChild(c)})}
function answer(q,c,b){if(c.dataset.done)return;c.dataset.done=1;const pick=b.dataset.a,ok=pick===q.ans;st[q.n]=ok;
 c.querySelectorAll('.ch').forEach(x=>{x.disabled=true;if(x.dataset.a===q.ans)x.classList.add('ok')});if(!ok)b.classList.add('bad');
 c.classList.add(ok?'right':'wrong');const ex=c.querySelector('.ex');ex.hidden=false;
 let why='';if(!ok){const pt=q.cc?q.cc[L.indexOf(pick)]:pick;why=`<div>You chose <b>${esc(pick)}</b>${q.cc?' ('+esc(pt)+')':''}, which is not the best answer per the text; see the reason below.</div>`}
 ex.innerHTML=`<div><b>${ok?'✓ Correct':'✗ Incorrect'}</b>. Answer: <b>${q.ans}${q.cc?'. '+esc(q.cc[L.indexOf(q.ans)]):''}</b></div>${why}<div style="margin-top:4px">${esc(q.r)}</div>`;score()}
document.getElementById('filt').onchange=render;
document.getElementById('restart').onclick=()=>{st={};pool=null;render();score();scrollTo(0,0)};
