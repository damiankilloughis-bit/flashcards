.card.right{border-color:#22c55e}.card.wrong{border-color:#ef4444}.ex{margin-top:8px;color:var(--muted);font-size:14px}#score{font-size:20px;font-weight:600}#timer{font-variant-numeric:tabular-nums}.mrow{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.mrow select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px}.mrow.ok select{border-color:#22c55e}.mrow.bad select{border-color:#ef4444}.bank{color:var(--muted);font-size:14px;margin:6px 0}.mrow{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}.mrow select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:15px}.mrow.ok select{border-color:#22c55e}.mrow.bad select{border-color:#ef4444}.bank{color:var(--muted);font-size:14px;margin:6px 0}.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}</style></head>

<div id="qs"></div><div class="row"><button class="btn p" id="sub">Submit</button></div></div><script>const RAW=[{"t": "q", "ch": "1", "q": "Which of the following is NOT a feature of Old English poetry such as <i>Beowulf</i>?", "c": [["rhymed couplets with five stresses per line", null], ["alliteration binding each line", "This IS a feature."], ["a caesura, or strong pause, in mid-line", "This IS a feature."], ["kennings such as “whale-road” for the sea", "This IS a feature."]], "a": 0, "x": "Rhymed five-stress couplets are Chaucer's Middle English form."}, {"t": "q", "ch": "1", "q": "<span style=\"color:#fbbf24\">Her quiz (Middle Ages Intro Q1)</span><br>What does the word “medieval” mean?", "c": [["old-fashioned", "A modern sense of the word, not its origin."], ["It comes from the Latin words for “middle ages.”", null], ["It is derived from the Greek for “dark ages.”", "The roots are Latin (medium aevum), not Greek, and mean middle age."], ["reformation", "The Reformation is a later, separate event."]], "a": 1, "x": "Medium + aevum = middle age, the period between antiquity and the Renaissance.", "fixed": 1, "past": 1}, {"t": "q", "ch": "1", "q": "<span style=\"color:#fbbf24\">Her quiz (Middle Ages Intro Q4) · You missed this before</span><br>The presence of French loan words (such as “marriage” and “parliament”) in our modern English language is due to the fact that Anglo-Norman or Old French was spoken in England after the Norman Conquest for nearly ______ years.", "c": [["100", "Far too short."], ["200", "Too short."], ["300", "Close, but her quiz key says nearly 400."], ["400", null]], "a": 3, "x": "French stayed in use in England for nearly 400 years after 1066, which is why so many French words entered English.", "fixed": 1, "past": 1}, {"t": "q", "ch": "1", "q": "<span style=\"color:#fbbf24\">Her quiz (Middle Ages Intro Q5)</span><br>In addition to learned languages such as Latin, Greek, and Hebrew, known principally by the clergy, inhabitants of England spoke and wrote a number of vernacular or common languages during the Middle Ages. The anthology divides this period of linguistic flux into three sections. Select the answer below that shows these languages in the proper chronological order.", "c": [["Old English, or Anglo-Saxon; Anglo-Norman, or Old French; and Middle English", null], ["Anglo-Norman, or Old French; Old English, or Anglo-Saxon; and Middle English", "Old English came first; French arrived in 1066."], ["Old English, or Anglo-Saxon; Middle English; Anglo-Norman, or Old French", "French came between Old and Middle English."], ["Middle English; Old English or Anglo-Saxon; Old French, or Anglo-Norman", "Middle English is last, not first."]], "a": 0, "x": "Old English until 1066, then Anglo-Norman French, then Middle English.", "fixed": 1, "past": 1}, {"t": "q", "ch": "1", "q": "<span style=\"color:#fbbf24\">Her quiz (Middle Ages Intro Q7)</span><br>After the Romans withdrew from England in the fifth century, which three Germanic tribes invaded the island?", "c": [["Celts, Britons, Saxons", "Celts and Britons were the natives, not Germanic invaders."], ["Britons, Angles, Jutes", "Britons were the native people."], ["Angles, Saxons, Jutes", null], ["Celts, Angles, Saxons", "Celts were natives; the third tribe is the Jutes."]], "a": 2, "x": "The Angles, Saxons, and Jutes settled England after the Romans left.", "fixed": 1, "past": 1}, {"t": "q", "ch": "1", "q": "<span style=\"color:#fbbf24\">Her quiz (Middle Ages Intro Q8)</span><br>Which of the following might be described accurately as a “kenning”?", "c": [["“whale-road” (in place of the word “sea”)", null], ["“crown” (in place of the word “king”)", "A one-word substitution (metonymy), not a compound kenning."], ["“shepherd” (in place of the word “lord”)", "A metaphor, not a compound kenning."], ["“kin” (in place of the word “king”)", "Just a different word, not a kenning."]], "a": 0, "x": "A kenning is a compound metaphor that stands for a thing: whale-road = sea.", "fixed": 1, "past": 1}, {"t": "q", "ch": "1", "q": "<span style=\"color:#fbbf24\">Her quiz (Middle Ages Intro Q11)</span><br>Here are four lines of poetry. Based on your reading of the introduction, are they Old English or Middle English?<br><i>Some saiden wommen loven best richesse; / Some saide honour, some said jolinesse; / Some riche array, some saiden lust abedde, / And ofte time to be widwe and wedde.</i>", "c": [["Middle English, because this passage features alliteration", "Right period, wrong reason: alliteration is the Old English mark."], ["Old English, because there is an obvious caesura in mid-line", "No strong mid-line pause, and it rhymes."], ["Old English, because the passage is in rhymed couplets", "Rhymed couplets mark Middle English, not Old English."], ["Middle English, because the passage is in rhymed couplets and has five stresses per line", null]], "a": 3, "x": "Rhyming pairs of five-stress lines = Chaucer's Middle English (this is from the Wife's Tale).", "fixed": 1, "past": 1}, {"t": "m", "ch": "1", "title": "Match each term to its description.", "p": [{"p": "Old English", "a": "Language of the Angles, Saxons, and Jutes, spoken until 1066", "x": "The Germanic settlers' language, used for Beowulf."}, {"p": "Anglo-Norman French", "a": "Language of England's rulers after the Norman Conquest", "x": "After 1066 the Normans' French became the language of court and power."}, {"p": "Middle English", "a": "Language that displaced French by the late 1300s; Chaucer's English", "x": "Old English mixed with thousands of French words; Chaucer writes in it."}, {"p": "Alliteration", "a": "Repeated first sounds that bind an Old English line", "x": "Old English verse links its half-lines by repeated initial sounds instead of rhyme."}, {"p": "Rhymed couplet", "a": "Two rhyming lines, five stresses each, as in Chaucer", "x": "Chaucer's Prologue and Tale are written in rhyming pairs of five-stress lines."}], "bank": ["Language of the Angles, Saxons, and Jutes, spoken until 1066", "Language of England's rulers after the Norman Conquest", "Language that displaced French by the late 1300s; Chaucer's English", "Repeated first sounds that bind an Old English line", "Two rhyming lines, five stresses each, as in Chaucer", "A strong pause in the middle of a line", "Fourteen-line poem in iambic pentameter"]}, {"t": "q", "ch": "2", "q": "In the fight with Grendel, Beowulf", "c": [["tears off Grendel's arm bare-handed", null], ["kills Grendel with the sword Hrunting", "Hrunting is used later, against Grendel's mother, and fails."], ["beheads Grendel with a giant's sword", "He beheads Grendel's corpse later, in the mere."], ["drowns Grendel in the mere", "Grendel flees, mortally wounded, to die in the mere."]], "a": 0, "x": "He refuses weapons since Grendel uses none; the arm hangs in Heorot as a trophy."}, {"t": "q", "ch": "2", "q": "What starts the dragon's attacks?", "c": [["A runaway slave steals a cup", null], ["Beowulf raids its barrow for gold to pay his warriors", "Beowulf fights it only after the attacks start."], ["Grendel's kin wake it for revenge", "Grendel's line has no role in the dragon story."], ["Wiglaf kills its mate", "Invented."]], "a": 0, "x": "The thief takes the cup to win back his master's favor, and the dragon burns the Geats' land."}, {"t": "q", "ch": "2", "q": "In the final fight, who stands by Beowulf and who does not?", "c": [["Wiglaf stays; ten others flee", null], ["Unferth stays; Wiglaf flees into the woods", "Unferth is a Dane from the first half; Wiglaf is the loyal one."], ["All eleven of his warriors fight beside him", "Ten flee."], ["Hygelac stays; the Danes flee", "Hygelac is long dead by then."]], "a": 0, "x": "Wiglaf remembers Beowulf's gifts and fights; the others run into the woods and are condemned."}, {"t": "q", "ch": "2", "q": "After Beowulf's funeral, the Geats fear that", "c": [["enemy tribes will now attack", null], ["Grendel's kin will rise from the mere again", "Grendel is long dead."], ["the dragon's mate will come to avenge it", "Invented."], ["Wiglaf will seize the treasure for himself", "The treasure is buried with Beowulf."]], "a": 0, "x": "A Geat woman's lament foretells invasion, slaughter, and slavery."}, {"t": "q", "ch": "2", "q": "Which best describes the young hero vs. aging king contrast?", "c": [["Young Beowulf seeks glory; old Beowulf must protect a people", null], ["Young Beowulf fights for treasure; old Beowulf rejects treasure", "He looks at the hoard while dying."], ["Young Beowulf is cautious; old Beowulf is reckless", "Both phases show courage; the issue is responsibility."], ["Young Beowulf rules the Danes; old Beowulf serves Hygelac", "Reversed and wrong."]], "a": 0, "x": "His death as king leaves the Geats exposed, unlike his youthful risks."}, {"t": "q", "ch": "2", "q": "Fill in the blank in Heaney's opening:<br><i>In the end each clan on the outlying coasts / Beyond the ______ had to yield to him / And begin to pay tribute. That was one good king.</i> (lines 9–11)", "c": [["whale-road", null], ["sea-cliffs", "Not the word; a plain description, not a kenning."], ["mead-hall", "A hall isn't on the coasts' far side."], ["ring-road", "Invented; “Ring-Danes” is the epithet."]], "a": 0, "x": "“Whale-road” is a kenning for the sea."}, {"t": "q", "ch": "2", "q": "Hrothgar warns Beowulf: <i>“O flower of warriors, beware of that trap. / Choose, dear Beowulf, the better part, / Eternal rewards. Do not give way to ______.”</i> (lines 1758–1760)", "c": [["pride", null], ["wrath", "Not his word."], ["greed", "Hoarding comes up in the speech, but the closing word is pride."], ["grief", "That's Beowulf telling Hrothgar not to grieve."]], "a": 0, "x": "His sermon warns that strength fades, so a hero must not grow proud like Heremod."}, {"t": "q", "ch": "2", "q": "<span style=\"color:#fbbf24\">Her quiz (Beowulf Part 2 Q2) · You missed this before</span><br>What does this avenger take from the hall? <i>(The avenger is Grendel’s mother.)</i>", "c": [["Grendel’s hand", "She does take it, but she also takes Aeschere, so a single choice is incomplete."], ["Beowulf", "Beowulf isn't even in the hall that night."], ["Hrothgar’s adviser Aeschere", "Also true, but so is A."], ["a and c", null]], "a": 3, "x": "She snatches back Grendel's hand AND carries off Aeschere, Hrothgar's counselor. Watch for 'a and c' when two choices are both true.", "fixed": 1, "past": 1}, {"t": "q", "ch": "2", "q": "<span style=\"color:#fbbf24\">Her quiz (Beowulf Part 2 Q3)</span><br>Consider the following lines from Beowulf. What literary device does the poet use in these lines?<br><i>A few miles from here / a frost-stiffened wood waits and keeps watch / above a mere.</i> (lines 361–363)", "c": [["personification", null], ["pathetic fallacy", "Pathetic fallacy gives nature human feelings that mirror a mood; here the wood is given human actions."], ["metaphor", "Nothing is called something else."], ["litotes", "Litotes is understatement by denying the opposite."]], "a": 0, "x": "The wood 'waits and keeps watch' — human actions given to a non-human thing.", "fixed": 1, "past": 1}, {"t": "q", "ch": "2", "q": "<span style=\"color:#fbbf24\">Her quiz (Beowulf Part 2 Q4)</span><br>According to Beowulf, what is the “best and only bulwark” (line 1389) for a warrior against death?", "c": [["faith", "Not what he says here."], ["gold", "Treasure isn't his answer."], ["glory", null], ["love", "Not his answer."]], "a": 2, "x": "“Let whoever can / Win glory before death. When a warrior is gone, / That will be his best and only bulwark.”", "fixed": 1, "past": 1}, {"t": "q", "ch": "2", "q": "<span style=\"color:#fbbf24\">Her quiz (Beowulf Part 2 Q5)</span><br>Beginning at line 1441 of the poem, we hear in detail of the arming of the hero for his second battle. What animal adorns Beowulf’s helmet? Fill in the blank in the verse below:<br><i>It was of beaten gold, / princely headgear hooped and hasped / by a weapon-smith who had worked wonders / in days gone by and adorned it with ______-shapes; / since then it had resisted every sword.</i> (lines 1448–1454)", "c": [["boar", null], ["bear", "Not on the helmet."], ["dragon", "The dragon comes in the last fight, not the helmet."], ["beaver", "Not on the helmet."]], "a": 0, "x": "Boar-shapes guard the helmet.", "fixed": 1, "past": 1}, {"t": "q", "ch": "2", "q": "<span style=\"color:#fbbf24\">Her quiz (Beowulf Part 2 Q6)</span><br>With what weapon does Beowulf kill Grendel’s mother?", "c": [["with the “rare and ancient sword named Hrunting” (line 1458)", "Hrunting fails against her."], ["with no weapon; he uses his bare hands", "That's how he fights Grendel."], ["with an ancient sword from the monster’s own armory", null], ["with the “broad whetted knife” (line 1546) belonging to Grendel’s mother", "She attacks him with it; it doesn't kill her."]], "a": 2, "x": "He grabs a giant-forged sword hanging in her lair.", "fixed": 1, "past": 1}, {"t": "q", "ch": "2", "q": "<span style=\"color:#fbbf24\">Her quiz (Beowulf Part 2 Q7)</span><br>What happens to the weapon with which Beowulf slays the monster?", "c": [["It clatters to the floor, shatters, and shivers into pieces.", "Shattering is what happens to Naegling in the dragon fight."], ["It slathers and wilts into gory icicles.", null], ["It grows hot as hell, hisses, and dissipates in smoke.", "Invented."], ["Beowulf tosses the dirtied weapon back into the fiend’s armory.", "He keeps the hilt."]], "a": 1, "x": "The blade melts in the monster's blood like icicles; only the hilt remains.", "fixed": 1, "past": 1}, {"t": "q", "ch": "2", "q": "<span style=\"color:#fbbf24\">Her quiz (Beowulf Part 2 Q8)</span><br>With what battle-prize does Beowulf present Hrothgar as proof of his second victory?", "c": [["the head of Grendel’s mother", "He brings Grendel's head, not hers."], ["the knife of Grendel’s mother", "Not brought back."], ["ancient gems from Grendel’s mother’s hoard", "He leaves the treasure."], ["the hilt of the weapon that killed Grendel’s mother", null]], "a": 3, "x": "He brings the giant sword's hilt (and Grendel's head).", "fixed": 1, "past": 1}, {"t": "q", "ch": "2", "q": "<span style=\"color:#fbbf24\">Her quiz (Beowulf Part 2 Q10)</span><br>What sin does Hrothgar caution Beowulf to avoid?", "c": [["pride", null], ["sloth", "Not his warning."], ["wrath", "Not his warning."], ["lust", "Not his warning."]], "a": 0, "x": "“Do not give way to pride” (line 1760).", "fixed": 1, "past": 1}, {"t": "q", "ch": "2", "q": "<span style=\"color:#fbbf24\">Her quiz (Beowulf Part 1 Q6)</span><br>“[They] then heaved out, / away with a will in their wood-wreathed ship” (line 216). This line, describing Beowulf’s departure from Geatland, is typical of the poem’s form and Old English poetic technique because", "c": [["it features alliteration", "True, but not the only reason."], ["it has 4 strong stresses", "True, but not the only reason."], ["it does not rhyme", "True, but not the only reason."], ["all of the above", null]], "a": 3, "x": "Alliteration (w-w-w), four stresses, and no rhyme are all Old English marks.", "fixed": 1, "past": 1}, {"t": "q", "ch": "2", "q": "<span style=\"color:#fbbf24\">Her quiz (Beowulf Part 1 Q7)</span><br>At the feast in Heorot, Unferth speaks “contrary words” (line 501) against Beowulf. Of what does Unferth accuse Beowulf?", "c": [["miserliness", "Not the charge."], ["bastardy", "Not the charge."], ["vanity", null], ["cowardice", "He mocks him for losing to Breca, not for cowardice."]], "a": 2, "x": "He says Beowulf's swimming match with Breca was vain boasting.", "fixed": 1, "past": 1}, {"t": "q", "ch": "2", "q": "<span style=\"color:#fbbf24\">Her quiz (Beowulf Part 1 Q8)</span><br>Beowulf in turn accuses Unferth of", "c": [["killing his own “kith and kin”", "True, but so is C."], ["pagan beliefs", "Not his charge."], ["“unchecked atrocity”", "True, but so is A."], ["a and c", null]], "a": 3, "x": "He says Unferth killed his own brothers and that Grendel's 'unchecked atrocity' proves Unferth's weakness.", "fixed": 1, "past": 1}, {"t": "q", "ch": "2", "q": "<span style=\"color:#fbbf24\">Her quiz (Beowulf Part 1 Q10)</span><br>What trophy does Beowulf claim at the end of his battle with Grendel?", "c": [["Grendel’s arm and hand", null], ["the hinges of the door Grendel ripped", "Invented."], ["the golden hasp of a mead-bench thrown by the monster", "Invented."], ["Grendel’s fang", "Invented."]], "a": 0, "x": "He tears off Grendel's arm and hangs it in Heorot.", "fixed": 1, "past": 1}, {"t": "m", "ch": "2", "title": "Match each Beowulf name to its description.", "p": [{"p": "Hrothgar", "a": "King of the Danes who builds Heorot and advises Beowulf against pride", "x": "Grendel terrorizes his hall; before Beowulf leaves he warns him that strength fades."}, {"p": "Wealhtheow", "a": "Hrothgar's queen, who passes the mead-cup", "x": "She serves the cup and asks Beowulf to be kind to her sons."}, {"p": "Unferth", "a": "Dane who taunts Beowulf about Breca, later lends him Hrunting", "x": "Jealous at first, he later lends his sword for the fight in the mere."}, {"p": "Grendel's mother", "a": "Attacks the hall to avenge her son and kills Aeschere", "x": "She follows the warrior revenge code; Beowulf kills her in her underwater lair."}, {"p": "Wiglaf", "a": "Young kinsman who alone stands by Beowulf against the dragon", "x": "The ten other warriors flee; Wiglaf helps kill the dragon."}, {"p": "Heorot", "a": "Hrothgar's great mead-hall", "x": "Its joyful noise enrages Grendel, who raids it for years."}], "bank": ["King of the Danes who builds Heorot and advises Beowulf against pride", "Hrothgar's queen, who passes the mead-cup", "Dane who taunts Beowulf about Breca, later lends him Hrunting", "Attacks the hall to avenge her son and kills Aeschere", "Young kinsman who alone stands by Beowulf against the dragon", "Hrothgar's great mead-hall", "Beowulf's uncle, king of the Geats", "Thief who steals the dragon's cup"]}, {"t": "q", "ch": "3", "q": "The terms of the Green Knight's challenge:", "c": [["one blow now, one back in a year and a day", null], ["fight him on foot until one knight yields", "It's a blow-for-blow game."], ["answer his riddle within a year and a day", "That's closer to the Wife of Bath's Tale."], ["trade winnings for three days", "That's Bertilak's game at the castle."]], "a": 0, "x": "Any knight may swing the axe once, then must seek the Green Chapel a year later to receive the blow back."}, {"t": "q", "ch": "3", "q": "In the bedroom scenes Gawain is caught between", "c": [["courtesy to the lady and loyalty to his host", null], ["his love of Arthur and his love of Guinevere", "Not the bedroom conflict."], ["fear of the Green Knight and of Morgan", "He doesn't know of Morgan yet."], ["his duty to his horse and duty to his armor", "Not an obligation conflict."]], "a": 0, "x": "Refusing her is rude, but accepting betrays Bertilak and his own chastity."}, {"t": "q", "ch": "3", "q": "Why are there three swings at the Green Chapel?", "c": [["They match the three days of exchanges", null], ["Gawain asked for three chances at the chapel", "He asked for one blow."], ["The knight missed twice by accident", "The misses were deliberate."], ["Morgan cursed the axe so it would miss twice", "The three swings are Bertilak's judgment."]], "a": 0, "x": "Two harmless swings for the two days Gawain traded honestly; a nick for the day he hid the girdle."}, {"t": "q", "ch": "3", "q": "How does Gawain feel about his failure?", "c": [["Ashamed of his cowardice and covetousness", null], ["Proud, because he survived the blow", "He's angry and ashamed."], ["Indifferent, since it was only a game", "He takes it very seriously."], ["Angry at the lady and will seek revenge", "He does blame women briefly but doesn't seek revenge; his main feeling is shame."]], "a": 0, "x": "He vows to wear the girdle forever as a badge of his sin."}, {"t": "q", "ch": "3", "q": "How does Arthur's court respond?", "c": [["They all wear green sashes to honor him", null], ["They banish Gawain from the Round Table", "They welcome him home."], ["They punish him for breaking his word", "No punishment."], ["They burn the girdle in the great hall", "They adopt it."]], "a": 0, "x": "The court treats the girdle as a sign of honor, not shame."}, {"t": "q", "ch": "3", "q": "In <i>Sir Gawain</i>, a stanza of long alliterative lines ends with a two-syllable line followed by a short rhymed quatrain in iambic trimeter. What is this device called?", "c": [["the bob and wheel", null], ["the caesura", "A caesura is a mid-line pause."], ["the kenning", "A kenning is a compound metaphor."], ["the rhymed couplet", "Couplets are Chaucer's form."]], "a": 0, "x": "The 'bob' is the short line; the 'wheel' is the rhymed quatrain, like “Before they part the pair / repeat their pact again.”"}, {"t": "q", "ch": "3", "q": "<span style=\"color:#fbbf24\">Her quiz (Gawain Quiz 2 Q1) · You missed this before</span><br>At what time of the year does Sir Gawain finally pursue the Green Knight’s command to seek him out?", "c": [["in spring, when “the world’s weather wages war on winter” (line 504)", "Spring passes as the year turns; he hasn't left yet."], ["in summer, when plants “flower and flourish” (line 518)", "Still waiting."], ["in autumn, at Michaelmas", null], ["in winter, when the lavish Christmas festivities begin again", "He arrives at the castle by Christmas Eve, but he sets out earlier."]], "a": 2, "x": "He sets out after Michaelmas (late September), as autumn's moon arrives.", "fixed": 1, "past": 1}, {"t": "q", "ch": "3", "q": "<span style=\"color:#fbbf24\">Her quiz (Gawain Quiz 2 Q3)</span><br>The golden device on Sir Gawain’s shield is richly symbolic of his character and reputation. Sir Gawain is described as “devoid of vices” and “good as the purest gold” (lines 634 and 633) using imagery and allusions to “five sets of five” (line 656) that illustrate aspects of his character. Which of these answer
