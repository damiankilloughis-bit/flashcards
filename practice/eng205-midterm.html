<div id="qs"></div><div class="row"><button class="btn p" id="sub">Submit</button></div></div><script>const RAW=[{"t": "q", "ch": "1", "q": "The word \"medieval\" comes from Latin words meaning:", "right": "\"middle age\" (medium + aevum)", "x": "Medium = middle, aevum = age: the age between Rome's fall and the Renaissance.", "wr": [["\"dark time\" (tenebrae + tempus)", "Made-up roots; \"Dark Ages\" is a different, later label."], ["\"knightly age\" (miles + aevum)", "Miles means soldier; it isn't the root of medieval."], ["\"old kingdom\" (vetus + regnum)", "Not the source; medieval literally means middle age."]]}, {"t": "q", "ch": "1", "q": "Who settled England after the Romans withdrew?", "right": "Angles, Saxons, Jutes", "x": "Germanic tribes who arrived around 450 and founded their own kingdoms, speaking Old English.", "wr": [["The French-speaking Normans under William", "They came much later, in 1066."], ["The Vikings from Denmark", "Viking raids came centuries after the Anglo-Saxon settlement."], ["Celtic tribes crossing over from Ireland", "The Celts were the native Britons the Germanic tribes displaced."]]}, {"t": "q", "ch": "1", "q": "Which lists the language periods the Norton describes, in order?", "right": "Old English, Anglo-Norman, Middle English", "x": "Old English until 1066, then French under the Normans, then Middle English, which displaced French by the late 1300s.", "wr": [["Middle English, Old English, Anglo-Norman French", "Out of order: Old English comes first."], ["Old English, Middle English, Anglo-Norman French", "French came between Old and Middle English, after 1066."], ["Latin, Old English, Early Modern English", "Latin wasn't one of the spoken-English periods, and Early Modern comes after the Middle Ages."]]}, {"t": "m", "ch": "1", "title": "Match each term to its description.", "p": [{"p": "Old English", "a": "Language of the Angles, Saxons, and Jutes, spoken until 1066", "x": "The Germanic settlers' language, used for Beowulf."}, {"p": "Anglo-Norman French", "a": "Language of England's rulers after the Norman Conquest", "x": "After 1066 the Normans' French became the language of court and power."}, {"p": "Middle English", "a": "Language that displaced French by the late 1300s; Chaucer's English", "x": "Old English mixed with thousands of French words; Chaucer writes in it."}, {"p": "Alliteration", "a": "Repeated first sounds that bind an Old English line", "x": "Old English verse links its half-lines by repeated initial sounds instead of rhyme."}, {"p": "Rhymed couplet", "a": "Two rhyming lines, five stresses each, as in Chaucer", "x": "Chaucer's Prologue and Tale are written in rhyming pairs of five-stress lines."}], "bank": ["Language of the Angles, Saxons, and Jutes, spoken until 1066", "Language of England's rulers after the Norman Conquest", "Language that displaced French by the late 1300s; Chaucer's English", "Repeated first sounds that bind an Old English line", "Two rhyming lines, five stresses each, as in Chaucer", "A strong pause in the middle of a line", "Fourteen-line poem in iambic pentameter"]}, {"t": "q", "ch": "2", "q": "In the fight with Grendel, Beowulf", "right": "tears off Grendel's arm bare-handed", "x": "He refuses weapons since Grendel uses none; the arm hangs in Heorot as a trophy.", "wr": [["kills Grendel with the sword Hrunting", "Hrunting is used later, against Grendel's mother, and fails."], ["beheads Grendel with a giant's sword", "He beheads Grendel's corpse later, in the mere."], ["drowns Grendel in the mere", "Grendel flees, mortally wounded, to die in the mere."]]}, {"t": "q", "ch": "2", "q": "What happens to the weapons in the fight with Grendel's mother?", "right": "Hrunting fails; the giant sword melts", "x": "Hrunting won't bite, so he uses an ancient giant's sword, whose blade melts in the monster's blood.", "wr": [["Naegling snaps on her skull and he uses his knife", "Naegling snaps on the dragon."], ["Hrunting kills her but is lost in the mere", "Hrunting fails, and Beowulf returns it to Unferth."], ["Beowulf uses only his bare hands throughout", "He wrestles, but kills her with the giant sword."]]}, {"t": "q", "ch": "2", "q": "What does Beowulf bring back from the mere?", "right": "Grendel's head and the sword hilt", "x": "He leaves the treasure and takes only the head and the jeweled hilt to Hrothgar.", "wr": [["Grendel's arm and Hrunting", "The arm was taken in fight 1; Hrunting he simply returns."], ["a jeweled cup from the hoard", "The cup is stolen from the dragon by a slave."], ["Grendel's mother's head and her treasure", "He brings back Grendel's head, and no treasure."]]}, {"t": "q", "ch": "2", "q": "Hrothgar's advice before Beowulf goes home warns him chiefly against", "right": "pride", "x": "His \"sermon\" warns that strength fades and tells Beowulf not to give way to pride but to choose eternal rewards.", "wr": [["trusting the Danes again", "He's grateful to Beowulf and pledges friendship."], ["fighting dragons in old age", "No dragon is mentioned in his advice."], ["marrying a foreign queen", "Not part of his speech."]]}, {"t": "q", "ch": "2", "q": "What Beowulf says about glory:", "right": "win glory before death", "x": "Since death comes to all, fame won in life is a warrior's best memorial.", "wr": [["glory belongs only to kings, not to their thanes", "He seeks glory as a young warrior, not a king."], ["glory is vanity and should be shunned", "That's closer to Hrothgar's warning about pride."], ["glory comes from treasure kept safe", "He says glory comes from deeds, not hoarding."]]}, {"t": "q", "ch": "2", "q": "What starts the dragon's attacks?", "right": "A runaway slave steals a cup", "x": "The thief takes the cup to win back his master's favor, and the dragon burns the Geats' land.", "wr": [["Beowulf raids its barrow for gold to pay his warriors", "Beowulf fights it only after the attacks start."], ["Grendel's kin wake it for revenge", "Grendel's line has no role in the dragon story."], ["Wiglaf kills its mate", "Invented."]]}, {"t": "q", "ch": "2", "q": "In the final fight, who stands by Beowulf and who does not?", "right": "Wiglaf stays; ten others flee", "x": "Wiglaf remembers Beowulf's gifts and fights; the others run into the woods and are condemned.", "wr": [["Unferth stays; Wiglaf flees into the woods", "Unferth is a Dane from the first half; Wiglaf is the loyal one."], ["All eleven of his warriors fight beside him", "Ten flee."], ["Hygelac stays; the Danes flee", "Hygelac is long dead by then."]]}, {"t": "q", "ch": "2", "q": "After Beowulf's funeral, the Geats fear that", "right": "enemy tribes will now attack", "x": "A Geat woman's lament foretells invasion, slaughter, and slavery.", "wr": [["Grendel's kin will rise from the mere again", "Grendel is long dead."], ["the dragon's mate will come to avenge it", "Invented."], ["Wiglaf will seize the treasure for himself", "The treasure is buried with Beowulf."]]}, {"t": "q", "ch": "2", "q": "Which best describes the young hero vs. aging king contrast?", "right": "Young Beowulf seeks glory; old Beowulf must protect a people", "x": "His death as king leaves the Geats exposed, unlike his youthful risks.", "wr": [["Young Beowulf fights for treasure; old Beowulf rejects treasure", "He looks at the hoard while dying."], ["Young Beowulf is cautious; old Beowulf is reckless", "Both phases show courage; the issue is responsibility."], ["Young Beowulf rules the Danes; old Beowulf serves Hygelac", "Reversed and wrong."]]}, {"t": "m", "ch": "2", "title": "Match each Beowulf name to its description.", "p": [{"p": "Hrothgar", "a": "King of the Danes who builds Heorot and advises Beowulf against pride", "x": "Grendel terrorizes his hall; before Beowulf leaves he warns him that strength fades."}, {"p": "Wealhtheow", "a": "Hrothgar's queen, who passes the mead-cup", "x": "She serves the cup and asks Beowulf to be kind to her sons."}, {"p": "Unferth", "a": "Dane who taunts Beowulf about Breca, later lends him Hrunting", "x": "Jealous at first, he later lends his sword for the fight in the mere."}, {"p": "Grendel's mother", "a": "Attacks the hall to avenge her son and kills Aeschere", "x": "She follows the warrior revenge code; Beowulf kills her in her underwater lair."}, {"p": "Wiglaf", "a": "Young kinsman who alone stands by Beowulf against the dragon", "x": "The ten other warriors flee; Wiglaf helps kill the dragon."}, {"p": "Heorot", "a": "Hrothgar's great mead-hall", "x": "Its joyful noise enrages Grendel, who raids it for years."}], "bank": ["King of the Danes who builds Heorot and advises Beowulf against pride", "Hrothgar's queen, who passes the mead-cup", "Dane who taunts Beowulf about Breca, later lends him Hrunting", "Attacks the hall to avenge her son and kills Aeschere", "Young kinsman who alone stands by Beowulf against the dragon", "Hrothgar's great mead-hall", "Beowulf's uncle, king of the Geats", "Thief who steals the dragon's cup"]}, {"t": "q", "ch": "3", "q": "The terms of the Green Knight's challenge:", "right": "one blow now, one back in a year and a day", "x": "Any knight may swing the axe once, then must seek the Green Chapel a year later to receive the blow back.", "wr": [["fight him on foot until one knight yields", "It's a blow-for-blow game."], ["answer his riddle within a year and a day", "That's closer to the Wife of Bath's Tale."], ["trade winnings for three days", "That's Bertilak's game at the castle."]]}, {"t": "q", "ch": "3", "q": "The exchange-of-winnings game requires that", "right": "the two men trade each day's winnings", "x": "Bertilak hunts, Gawain stays in the castle, and they swap their gains every evening for three days.", "wr": [["Gawain ride out and win a prize in the hunt", "Gawain stays home in bed."], ["Gawain give the lady his girdle", "She gives him the girdle."], ["they exchange blows with the green axe at the chapel", "That's the beheading game."]]}, {"t": "q", "ch": "3", "q": "Which is the correct order of Bertilak's hunts?", "right": "deer, boar, fox", "x": "Day one deer, day two boar, day three fox, matching Gawain's growing danger in the bedroom.", "wr": [["boar, deer, fox", "Deer comes first."], ["fox, boar, deer", "Reversed."], ["deer, fox, boar", "Fox is last."]]}, {"t": "q", "ch": "3", "q": "In the bedroom scenes Gawain is caught between", "right": "courtesy to the lady and loyalty to his host", "x": "Refusing her is rude, but accepting betrays Bertilak and his own chastity.", "wr": [["his love of Arthur and his love of Guinevere", "Not the bedroom conflict."], ["fear of the Green Knight and of Morgan", "He doesn't know of Morgan yet."], ["his duty to his horse and duty to his armor", "Not an obligation conflict."]]}, {"t": "q", "ch": "3", "q": "Why are there three swings at the Green Chapel?", "right": "They match the three days of exchanges", "x": "Two harmless swings for the two days Gawain traded honestly; a nick for the day he hid the girdle.", "wr": [["Gawain asked for three chances at the chapel", "He asked for one blow."], ["The knight missed twice by accident", "The misses were deliberate."], ["Morgan cursed the axe so it would miss twice", "The three swings are Bertilak's judgment."]]}, {"t": "q", "ch": "3", "q": "How does Gawain feel about his failure?", "right": "Ashamed of his cowardice and covetousness", "x": "He vows to wear the girdle forever as a badge of his sin.", "wr": [["Proud, because he survived the blow", "He's angry and ashamed."], ["Indifferent, since it was only a game", "He takes it very seriously."], ["Angry at the lady and will seek revenge", "He does blame women briefly but doesn't seek revenge; his main feeling is shame."]]}, {"t": "q", "ch": "3", "q": "How does Arthur's court respond?", "right": "They all wear green sashes to honor him", "x": "The court treats the girdle as a sign of honor, not shame.", "wr": [["They banish Gawain from the Round Table", "They welcome him home."], ["They punish him for breaking his word", "No punishment."], ["They burn the girdle in the great hall", "They adopt it."]]}, {"t": "m", "ch": "3", "title": "Match each Gawain name or object to its description.", "p": [{"p": "Bertilak", "a": "Castle host who is secretly the Green Knight", "x": "Bertilak de Hautdesert reveals he was the Green Knight in disguise."}, {"p": "The lady of the castle", "a": "Tempts Gawain in the bedroom and gives him the girdle", "x": "On three mornings she visits him; on the third she gives him the belt."}, {"p": "Morgan le Fay", "a": "Gawain's aunt, who planned the whole test", "x": "She sent the Green Knight to test the Round Table and frighten Guinevere."}, {"p": "Gringolet", "a": "Gawain's horse", "x": "Gawain rides Gringolet through the wilderness to the Green Chapel."}, {"p": "The pentangle", "a": "Five-pointed star standing for Gawain's virtue in \"five fives\"", "x": "An endless knot on his shield: five senses, fingers, wounds, joys, virtues."}, {"p": "The green girdle", "a": "Belt said to keep its wearer from being slain; becomes a badge of his fault", "x": "He hides it from Bertilak, then wears it as a sign of cowardice and covetousness."}], "bank": ["Castle host who is secretly the Green Knight", "Tempts Gawain in the bedroom and gives him the girdle", "Gawain's aunt, who planned the whole test", "Gawain's horse", "Five-pointed star standing for Gawain's virtue in \"five fives\"", "Belt said to keep its wearer from being slain; becomes a badge of his fault", "Arthur's queen at Camelot", "The Green Knight's axe"]}, {"t": "q", "ch": "4", "q": "The Wife opens her Prologue by setting what against the authority of learned clerks?", "right": "her own experience", "x": "\"Experience, though no authority / Were in this world, is right enough for me.\"", "wr": [["the teachings of Scripture", "She uses scripture when it helps, but opens with experience."], ["the law of the king's courts", "Not her argument."], ["the Pardoner's preaching on the road", "He interrupts later; not her opening claim."]]}, {"t": "q", "ch": "4", "q": "What happens over Jankin's book?", "right": "After a fight he gives her control and burns it", "x": "The fight ends with Jankin handing her \"the bridle\" of house and land.", "wr": [["She reads it and comes to agree with him", "She hates the book."], ["He sells it to pay off her old debts", "Invented."], ["They write a new book of good wives together", "Invented."]]}, {"t": "q", "ch": "4", "q": "Why are the fairies gone from the land in the Tale?", "right": "Friars bless every place now", "x": "The \"limitours\" walk where elves used to, a jab at the friars.", "wr": [["King Arthur banished them from his kingdom", "Not in the Tale."], ["A great plague killed them off", "Not in the Tale."], ["The knight's crime drove them away", "Unrelated."]]}, {"t": "q", "ch": "4", "q": "The knight's crime and the queen's sentence:", "right": "Rape; learn what women most desire", "x": "Arthur sentences him to death; the queen offers his life if he finds the answer.", "wr": [["Theft of a horse; serve the queen for a year", "Wrong crime and sentence."], ["Murder of a knight; fight a dragon alone", "Wrong."], ["Insulting the queen; marry her lady-in-waiting", "Wrong."]]}, {"t": "q", "ch": "4", "q": "The answer that saves his life:", "right": "Sovereignty over their husbands", "x": "Mastery over husbands and lovers, taught to him by the old woman.", "wr": [["Riches, rich clothing, and honor", "One of the wrong answers he collects."], ["Flattery and attention from men", "Another wrong answer he hears."], ["Freedom to remarry as often as they like", "Not the answer."]]}, {"t": "q", "ch": "4", "q": "How does the Tale end?", "right": "He lets her choose; she becomes fair and true", "x": "Giving her mastery earns him a wife both fair and good, then the Wife prays for meek husbands.", "wr": [["He chooses beauty, and she leaves him at dawn", "He doesn't choose."], ["He chooses faithfulness, and she stays old", "He gives the choice to her."], ["The queen dissolves the marriage the next day", "Invented."]]}, {"t": "m", "ch": "4", "title": "Match each Wife of Bath image or person to its meaning.", "p": [{"p": "Jankin", "a": "Her fifth husband, a former Oxford clerk with a book of wicked wives", "x": "The fight over his book ends with him giving her control and burning it."}, {"p": "The candle and lantern", "a": "A husband loses nothing if she shares herself", "x": "A man who won't let another light a candle from his lantern loses no light."}, {"p": "Venus and Mars", "a": "Gave her lust and boldness at birth", "x": "She credits Venus for desire and Mars for sturdy hardiness."}, {"p": "\"Who painted the lion?\"", "a": "If women wrote the books, men would look wicked", "x": "Books slander women because clerks wrote them."}, {"p": "The queen", "a": "Spares the knight if he learns what women most desire", "x": "At her ladies' request she gives him a year and a day to find the answer."}, {"p": "The old wife", "a": "Teaches the knight the answer, then offers him a choice", "x": "She gets mastery when he lets her choose, and becomes fair and true."}], "bank": ["Her fifth husband, a former Oxford clerk with a book of wicked wives", "A husband loses nothing if she shares herself", "Gave her lust and boldness at birth", "If women wrote the books, men would look wicked", "Spares the knight if he learns what women most desire", "Teaches the knight the answer, then offers him a choice", "Her first husband, who made lamps"]}, {"t": "q", "ch": "5", "q": "\"Hwæt! We Gardena in geardagum\" is", "right": "Old English, the opening of Beowulf", "x": "The letter æ and the word Hwæt mark Old English; the narrator calls attention to the Spear-Danes.", "wr": [["Middle English, the opening of the Wife of Bath's Prologue", "Middle English is readable; this isn't."], ["A modern translation of Sir Gawain", "It's the original language, not a translation."], ["Middle English, Sir Gawain's opening", "Gawain opens with the siege of Troy."]]}, {"t": "q", "ch": "5", "q": "\"It is always better / to avenge dear ones than to indulge in mourning\" (Heaney) is spoken by", "right": "Beowulf to Hrothgar after Aeschere's death", "x": "He comforts the grieving king before diving into the mere.", "wr": [["Hrothgar to Beowulf, before he goes home", "Hrothgar's farewell speech is about pride."], ["Wiglaf to the ten warriors who deserted", "Wiglaf condemns their cowardice."], ["Wealhtheow to Beowulf at the feast", "She asks him to be kind to her sons."]]}, {"t": "q", "ch": "5", "q": "\"For the body which is bound within this green belt ... will be safe against anyone who seeks to strike him\" (Armitage)", "right": "The lady, offering Gawain the girdle", "x": "She says the girdle protects its wearer; he accepts and hides it from Bertilak.", "wr": [["The Green Knight at the Green Chapel", "He explains the nick, not the belt's power."], ["Gawain to Arthur's court", "He calls it a symbol of sin."], ["Bertilak proposing the exchange-of-winnings game", "Bertilak never mentions the belt then."]]}, {"t": "q", "ch": "5", "q": "\"The third time, though, you strayed, / and felt my blade therefore\" (Armitage)", "right": "The Green Knight, explaining the nick", "x": "The third day Gawain hid the girdle, so the third swing nicks him.", "wr": [["Bertilak returning from the third day's fox hunt", "He hunts the fox; this is about the blade."], ["Arthur at the start of the beheading game", "Too early in the story."], ["Gawain confessing to a priest at the castle", "Gawain doesn't say this."]]}, {"t": "q", "ch": "5", "q": "\"Experience, though no authority / Were in this world, is right enough for me\"", "right": "Middle English: the Wife opening her Prologue", "x": "Chaucer's couplets; the Wife addresses the pilgrims about the woe in marriage.", "wr": [["Old English: the Beowulf narrator", "Old English would be unreadable."], ["Modern translation: Gawain at Camelot", "Not Gawain."], ["Middle English: the old wife in her bedroom speech", "She lectures on gentillesse, later in the Tale."]]}, {"t": "q", "ch": "5", "q": "\"Women desire to have sovereignty / As well over their husband as their love\"", "right": "The knight answering the queen's court", "x": "This answer saves his life, near the middle of the Tale.", "wr": [["The Wife describing her fifth husband, Jankin", "She claims sovereignty but these words are the knight's."], ["Morgan le Fay instructing Bertilak at Hautdesert", "Not Gawain."], ["The old wife at the very end", "She speaks of maistry, but these exact words are the knight's."]]}];const L="ABCDEFGH";let I=[],ans={},done=false,tid=null;
function sh(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function build(){I=RAW.map(o=>{if(o.t=='q'){const ch=sh([[o.right,null],...o.wr]);return{t:'q',ch:o.ch,q:o.q,x:o.x,c:ch.map(z=>z[0]),w:ch.map(z=>z[1]),a:ch.findIndex(z=>z[0]===o.right)}}
const bank=sh(o.bank);return{t:'m',ch:o.ch,title:o.title,bank,p:sh(o.p).map(p=>({p:p.p,x:p.x,a:bank.indexOf(p.a)}))}})}
function keys(){const k=[];I.forEach((o,i)=>{if(o.t=='q')k.push([i,null]);else o.p.forEach((_,j)=>k.push([i,j]))});return k}
function total(){return keys().length}
function render(){const box=document.getElementById('qs');box.innerHTML='';let n=0;const T=total();I.forEach((o,i)=>{const d=document.createElement('div');d.className='card';d.id='q'+i;
if(o.t=='q'){n++;d.innerHTML=`<div class="qn">Question ${n} of ${T} · Part ${o.ch}</div><div></div>`;d.children[1].textContent=o.q;const w=document.createElement('div');
o.c.forEach((c,j)=>{const b=document.createElement('button');b.className='ch';b.textContent=L[j]+'. '+c;b.onclick=()=>{if(done)return;ans[i]=j;[...w.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};w.appendChild(b)});d.appendChild(w)}
else{const a=n+1;n+=o.p.length;d.innerHTML=`<div class="qn">Matching · Questions ${a}–${n} of ${T} · Part ${o.ch}</div><div><b></b></div><div class="bank"></div>`;d.querySelector('b').textContent=o.title+' Each letter is used at most once; some are not used.';
d.querySelector('.bank').innerHTML=o.bank.map((b,j)=>'<div>'+L[j]+'. '+b.replace(/</g,'&lt;')+'</div>').join('');
o.p.forEach((p,j)=>{const r=document.createElement('div');r.className='mrow';const s=document.createElement('select');s.innerHTML='<option value="">—</option>'+o.bank.map((_,k)=>`<option value="${k}">${L[k]}</option>`).join('');
s.onchange=()=>{if(done){return}ans[i+'.'+j]=s.value===''?undefined:+s.value;if(s.value==='')delete ans[i+'.'+j]};const sp=document.createElement('span');sp.textContent=(a+j)+'. '+p.p;r.appendChild(s);r.appendChild(sp);d.appendChild(r)})}
box.appendChild(d)})}
function A(i,j){return j==null?ans[i]:ans[i+'.'+j]}
function lab(o,j,k){if(k==null)return'(no answer)';return L[k]+'. '+(j==null?o.c[k]:o.bank[k])}
function grade(){let s=0;keys().forEach(([i,j])=>{const o=I[i];if(A(i,j)===(j==null?o.a:o.p[j].a))s++});return s}
function submit(){if(done)return;done=true;clearInterval(tid);const s=grade();I.forEach((o,i)=>{const d=document.getElementById('q'+i);
if(o.t=='q'){const bs=d.querySelectorAll('.ch'),k=ans[i],ok=k===o.a;d.classList.add(ok?'right':'wrong');bs[o.a].classList.add('ok');if(!ok&&k!=null)bs[k].classList.add('bad');
let msg=ok?'Correct. '+o.x:(k!=null?'Wrong. Your answer ('+lab(o,null,k)+'): '+o.w[k]+' Correct answer: '+lab(o,null,o.a)+'. '+o.x:'Wrong. Correct answer: '+lab(o,null,o.a)+'. '+o.x);
const wl=o.w.map((r,j)=>j!==o.a&&r?'\n• '+lab(o,null,j)+' — '+r:'').join('');const e=document.createElement('div');e.className='ex';e.style.whiteSpace='pre-line';e.textContent=msg+(wl?'\nWhy the other choices are wrong:'+wl:'');d.appendChild(e)}
else{let all=true;d.querySelectorAll('.mrow').forEach((r,j)=>{const p=o.p[j],k=A(i,j),ok=k===p.a;if(!ok)all=false;r.classList.add(ok?'ok':'bad');r.querySelector('select').disabled=true;
const e=document.createElement('div');e.className='ex';e.style.width='100%';e.textContent=(ok?'✓ Correct: ':'✗ '+(k==null?'No answer. ':'You chose '+lab(o,0,k)+'. ')+'Correct: ')+lab(o,0,p.a)+'. '+p.x;r.appendChild(e)});d.classList.add(all?'right':'wrong')}});
const T=total();document.getElementById('score').textContent=`Score: ${s} / ${T} (${Math.round(100*s/T)}%)`;document.getElementById('res').hidden=false;document.getElementById('sub').hidden=true;window.scrollTo(0,0)}
document.getElementById('sub').onclick=()=>{const n=total()-Object.keys(ans).length;if(n&&!confirm(n+' unanswered. Submit anyway?'))return;submit()};
function wrongText(){let n=0;const out=[];I.forEach((o,i)=>{if(o.t=='q'){n++;if(ans[i]!==o.a)out.push(`Q${n}: ${o.q}\nMy answer: ${lab(o,null,ans[i])}\nCorrect: ${lab(o,null,o.a)}\nPart ${o.ch}`)}else o.p.forEach((p,j)=>{n++;const k=A(i,j);if(k!==p.a)out.push(`Q${n} (matching): ${p.p}\nMy answer: ${lab(o,0,k)}\nCorrect: ${lab(o,0,p.a)}\nPart ${o.ch}`)})});return out.join('\n\n')||'No wrong answers!'}
document.getElementById('copy').onclick=()=>{const t=wrongText();const m=document.getElementById('msg');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent='Copied.',()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();m.textContent='Copied.'})};
document.getElementById('retake').onclick=()=>{ans={};done=false;clearInterval(tid);document.getElementById('timer').textContent='';document.getElementById('tbtn').hidden=false;document.getElementById('res').hidden=true;document.getElementById('sub').hidden=false;document.getElementById('msg').textContent='';build();render();window.scrollTo(0,0)};
document.getElementById('tbtn').onclick=e=>{e.target.hidden=true;let t=3600;const el=document.getElementById('timer');const f=()=>{el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t--<=0){clearInterval(tid);alert('Time is up!');submit()}};f();tid=setInterval(f,1000)};
build();render();
</script></body></html>
