<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS-201 Unit 1 Practice Exam Round 4</title>
<style>:root{--bg:#111418;--panel:#1a1f27;--panel2:#222935;--line:#2c3441;--text:#e6e9ef;--muted:#9aa4b2;--accent:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 80px}.top{position:sticky;top:0;background:var(--bg);padding:12px 0;display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:18px;margin:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}.btn.p{background:#1d4ed8;border-color:#2563eb}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}.qn{color:var(--muted);font-size:13px}
.ch{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px}
.tf{display:flex;gap:8px}.tf .ch{text-align:center}.ch.sel{border-color:var(--accent);background:#1e3a5f}.ch.ok{border-color:#22c55e;background:rgba(34,197,94,.18)}.ch.bad{border-color:#ef4444;background:rgba(239,68,68,.18)}
.card.right{border-color:#22c55e}.card.wrong{border-color:#ef4444}.ex{margin-top:8px;color:var(--muted);font-size:14px}#score{font-size:20px;font-weight:600}#timer{font-variant-numeric:tabular-nums}.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}</style></head>
<body><div class="wrap"><div class="top"><h1>HIS-201 Unit 1 Practice — Round 4</h1><div><span id="timer"></span> <button class="btn" id="tbtn">Start 60:00 timer</button></div></div>
<div id="res" class="card" hidden><div id="score"></div><div class="ex">Tip: Before picking "All these answers are correct," confirm every choice.</div><div class="row"><button class="btn" id="copy">Copy my wrong answers</button><button class="btn" id="retake">Retake</button></div><div id="msg" class="ex"></div></div>
<div id="qs"></div><div class="row"><button class="btn p" id="sub">Submit</button></div><p class="ex"><a style="color:var(--accent)" href="../">Back to flashcards</a></p></div>
<script>const Q=[{"q": "Under its new royal charter of 1691, Massachusetts:", "c": ["Combined with Plymouth and Maine into one royal colony", "Had religious toleration imposed on the Puritan colony", "Based voting on property instead of church membership", "All these answers are correct"], "a": 3, "x": "All three: the 1691 charter did each. Note PROPERTY replaced church membership.", "ch": 4}, {"q": "When William and Mary dismantled the Dominion of New England, the colony that regained its old charter was:", "c": ["Massachusetts, together with Plymouth and Maine", "Connecticut, together with Rhode Island", "Pennsylvania, together with New Jersey", "All these answers are correct"], "a": 1, "x": "Connecticut and Rhode Island regained old charters; Massachusetts got a NEW charter in 1691.", "ch": 4}, {"q": "T/F: The 1691 charter made Massachusetts a royal colony with a Crown-appointed governor.", "c": ["True", "False"], "a": 0, "x": "True: one royal colony with a Crown-appointed governor.", "ch": 4}, {"q": "Long before the 1691 charter, Massachusetts Bay in 1631 expanded freemanship to include:", "c": ["Every adult male church member in the colony", "Every adult male property owner in the colony", "Every stockholder of the Massachusetts Bay Company", "Every adult male who signed the Mayflower Compact"], "a": 0, "x": "1631: freemanship went to every adult male CHURCH MEMBER. 1691 later switched the vote basis to property.", "ch": 4}, {"q": "Unlike a Spanish widow such as 'Soledad,' an English widow such as 'Constance' kept:", "c": ["Her full dowry and at least half the marital property", "Her full dowry but none of the marital property", "Her paraphernalia and lifetime control of one-third", "Nothing at all unless her husband left a written will"], "a": 2, "x": "Constance had no claim on her dowry; she kept paraphernalia, inherited land, and control of one-third for life. Soledad got full dowry plus at least half.", "ch": 5}, {"q": "T/F: Because French law came from the same Roman sources as Spanish law, women in New France had protections similar to those in New Spain's borderlands.", "c": ["True", "False"], "a": 0, "x": "True: the book says exactly this.", "ch": 5}, {"q": "Under Spanish law, a married woman such as 'Soledad' could:", "c": ["Buy and sell land in her own name", "Keep legal control of her personal property", "Represent herself in a court of law", "All these answers are correct"], "a": 3, "x": "All three apply to Soledad; Constance surrendered her dowry and personal property at marriage.", "ch": 5}, {"q": "In 1636, minister Thomas Hooker led part of his Cambridge congregation to found:", "c": ["Rhode Island, after he fled the Bay in winter", "Connecticut, with lenient membership standards", "New Haven, with stricter membership standards", "Plymouth, alongside the Separatist Pilgrims"], "a": 1, "x": "Hooker founded Connecticut, more liberal, opposing limiting the vote to church members.", "ch": 4}, {"q": "Roger Williams, after fleeing deportation from Massachusetts Bay, founded in 1636:", "c": ["Salem, the Bay colony's first advance post", "New Haven, later joined to Connecticut", "Providence, later part of Rhode Island", "Patuxet, renamed Plymouth by the Pilgrims"], "a": 2, "x": "Williams founded Providence (later Rhode Island).", "ch": 4}, {"q": "Begun in 1638 by strict Congregationalists who found Massachusetts too liberal, this colony stayed separate until 1662:", "c": ["Maine", "Rhode Island", "New Haven", "Plymouth"], "a": 2, "x": "New Haven, which joined Connecticut in 1662.", "ch": 4}, {"q": "Lacking any royal charter, Plymouth's settlers governed themselves through:", "c": ["The Mayflower Compact, signed aboard ship", "A royal charter, like Massachusetts Bay's", "A proprietary grant to William Bradford", "Fundamental Constitutions by John Locke"], "a": 0, "x": "The Mayflower Compact: governor and assistants elected annually by adult males.", "ch": 4}, {"q": "Which pairing of colony and proprietors is correctly matched?", "c": ["Pennsylvania: Berkeley and Carteret, who sold to Quakers", "New York: Shaftesbury and Locke, who wrote a constitution", "Carolina: the Duke of York, who conquered the Dutch", "Maryland: the Catholic Calverts, who tolerated Christians"], "a": 3, "x": "Maryland = Calverts. Berkeley/Carteret = New Jersey; Shaftesbury/Locke = Carolina; Duke of York = New York.", "ch": 3}, {"q": "The Fundamental Constitutions, providing a hereditary Council of Lords and an elected Parliament, were written for:", "c": ["Carolina", "Virginia", "New Jersey", "Maryland"], "a": 0, "x": "Locke helped Shaftesbury write them for Carolina.", "ch": 3}, {"q": "Offering land, religious freedom, and an assembly for a small quitrent, then sold to Quaker investors, this colony was:", "c": ["Pennsylvania", "New Jersey", "New York", "Maryland"], "a": 1, "x": "New Jersey (Berkeley and Carteret), split into East and West Jersey and sold to Quakers.", "ch": 4}, {"q": "In July 1689, John Coode's Protestant rebels overthrew the proprietary government of:", "c": ["Virginia, where Bacon had burned Jamestown", "Carolina, nearly destroyed by the Yamasees", "Maryland, ruled by the Catholic Calverts", "New York, recently taken from the Dutch"], "a": 2, "x": "Maryland; England revoked the Calverts' charter until 1715.", "ch": 3}, {"q": "T/F: Georgia's trustees gave each assisted settler passage, 100 acres, and two enslaved laborers.", "c": ["True", "False"], "a": 1, "x": "False: passage, 50 acres, tools, and a year of supplies.", "ch": 3}, {"q": "Spain's Crown claimed a 'royal fifth' of the:", "c": ["Furs traded along New France's St. Lawrence", "Tobacco shipped from Virginia's plantations", "Sugar milled on Barbados's plantations", "Silver extracted in Spanish America's mines"], "a": 3, "x": "One-fifth of the silver extracted in Spanish America.", "ch": 2}, {"q": "Spain's lasting colony of New Mexico was founded in 1598 by:", "c": ["Juan de O\u00f1ate, removed by royal officials in 1606", "Pop\u00e9, a Tewa leader whipped during the 1670s", "Pedro de Villasur, lieutenant governor in 1720", "James Moore, who raided Florida missions in 1702"], "a": 0, "x": "O\u00f1ate founded New Mexico in 1598; removed in 1606.", "ch": 3}, {"q": "The first permanent French colony in North America was:", "c": ["Quebec, founded by Champlain in 1608", "Port Royal in Acadia, founded in 1605", "Montreal, founded by Cartier in 1535", "Trois-Rivi\u00e8res, founded by Jesuits in 1630"], "a": 1, "x": "Port Royal (1605); Quebec came three years later (1608).", "ch": 4}, {"q": "T/F: After the Glorious Revolution, Massachusetts regained its old charter, as did Connecticut and Rhode Island.", "c": ["True", "False"], "a": 1, "x": "False: only Connecticut and Rhode Island regained old charters; Massachusetts got a new one in 1691.", "ch": 4}, {"q": "The first representative assembly in England's American colonies met in 1619 as:", "c": ["Massachusetts's General Court of freemen", "Plymouth's assembly under the Compact", "Maryland's assembly under the Calverts", "Virginia's elected House of Burgesses"], "a": 3, "x": "Virginia's House of Burgesses, 1619.", "ch": 3}],L="ABCD";let ans={},done=false,tid=null;
function render(){const box=document.getElementById('qs');box.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='card';d.id='q'+i;
d.innerHTML=`<div class="qn">Question ${i+1} of ${Q.length}</div><div>${q.q}</div>`;const w=document.createElement('div');if(q.c.length==2)w.className='tf';
q.c.forEach((c,j)=>{const b=document.createElement('button');b.className='ch';b.textContent=(q.c.length==2?'':L[j]+'. ')+c;b.onclick=()=>{if(done)return;ans[i]=j;[...w.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};w.appendChild(b)});
d.appendChild(w);box.appendChild(d)})}
function lab(q,j){return j==null?'(no answer)':(q.c.length==2?'':L[j]+'. ')+q.c[j]}
function submit(){if(done)return;done=true;clearInterval(tid);let s=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i),bs=d.querySelectorAll('.ch'),ok=ans[i]===q.a;if(ok)s++;
d.classList.add(ok?'right':'wrong');bs[q.a].classList.add('ok');if(!ok&&ans[i]!=null)bs[ans[i]].classList.add('bad');
const e=document.createElement('div');e.className='ex';e.textContent=(ok?'Correct. ':'Wrong. Correct answer: '+lab(q,q.a)+'. ')+q.x+' (Ch. '+q.ch+')';d.appendChild(e)});
document.getElementById('score').textContent=`Score: ${s} / ${Q.length} (${Math.round(100*s/Q.length)}%)`;const r=document.getElementById('res');r.hidden=false;document.getElementById('sub').hidden=true;window.scrollTo(0,0)}
document.getElementById('sub').onclick=()=>{const n=Q.length-Object.keys(ans).length;if(n&&!confirm(n+' unanswered. Submit anyway?'))return;submit()};
document.getElementById('copy').onclick=()=>{const t=Q.map((q,i)=>ans[i]===q.a?null:`Q${i+1}: ${q.q}\nMy answer: ${lab(q,ans[i])}\nCorrect: ${lab(q,q.a)}\nChapter ${q.ch}`).filter(Boolean).join('\n\n')||'No wrong answers!';
const m=document.getElementById('msg');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent='Copied.',()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();m.textContent='Copied.'})};
document.getElementById('retake').onclick=()=>{ans={};done=false;clearInterval(tid);document.getElementById('timer').textContent='';document.getElementById('tbtn').hidden=false;document.getElementById('res').hidden=true;document.getElementById('sub').hidden=false;document.getElementById('msg').textContent='';render();window.scrollTo(0,0)};
document.getElementById('tbtn').onclick=e=>{e.target.hidden=true;let t=3600;const el=document.getElementById('timer');const f=()=>{el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t--<=0){clearInterval(tid);alert('Time is up!');submit()}};f();tid=setInterval(f,1000)};
render();</script></body></html>
