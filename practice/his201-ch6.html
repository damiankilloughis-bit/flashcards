<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS-201 Ch. 6 Practice</title>
<style>:root{--bg:#111418;--panel:#1a1f27;--panel2:#222935;--line:#2c3441;--text:#e6e9ef;--muted:#9aa4b2;--accent:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 80px}.top{position:sticky;top:0;background:var(--bg);padding:12px 0;display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:18px;margin:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}.btn.p{background:#1d4ed8;border-color:#2563eb}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}.qn{color:var(--muted);font-size:13px}
.ch{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px}
.tf{display:flex;gap:8px}.tf .ch{text-align:center}.ch.sel{border-color:var(--accent);background:#1e3a5f}.ch.ok{border-color:#22c55e;background:rgba(34,197,94,.18)}.ch.bad{border-color:#ef4444;background:rgba(239,68,68,.18)}
.card.right{border-color:#22c55e}.card.wrong{border-color:#ef4444}.ex{margin-top:8px;color:var(--muted);font-size:14px}#score{font-size:20px;font-weight:600}#timer{font-variant-numeric:tabular-nums}.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}</style></head>
<body><div class="wrap"><div class="top"><h1>HIS-201 Ch. 6 Practice</h1><div><span id="timer"></span> <button class="btn" id="tbtn">Start 60:00 timer</button></div></div>
<div id="res" class="card" hidden><div id="score"></div><div class="row"><button class="btn" id="copy">Copy my wrong answers</button><button class="btn" id="retake">Retake</button></div><div id="msg" class="ex"></div></div>
<div id="qs"></div><div class="row"><button class="btn p" id="sub">Submit</button></div><p class="ex"><a style="color:var(--accent)" href="../">Back to flashcards</a></p></div>
<script>const Q=[{"q":"Which of the following individuals' actions touched off the events in the Ohio Country that led to the outbreak of the Seven Years' War?","c":["George Washington.","General Edward Braddock.","Daniel Lienard de Beaujeau.","Royal Governor Robert Dinwiddie."],"a":0,"ch":6,"x":"Washington's 1754 ambush of Jumonville and surrender at Fort Necessity sparked the war [p.117]. Braddock's defeat came later in 1755 [p.118]; notes don't credit Beaujeu or Dinwiddie as the spark."},{"q":"The skirmish between British troops and colonial militia that became known as the “shot heard round the world” occurred at ____________________?","c":["Breed’s Hill.","Boston Common.","Philadelphia.","Lexington."],"a":3,"ch":6,"x":"On Lexington Green, April 19, 1775, an unknown shot set off volleys and 8 Americans died [p.137]. Breed's Hill is a later battle; Boston Common and Philadelphia weren't the opening fight."},{"q":"Which of the following was NOT among British “new measures” after the end of the Seven Years’ War?","c":["a new, lowered tax—more effectively enforced—on imports of foreign molasses","a new, higher tax—more effectively enforced—on imports of British goods like glass and tea","a tax—never effectively enforced—on official documents and legal transactions","a ban on American settlement west of the Appalachians"],"a":1,"ch":6,"x":"Glass/tea duties were Townshend Acts (1767), not Grenville's 1763–65 measures [p.129]. A=Sugar Act [p.125]; C=Stamp Act [pp.125,128]; D=Proclamation of 1763 [p.125]."},{"q":"The British monarch on the throne during the events leading up to the American Revolution was","c":["George I.","Henry VIII.","Louis XIV.","George III."],"a":3,"ch":6,"x":"George III swapped ministers (Grenville, Rockingham, Pitt) during the crisis [p.128]. George I was earlier; Henry VIII Tudor; Louis XIV was French."},{"q":"Which of the following is NOT an example of how the colonies were beginning to seize authority a year before the Declaration of Independence, during early 1775?","c":["The Association functioned effectively.","Some citizens took the court system into their own hands.","Provincial congresses were emerging as virtual revolutionary governments.","Many colonial leaders increasingly issued explicit calls for full independence."],"a":3,"ch":6,"x":"In 1774–75 Congress stayed loyal to George III; the big independence push came with Common Sense in Jan 1776 [pp.134–35,138]. A, B, and C did happen [pp.135–36]."},{"q":"The British theory of virtual representation argued that the colonials were represented in Parliament.","c":["True","False"],"a":0,"ch":6,"x":"Virtual representation said each MP spoke for the whole empire, so colonists counted as represented without voting [pp.128–29]. Colonists wanted actual representation instead."},{"q":"Which of the following is true of the Tea Act of 1773?","c":["It raised the price of tea that Americans imported from Britain.","It gave the East India company a monopoly on the American tea trade.","It made it illegal to consume tea in Massachusetts.","It cracked down on illegal smuggling of tea in the British colonies."],"a":1,"ch":6,"x":"The Tea Act bailed out the East India Company with a monopoly on American tea sales [p.133]. Direct sales made tea cheaper, not pricier; drinking tea wasn't banned; the goal was bailout, not a smuggling crackdown."},{"q":"Townshend was determined to curb the power of the American assemblies. To set a bold example, he singled out for punishment the New York legislature, which refused to comply with the","c":["Townshend Acts.","Quartering Act.","Stamp Act.","Sugar Act."],"a":1,"ch":6,"x":"In 1767 Townshend suspended the NY assembly for refusing the Quartering Act [p.129; table p.136]. Stamp Act was already repealed; Sugar Act wasn't the NY issue."},{"q":"When they learned of the Coercive Acts of 1774, many Americans concluded that a plot to enslave the colonies was being implemented by the king’s ministers, but not Parliament or George III.","c":["True","False"],"a":1,"ch":6,"x":"False: notes say the conspiracy fear \"now included Parliament and even George III\" [p.134], so \"ministers only\" is too narrow."},{"q":"Who organized a combined uprising of the western tribes in the aftermath of the French defeat?","c":["French fur traders who remained in the area","the Iroquois","Pontic","Cadillac"],"a":2,"ch":6,"x":"\"Pontic\" means Pontiac, the Ottawa chief who led the 1763 pan-tribal uprising that took every British fort west of Detroit [p.123]. French traders, Iroquois, and Cadillac aren't named as leaders."},{"q":"The First Continental Congress met in September 1774. Which of the following WAS NOT one of the three goals they intended to accomplish?","c":["They met to draw up the statement declaring th colonists' independence from Britain.","They met to develop a plan for unified colonial resistance to Britain.","They met to define the specific American complaints the Americans had with Britain.","They met to determine their constitutional relationship with the mother country."],"a":0,"ch":6,"x":"Congress stayed loyal to George III and wanted a return to pre-1763; independence wasn't a goal [pp.134–35]. B, C, and D were the real aims."},{"q":"Which of the following was NOT argued by Thomas Paine in Common Sense?","c":["Parliament had deliberately and wickedly brought about all of America’s misfortunes.","Britain had dealt with the colonies out of self-interest rather than affection.","Monarchy was a foolish and dangerous form of government.","Nature had destined America for independence."],"a":0,"ch":6,"x":"Paine attacked the king and monarchy (\"Royal Brute of Britain\"), not Parliament as the main villain [p.138]. B, C, and D fit his case."},{"q":"The Seven Years’ War pitted Britain against France in a struggle to control what region of North America?","c":["Louisiana","Lower Canada","Ohio country","Northwest Territories"],"a":2,"ch":6,"x":"The war grew out of rivalry over the Ohio Country [pp.116–18]. Louisiana appears only in the peace deals; Canada was fought later; \"Northwest Territories\" isn't the notes' term."},{"q":"The first blood of an American soldier was shed by British troops at ____________ in April 1775.","c":["Concord, Massachusetts","Lexington, Massachusetts","New York City, New York","Philadelphia, Pennsylvania"],"a":1,"ch":6,"x":"First volleys and 8 American deaths came on Lexington Green before the British marched on to Concord [p.137]."},{"q":"In early July, 1755 a column of British troops and colonial militia was ambushed and routed as they attempted to march on Fort Dusquesne at the forks of the Ohio River. The battle took place along the ________________ River and resulted in the death of the British commander, General ________________.","c":["Allegheny; Washington","Monogehela; Braddock","Susquehanna; Amhearst","Mississippi; Wolfe"],"a":1,"ch":6,"x":"Braddock was mortally wounded in the 1755 ambush [p.118]; \"Monogehela\" = Monongahela. Washington survived; Amherst wasn't killed then; Wolfe died at Quebec in 1759."},{"q":"After the Seven Years’ War, Britain kept several thousand troops in the colonies for all of the following reasons EXCEPT","c":["to enforce the Proclamation of 1763 by providing protection to colonials settling west of the Appalachians.","to ensure the submission of French Canadians and Spanish Floridians.","to monitor relations between Indians and colonials.","to encourage American acceptance of Grenville’s new measures."],"a":0,"ch":6,"x":"The Proclamation stopped westward settlement, so troops weren't there to protect settlers going west [p.125]. B, C, and D fit holding gains, Indian relations, and backing Grenville's taxes [pp.123,125]."},{"q":"Whose defeat at the makeshift defensive structure known as Fort Necessity began the Seven Years’ War?","c":["George Washington.","George Grenville.","James Wolfe.","The Iroquois League."],"a":0,"ch":6,"x":"Washington built hasty Fort Necessity and was forced to surrender in 1754 [p.117]. Grenville was a postwar minister; Wolfe won Quebec; the Iroquois weren't the defeated force."},{"q":"Whose defeat at Quebec in French Canada effectively ended the Seven Years’ War on the continent of North America?","c":["The Spanish Navy.","The French Navy.","The marquis de Montcalm.","James Wolfe."],"a":2,"ch":6,"x":"Montcalm lost on the Plains of Abraham (1759); Montreal fell 1760, ending the N. American war [p.121]. Wolfe won (and died); navies didn't lose Quebec."},{"q":"In reaction to the failings of the East India Company, the government of Great Britain did which of the following?","c":["Closed the harbors in Boston, Philadelphia and Charles Town.","Passed the Quebec Act, which opened up the Canadian market to British tea merchants.","Passed the Tea Act, which gave the company a monopoly over the tea business in North America.","Declared the company insolvent and opened its ownership to bidding by colonial merchants."],"a":2,"ch":6,"x":"The 1773 Tea Act rescued the bankrupt company with a monopoly [p.133]. Only Boston's harbor was closed later; Quebec Act wasn't about tea; Britain bailed the company out, didn't sell it."},{"q":"When they learned of the Coercive Acts of 1774, many Americans concluded that a plot to enslave the colonies was being implemented by","c":["the king’s ministers, but not Parliament or George III.","Parliament, but not the king’s ministers or George III.","George III, but not the king’s ministers or Parliament.","the king’s ministers and Parliament, but not George III."],"a":3,"ch":6,"x":"By 1774 fear reached Parliament while Congress still declared loyalty to George III [pp.134–35]. Caveat: notes also say the fear \"even\" included George III [p.134]; D is the best match among the options."}];L="ABCD";let ans={},done=false,tid=null;
function render(){const box=document.getElementById('qs');box.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='card';d.id='q'+i;
d.innerHTML=`<div class="qn">Question ${i+1} of ${Q.length}</div><div>${q.q}</div>`;const w=document.createElement('div');if(q.c.length==2)w.className='tf';
q.c.forEach((c,j)=>{const b=document.createElement('button');b.className='ch';b.textContent=(q.c.length==2?'':L[j]+'. ')+c;b.onclick=()=>{if(done)return;ans[i]=j;[...w.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};w.appendChild(b)});
d.appendChild(w);box.appendChild(d)})}
function lab(q,j){return j==null?'(no answer)':(q.c.length==2?'':L[j]+'. ')+q.c[j]}
function submit(){if(done)return;done=true;clearInterval(tid);let s=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i),bs=d.querySelectorAll('.ch'),ok=ans[i]===q.a;if(ok)s++;
d.classList.add(ok?'right':'wrong');bs[q.a].classList.add('ok');if(!ok&&ans[i]!=null)bs[ans[i]].classList.add('bad');
const e=document.createElement('div');e.className='ex';e.textContent=(ok?'Correct. ':'Wrong. Correct answer: '+lab(q,q.a)+'. ')+q.x+' (Ch. '+q.ch+')';d.appendChild(e)});
document.getElementById('score').textContent=`Score: ${s} / ${Q.length} (${Math.round(100*s/Q.length)}%)`;const r=document.getElementById('res');r.hidden=false;document.getElementById('sub').hidden=true;window.scrollTo(0,0)}
document.getElementById('sub').onclick=()=>{const n=Q.length-Object.keys(ans).length;if(n&&!confirm(n+' unanswered. Submit anyway?'))return;submit()};
document.getElementById('copy').onclick=()=>{const t=Q.map((q,i)=>ans[i]===q.a?null:`Q${i+1}: ${q.q}\nMy answer: ${lab(q,ans[i])}\nCorrect: ${lab(q,q.a)}\nChapter ${q.ch}`).filter(Boolean).join('\n\n')||'No wrong answers!';
const m=document.getElementById('msg');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent='Copied.',()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();m.textContent='Copied.'})};
document.getElementById('retake').onclick=()=>{ans={};done=false;clearInterval(tid);document.getElementById('timer').textContent='';document.getElementById('tbtn').hidden=false;document.getElementById('res').hidden=true;document.getElementById('sub').hidden=false;document.getElementById('msg').textContent='';render();window.scrollTo(0,0)};
document.getElementById('tbtn').onclick=e=>{e.target.hidden=true;let t=3600;const el=document.getElementById('timer');const f=()=>{el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t--<=0){clearInterval(tid);alert('Time is up!');submit()}};f();tid=setInterval(f,1000)};
render();</script></body></html>
