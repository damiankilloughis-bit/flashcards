<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENG-205 Midterm Practice (Parts 1-5)</title>
<style>:root{--bg:#111418;--panel:#1a1f27;--panel2:#222935;--line:#2c3441;--text:#e6e9ef;--muted:#9aa4b2;--accent:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 80px}.top{position:sticky;top:0;background:var(--bg);padding:12px 0;display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:18px;margin:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}.btn.p{background:#1d4ed8;border-color:#2563eb}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}.qn{color:var(--muted);font-size:13px}
.ch{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px}
.tf{display:flex;gap:8px}.tf .ch{text-align:center}.ch.sel{border-color:var(--accent);background:#1e3a5f}.ch.ok{border-color:#22c55e;background:rgba(34,197,94,.18)}.ch.bad{border-color:#ef4444;background:rgba(239,68,68,.18)}
.card.right{border-color:#22c55e}.card.wrong{border-color:#ef4444}.ex{margin-top:8px;color:var(--muted);font-size:14px}#score{font-size:20px;font-weight:600}#timer{font-variant-numeric:tabular-nums}.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}</style></head>
<body><div class="wrap"><div class="top"><h1>ENG-205 Midterm Practice (Parts 1-5)</h1><div><span id="timer"></span> <button class="btn" id="tbtn">Start 60:00 timer</button></div></div>
<div id="res" class="card" hidden><div id="score"></div><div class="row"><button class="btn" id="copy">Copy my wrong answers</button><button class="btn" id="retake">Retake</button></div><div id="msg" class="ex"></div></div>
<div id="qs"></div><div class="row"><button class="btn p" id="sub">Submit</button></div></div><script>const Q=[{"q": "The word \"medieval\" comes from Latin words meaning:", "c": ["\"knightly age\" (miles + aevum)", "\"middle age\" (medium + aevum)", "\"dark time\" (tenebrae + tempus)", "\"old kingdom\" (vetus + regnum)"], "a": 1, "ch": "1", "x": "Medium = middle, aevum = age: the age between Rome's fall and the Renaissance.", "w": ["Miles means soldier; it isn't the root of medieval.", null, "Made-up roots; \"Dark Ages\" is a different, later label.", "Not the source; medieval literally means middle age."]}, {"q": "Who settled England after the Romans withdrew?", "c": ["The Vikings from Denmark", "Angles, Saxons, Jutes", "The French-speaking Normans under William", "Celtic tribes crossing over from Ireland"], "a": 1, "ch": "1", "x": "Germanic tribes who arrived around 450 and founded their own kingdoms, speaking Old English.", "w": ["Viking raids came centuries after the Anglo-Saxon settlement.", null, "They came much later, in 1066.", "The Celts were the native Britons the Germanic tribes displaced."]}, {"q": "Which lists the language periods the Norton describes, in order?", "c": ["Latin, Old English, Early Modern English", "Old English, Middle English, Anglo-Norman French", "Old English, Anglo-Norman, Middle English", "Middle English, Old English, Anglo-Norman French"], "a": 2, "ch": "1", "x": "Old English until 1066, then French under the Normans, then Middle English, which displaced French by the late 1300s.", "w": ["Latin wasn't one of the spoken-English periods, and Early Modern comes after the Middle Ages.", "French came between Old and Middle English, after 1066.", null, "Out of order: Old English comes first."]}, {"q": "Which feature marks Old English poetry like Beowulf?", "c": ["Free verse with no pattern at all", "Fourteen-line sonnets in iambic pentameter", "Alliteration and a caesura, no rhyme", "Rhymed couplets with five stresses a line"], "a": 2, "ch": "1", "x": "Old English verse ties each line together with repeated first sounds and splits it with a caesura.", "w": ["Old English verse is strongly patterned by alliteration.", "Sonnets come in the Renaissance.", null, "That's Chaucer's Middle English verse."]}, {"q": "Chaucer's Middle English poetry typically uses:", "c": ["Alliterative half-lines split by a caesura", "Rhymed couplets, five stresses a line", "Short three-line stanzas without rhyme", "Unrhymed blank verse with four stresses"], "a": 1, "ch": "1", "x": "Pairs of rhyming lines in iambic pentameter, e.g. \"lanterne / pardee\" pairs in the Wife's Prologue.", "w": ["That's Old English verse like Beowulf.", null, "Not Chaucer's form.", "Chaucer rhymes; blank verse is unrhymed."]}, {"q": "Match: Wealhtheow is", "c": ["Hrothgar's queen, who passes the mead-cup", "the Geat queen who rules after Beowulf", "Beowulf's young kinsman and loyal thane", "the warrior who taunts Beowulf about Breca"], "a": 0, "ch": "2", "x": "The gracious peace-weaving queen who serves the cup and asks Beowulf to treat her sons kindly.", "w": [null, "Not Wealhtheow; she is Danish.", "That's Wiglaf.", "That's Unferth."]}, {"q": "Match: Unferth is", "c": ["the great hall built by Hrothgar", "the warrior Grendel's mother carries off", "a Dane who mocks Beowulf, later lends Hrunting", "the young warrior who helps fight the dragon"], "a": 2, "ch": "2", "x": "He taunts Beowulf about losing the swimming match with Breca, later lends him his sword for the mere fight.", "w": ["That's Heorot.", "That's Aeschere.", null, "That's Wiglaf."]}, {"q": "Heorot is", "c": ["Beowulf's homeland of the Geats", "the dragon's barrow", "Grendel's underwater lair", "Hrothgar's mead-hall"], "a": 3, "ch": "2", "x": "The hall of feasting and gift-giving Grendel raids for twelve years.", "w": ["Beowulf is a Geat; Heorot is in Denmark.", "The dragon guards a hoard in a barrow, not Heorot.", "That's the mere.", null]}, {"q": "In the fight with Grendel, Beowulf", "c": ["beheads Grendel with a giant's sword", "tears off Grendel's arm bare-handed", "drowns Grendel in the mere", "kills Grendel with the sword Hrunting"], "a": 1, "ch": "2", "x": "He refuses weapons since Grendel uses none; the arm hangs in Heorot as a trophy.", "w": ["He beheads Grendel's corpse later, in the mere.", null, "Grendel flees, mortally wounded, to die in the mere.", "Hrunting is used later, against Grendel's mother, and fails."]}, {"q": "What happens to the weapons in the fight with Grendel's mother?", "c": ["Hrunting fails; the giant sword melts", "Hrunting kills her but is lost in the mere", "Beowulf uses only his bare hands throughout", "Naegling snaps on her skull and he uses his knife"], "a": 0, "ch": "2", "x": "Hrunting won't bite, so he uses an ancient giant's sword, whose blade melts in the monster's blood.", "w": [null, "Hrunting fails, and Beowulf returns it to Unferth.", "He wrestles, but kills her with the giant sword.", "Naegling snaps on the dragon."]}, {"q": "What does Beowulf bring back from the mere?", "c": ["Grendel's mother's head and her treasure", "a jeweled cup from the hoard", "Grendel's arm and Hrunting", "Grendel's head and the sword hilt"], "a": 3, "ch": "2", "x": "He leaves the treasure and takes only the head and the jeweled hilt to Hrothgar.", "w": ["He brings back Grendel's head, and no treasure.", "The cup is stolen from the dragon by a slave.", "The arm was taken in fight 1; Hrunting he simply returns.", null]}, {"q": "Hrothgar's advice before Beowulf goes home warns him chiefly against", "c": ["trusting the Danes again", "marrying a foreign queen", "pride", "fighting dragons in old age"], "a": 2, "ch": "2", "x": "His \"sermon\" warns that strength fades and tells Beowulf not to give way to pride but to choose eternal rewards.", "w": ["He's grateful to Beowulf and pledges friendship.", "Not part of his speech.", null, "No dragon is mentioned in his advice."]}, {"q": "What Beowulf says about glory:", "c": ["glory comes from treasure kept safe", "glory is vanity and should be shunned", "win glory before death", "glory belongs only to kings, not to their thanes"], "a": 2, "ch": "2", "x": "Since death comes to all, fame won in life is a warrior's best memorial.", "w": ["He says glory comes from deeds, not hoarding.", "That's closer to Hrothgar's warning about pride.", null, "He seeks glory as a young warrior, not a king."]}, {"q": "What starts the dragon's attacks?", "c": ["A runaway slave steals a cup", "Wiglaf kills its mate", "Beowulf raids its barrow for gold to pay his warriors", "Grendel's kin wake it for revenge"], "a": 0, "ch": "2", "x": "The thief takes the cup to win back his master's favor, and the dragon burns the Geats' land.", "w": [null, "Invented.", "Beowulf fights it only after the attacks start.", "Grendel's line has no role in the dragon story."]}, {"q": "In the final fight, who stands by Beowulf and who does not?", "c": ["Unferth stays; Wiglaf flees into the woods", "All eleven of his warriors fight beside him", "Wiglaf stays; ten others flee", "Hygelac stays; the Danes flee"], "a": 2, "ch": "2", "x": "Wiglaf remembers Beowulf's gifts and fights; the others run into the woods and are condemned.", "w": ["Unferth is a Dane from the first half; Wiglaf is the loyal one.", "Ten flee.", null, "Hygelac is long dead by then."]}, {"q": "After Beowulf's funeral, the Geats fear that", "c": ["Wiglaf will seize the treasure for himself", "Grendel's kin will rise from the mere again", "enemy tribes will now attack", "the dragon's mate will come to avenge it"], "a": 2, "ch": "2", "x": "A Geat woman's lament foretells invasion, slaughter, and slavery.", "w": ["The treasure is buried with Beowulf.", "Grendel is long dead.", null, "Invented."]}, {"q": "Which best describes the young hero vs. aging king contrast?", "c": ["Young Beowulf is cautious; old Beowulf is reckless", "Young Beowulf fights for treasure; old Beowulf rejects treasure", "Young Beowulf rules the Danes; old Beowulf serves Hygelac", "Young Beowulf seeks glory; old Beowulf must protect a people"], "a": 3, "ch": "2", "x": "His death as king leaves the Geats exposed, unlike his youthful risks.", "w": ["Both phases show courage; the issue is responsibility.", "He looks at the hoard while dying.", "Reversed and wrong.", null]}, {"q": "The terms of the Green Knight's challenge:", "c": ["fight him on foot until one knight yields", "one blow now, one back in a year and a day", "trade winnings for three days", "answer his riddle within a year and a day"], "a": 1, "ch": "3", "x": "Any knight may swing the axe once, then must seek the Green Chapel a year later to receive the blow back.", "w": ["It's a blow-for-blow game.", null, "That's Bertilak's game at the castle.", "That's closer to the Wife of Bath's Tale."]}, {"q": "Match: Gringolet is", "c": ["Bertilak's castle, Hautdesert", "Gawain's horse", "the Green Knight's axe", "the star painted on Gawain's shield"], "a": 1, "ch": "3", "x": "Gawain rides Gringolet through the wilderness to find the Green Chapel.", "w": ["The castle is Hautdesert.", null, "The axe isn't named Gringolet.", "That's the pentangle."]}, {"q": "The pentangle on Gawain's shield stands for", "c": ["the five years his quest is meant to last", "his love for the lady of the castle", "his perfect virtue, in \"five fives\"", "Morgan le Fay's magic"], "a": 2, "ch": "3", "x": "An endless five-pointed knot of five virtues, five senses, five fingers, five wounds, five joys.", "w": ["His quest is about one year.", "He hasn't met her yet.", null, "It's a Christian symbol of Gawain's virtue."]}, {"q": "The exchange-of-winnings game requires that", "c": ["the two men trade each day's winnings", "Gawain give the lady his girdle", "Gawain ride out and win a prize in the hunt", "they exchange blows with the green axe at the chapel"], "a": 0, "ch": "3", "x": "Bertilak hunts, Gawain stays in the castle, and they swap their gains every evening for three days.", "w": [null, "She gives him the girdle.", "Gawain stays home in bed.", "That's the beheading game."]}, {"q": "Which is the correct order of Bertilak's hunts?", "c": ["deer, boar, fox", "deer, fox, boar", "boar, deer, fox", "fox, boar, deer"], "a": 0, "ch": "3", "x": "Day one deer, day two boar, day three fox, matching Gawain's growing danger in the bedroom.", "w": [null, "Fox is last.", "Deer comes first.", "Reversed."]}, {"q": "In the bedroom scenes Gawain is caught between", "c": ["courtesy to the lady and loyalty to his host", "his duty to his horse and duty to his armor", "his love of Arthur and his love of Guinevere", "fear of the Green Knight and of Morgan"], "a": 0, "ch": "3", "x": "Refusing her is rude, but accepting betrays Bertilak and his own chastity.", "w": [null, "Not an obligation conflict.", "Not the bedroom conflict.", "He doesn't know of Morgan yet."]}, {"q": "The lady says the green girdle will", "c": ["make Gawain irresistible to women", "keep its wearer from being slain", "cure any wound", "make its wearer invisible to enemies"], "a": 1, "ch": "3", "x": "She claims whoever wears it can't be slain, so Gawain keeps it to survive the return blow.", "w": ["Not claimed.", null, "Not claimed.", "Not claimed."]}, {"q": "Why are there three swings at the Green Chapel?", "c": ["Gawain asked for three chances at the chapel", "Morgan cursed the axe so it would miss twice", "They match the three days of exchanges", "The knight missed twice by accident"], "a": 2, "ch": "3", "x": "Two harmless swings for the two days Gawain traded honestly; a nick for the day he hid the girdle.", "w": ["He asked for one blow.", "The three swings are Bertilak's judgment.", null, "The misses were deliberate."]}, {"q": "Match: Morgan the Goddess (Morgan le Fay) is", "c": ["the Green Knight's daughter at Hautdesert", "Gawain's aunt, who planned the test", "Arthur's queen", "Bertilak's wife who tempts Gawain"], "a": 1, "ch": "3", "x": "Arthur's half-sister, taught by Merlin, who sent the Green Knight to test the Round Table and scare Guinevere.", "w": ["Invented.", null, "That's Guinevere.", "That's the lady of the castle."]}, {"q": "Match: Bertilak is", "c": ["Arthur's half-brother", "the knight who first takes the challenge", "the host who is the Green Knight", "Gawain's horse"], "a": 2, "ch": "3", "x": "Bertilak de Hautdesert reveals he was the Green Knight in disguise.", "w": ["Morgan is Arthur's half-sister.", "Gawain does.", null, "That's Gringolet."]}, {"q": "How does Gawain feel about his failure?", "c": ["Ashamed of his cowardice and covetousness", "Indifferent, since it was only a game", "Angry at the lady and will seek revenge", "Proud, because he survived the blow"], "a": 0, "ch": "3", "x": "He vows to wear the girdle forever as a badge of his sin.", "w": [null, "He takes it very seriously.", "He does blame women briefly but doesn't seek revenge; his main feeling is shame.", "He's angry and ashamed."]}, {"q": "How does Arthur's court respond?", "c": ["They all wear green sashes to honor him", "They banish Gawain from the Round Table", "They burn the girdle in the great hall", "They punish him for breaking his word"], "a": 0, "ch": "3", "x": "The court treats the girdle as a sign of honor, not shame.", "w": [null, "They welcome him home.", "They adopt it.", "No punishment."]}, {"q": "The Wife opens her Prologue by setting what against the authority of learned clerks?", "c": ["the law of the king's courts", "the teachings of Scripture", "her own experience", "the Pardoner's preaching on the road"], "a": 2, "ch": "4", "x": "\"Experience, though no authority / Were in this world, is right enough for me.\"", "w": ["Not her argument.", "She uses scripture when it helps, but opens with experience.", null, "He interrupts later; not her opening claim."]}, {"q": "What happens over Jankin's book?", "c": ["She reads it and comes to agree with him", "After a fight he gives her control and burns it", "He sells it to pay off her old debts", "They write a new book of good wives together"], "a": 1, "ch": "4", "x": "The fight ends with Jankin handing her \"the bridle\" of house and land.", "w": ["She hates the book.", null, "Invented.", "Invented."]}, {"q": "The candle-and-lantern image means", "c": ["women should be kept in the dark by husbands", "knowledge comes from books, like light", "her first husband made lamps and lanterns", "a husband loses nothing if she shares herself"], "a": 3, "ch": "4", "x": "A man who won't let another light a candle at his lantern loses no light, so he's a miser to complain.", "w": ["Opposite point.", "She opposes book authority.", "Literal misreading.", null]}, {"q": "The Wife credits Venus and Mars with", "c": ["her love of going on pilgrimages abroad", "her five marriages and five deaths", "her wealth and her deafness", "her lust and her boldness"], "a": 3, "ch": "4", "x": "Venus gave her desire; Mars gave her sturdy hardiness, from her birth stars.", "w": ["Not the claim.", "Not what the planets give.", "Her deafness comes from Jankin's blow.", null]}, {"q": "\"Who painted the lion?\" means", "c": ["women writers would show men as wicked", "Jankin painted pictures of her", "women are as fierce as lions", "artists flatter the kings who pay them"], "a": 0, "ch": "4", "x": "Books show women badly because clerks wrote them; the lion would paint a different picture.", "w": [null, "Literal misreading.", "She compares herself to a lioness elsewhere, but this line is about who writes stories.", "Not her point."]}, {"q": "Why are the fairies gone from the land in the Tale?", "c": ["Friars bless every place now", "King Arthur banished them from his kingdom", "The knight's crime drove them away", "A great plague killed them off"], "a": 0, "ch": "4", "x": "The \"limitours\" walk where elves used to, a jab at the friars.", "w": [null, "Not in the Tale.", "Unrelated.", "Not in the Tale."]}, {"q": "The knight's crime and the queen's sentence:", "c": ["Murder of a knight; fight a dragon alone", "Rape; learn what women most desire", "Theft of a horse; serve the queen for a year", "Insulting the queen; marry her lady-in-waiting"], "a": 1, "ch": "4", "x": "Arthur sentences him to death; the queen offers his life if he finds the answer.", "w": ["Wrong.", null, "Wrong crime and sentence.", "Wrong."]}, {"q": "The answer that saves his life:", "c": ["Sovereignty over their husbands", "Riches, rich clothing, and honor", "Flattery and attention from men", "Freedom to remarry as often as they like"], "a": 0, "ch": "4", "x": "Mastery over husbands and lovers, taught to him by the old woman.", "w": [null, "One of the wrong answers he collects.", "Another wrong answer he hears.", "Not the answer."]}, {"q": "How does the Tale end?", "c": ["He chooses beauty, and she leaves him at dawn", "He chooses faithfulness, and she stays old", "The queen dissolves the marriage the next day", "He lets her choose; she becomes fair and true"], "a": 3, "ch": "4", "x": "Giving her mastery earns him a wife both fair and good, then the Wife prays for meek husbands.", "w": ["He doesn't choose.", "He gives the choice to her.", "Invented.", null]}, {"q": "\"Hwæt! We Gardena in geardagum\" is", "c": ["Middle English, Sir Gawain's opening", "A modern translation of Sir Gawain", "Old English, the opening of Beowulf", "Middle English, the opening of the Wife of Bath's Prologue"], "a": 2, "ch": "5", "x": "The letter æ and the word Hwæt mark Old English; the narrator calls attention to the Spear-Danes.", "w": ["Gawain opens with the siege of Troy.", "It's the original language, not a translation.", null, "Middle English is readable; this isn't."]}, {"q": "\"It is always better / to avenge dear ones than to indulge in mourning\" (Heaney) is spoken by", "c": ["Hrothgar to Beowulf, before he goes home", "Wiglaf to the ten warriors who deserted", "Beowulf to Hrothgar after Aeschere's death", "Wealhtheow to Beowulf at the feast"], "a": 2, "ch": "5", "x": "He comforts the grieving king before diving into the mere.", "w": ["Hrothgar's farewell speech is about pride.", "Wiglaf condemns their cowardice.", null, "She asks him to be kind to her sons."]}, {"q": "\"For the body which is bound within this green belt ... will be safe against anyone who seeks to strike him\" (Armitage)", "c": ["The lady, offering Gawain the girdle", "Gawain to Arthur's court", "Bertilak proposing the exchange-of-winnings game", "The Green Knight at the Green Chapel"], "a": 0, "ch": "5", "x": "She says the girdle protects its wearer; he accepts and hides it from Bertilak.", "w": [null, "He calls it a symbol of sin.", "Bertilak never mentions the belt then.", "He explains the nick, not the belt's power."]}, {"q": "\"The third time, though, you strayed, / and felt my blade therefore\" (Armitage)", "c": ["The Green Knight, explaining the nick", "Bertilak returning from the third day's fox hunt", "Gawain confessing to a priest at the castle", "Arthur at the start of the beheading game"], "a": 0, "ch": "5", "x": "The third day Gawain hid the girdle, so the third swing nicks him.", "w": [null, "He hunts the fox; this is about the blade.", "Gawain doesn't say this.", "Too early in the story."]}, {"q": "\"Experience, though no authority / Were in this world, is right enough for me\"", "c": ["Old English: the Beowulf narrator", "Middle English: the old wife in her bedroom speech", "Modern translation: Gawain at Camelot", "Middle English: the Wife opening her Prologue"], "a": 3, "ch": "5", "x": "Chaucer's couplets; the Wife addresses the pilgrims about the woe in marriage.", "w": ["Old English would be unreadable.", "She lectures on gentillesse, later in the Tale.", "Not Gawain.", null]}, {"q": "\"Women desire to have sovereignty / As well over their husband as their love\"", "c": ["The Wife describing her fifth husband, Jankin", "The knight answering the queen's court", "Morgan le Fay instructing Bertilak at Hautdesert", "The old wife at the very end"], "a": 1, "ch": "5", "x": "This answer saves his life, near the middle of the Tale.", "w": ["She claims sovereignty but these words are the knight's.", null, "Not Gawain.", "She speaks of maistry, but these exact words are the knight's."]}];L="ABCD";let ans={},done=false,tid=null;
function render(){const box=document.getElementById('qs');box.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='card';d.id='q'+i;
d.innerHTML=`<div class="qn">Question ${i+1} of ${Q.length}</div><div>${q.q}</div>`;const w=document.createElement('div');if(q.c.length==2)w.className='tf';
q.c.forEach((c,j)=>{const b=document.createElement('button');b.className='ch';b.textContent=(q.c.length==2?'':L[j]+'. ')+c;b.onclick=()=>{if(done)return;ans[i]=j;[...w.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};w.appendChild(b)});
d.appendChild(w);box.appendChild(d)})}
function lab(q,j){return j==null?'(no answer)':(q.c.length==2?'':L[j]+'. ')+q.c[j]}
function submit(){if(done)return;done=true;clearInterval(tid);let s=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i),bs=d.querySelectorAll('.ch'),ok=ans[i]===q.a;if(ok)s++;
d.classList.add(ok?'right':'wrong');bs[q.a].classList.add('ok');if(!ok&&ans[i]!=null)bs[ans[i]].classList.add('bad');
const e=document.createElement('div');e.className='ex';
let msg;
if(ok){msg='Correct. '+q.x+' (Part '+q.ch+')';}
else if(ans[i]!=null){msg='Wrong. Your answer ('+lab(q,ans[i])+'): '+q.w[ans[i]]+' Correct answer: '+lab(q,q.a)+'. '+q.x+' (Part '+q.ch+')';}
else{msg='Wrong. Correct answer: '+lab(q,q.a)+'. '+q.x+' (Part '+q.ch+')';}
const wl=q.w.map((r,j)=>j!==q.a&&r?'\n• '+lab(q,j)+' — '+r:'').join('');e.style.whiteSpace='pre-line';e.textContent=msg+(wl?'\nWhy the other choices are wrong:'+wl:'');d.appendChild(e)});
document.getElementById('score').textContent=`Score: ${s} / ${Q.length} (${Math.round(100*s/Q.length)}%)`;const r=document.getElementById('res');r.hidden=false;document.getElementById('sub').hidden=true;window.scrollTo(0,0)}
document.getElementById('sub').onclick=()=>{const n=Q.length-Object.keys(ans).length;if(n&&!confirm(n+' unanswered. Submit anyway?'))return;submit()};
document.getElementById('copy').onclick=()=>{const t=Q.map((q,i)=>ans[i]===q.a?null:`Q${i+1}: ${q.q}\nMy answer: ${lab(q,ans[i])}\nCorrect: ${lab(q,q.a)}\nPart ${q.ch}`).filter(Boolean).join('\n\n')||'No wrong answers!';
const m=document.getElementById('msg');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent='Copied.',()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();m.textContent='Copied.'})};
document.getElementById('retake').onclick=()=>{ans={};done=false;clearInterval(tid);document.getElementById('timer').textContent='';document.getElementById('tbtn').hidden=false;document.getElementById('res').hidden=true;document.getElementById('sub').hidden=false;document.getElementById('msg').textContent='';render();window.scrollTo(0,0)};
document.getElementById('tbtn').onclick=e=>{e.target.hidden=true;let t=3600;const el=document.getElementById('timer');const f=()=>{el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t--<=0){clearInterval(tid);alert('Time is up!');submit()}};f();tid=setInterval(f,1000)};
render();</script></body></html>
