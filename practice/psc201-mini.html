<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PSC-201 Mini Quiz</title>
<style>:root{--bg:#111418;--panel:#1a1f27;--panel2:#222935;--line:#2c3441;--text:#e6e9ef;--muted:#9aa4b2;--accent:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 80px}.top{position:sticky;top:0;background:var(--bg);padding:12px 0;display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:18px;margin:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}.btn.p{background:#1d4ed8;border-color:#2563eb}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}.qn{color:var(--muted);font-size:13px}
.ch{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px}
.tf{display:flex;gap:8px}.tf .ch{text-align:center}.ch.sel{border-color:var(--accent);background:#1e3a5f}.ch.ok{border-color:#22c55e;background:rgba(34,197,94,.18)}.ch.bad{border-color:#ef4444;background:rgba(239,68,68,.18)}
.card.right{border-color:#22c55e}.card.wrong{border-color:#ef4444}.ex{margin-top:8px;color:var(--muted);font-size:14px}#score{font-size:20px;font-weight:600}#timer{font-variant-numeric:tabular-nums}.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}textarea{width:100%;min-height:90px;margin-top:8px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font:15px system-ui}.tag{font-size:12px;color:var(--muted)}.mk .btn{padding:6px 10px;font-size:14px}.mk .btn.on{background:#1d4ed8}ul.kp{margin:6px 0;padding-left:20px}</style></head>
<body><div class="wrap"><div class="top"><h1>PSC-201 Mini Quiz</h1><div><span id="timer"></span> <button class="btn" id="tbtn">Start 15:00 timer</button></div></div>
<div id="res" class="card" hidden><div id="score"></div><div class="row"><button class="btn" id="copy">Copy my wrong answers</button><button class="btn" id="retake">Retake (new order)</button></div><div id="msg" class="ex"></div></div>
<p class="ex">10 questions: true/false, multiple choice, and written. Order shuffles on each load. Written: type your answer, tap <b>Check my answer</b>, then self-mark Got it (1) / Partial (½) / Missed (0).</p>
<div id="qs"></div><div class="row"><button class="btn p" id="sub">Submit</button></div><p class="ex"><a style="color:var(--accent)" href="../">Back to flashcards</a></p></div>
<script>const Q_=0;const QB=[{"t": "tf", "ch": 2, "q": "Under the Three-Fifths Compromise, three-fifths of the enslaved population was counted for both House representation and direct taxation.", "c": ["True", "False"], "a": 0, "x": "True: it counted 3/5 of the enslaved population for House seats and direct taxes. The South wanted them counted for seats, the North for taxes, and the deal increased slaveholding states' power.", "w": ["", "False is wrong: the compromise applied the 3/5 count to both representation and direct taxation."]}, {"t": "tf", "ch": 5, "q": "The Nineteenth Amendment (1920) banned poll taxes in federal elections.", "c": ["True", "False"], "a": 1, "x": "False: the 19th bars denying the vote on the basis of sex. The 24th Amendment (1964) banned poll taxes in federal elections, and Harper v. Virginia (1966) extended that to state elections.", "w": ["True is wrong: poll taxes in federal elections were banned by the 24th Amendment, not the 19th (sex).", ""]}, {"t": "tf", "ch": 13, "q": "Federal judges serve \"during good Behaviour,\" which in practice means life tenure with removal only by impeachment.", "c": ["True", "False"], "a": 0, "x": "True: Article III tenure 'during good Behaviour' = in practice for life; removal only by impeachment, which protects judicial independence.", "w": ["", "False is wrong: there's no fixed term; only impeachment removes a federal judge."]}, {"t": "mc", "ch": 4, "q": "Gideon v. Wainwright (1963) held that:", "c": ["States must give counsel to indigent felony defendants", "Illegally obtained evidence is excluded in state trials", "Police must warn suspects before custodial interrogation", "The Bill of Rights originally did not bind the states"], "a": 0, "x": "Gideon applied the 6th Amendment right to counsel to the states through the 14th: states must appoint lawyers for indigent defendants charged with felonies.", "w": ["", "That's Mapp v. Ohio (1961), the exclusionary rule.", "That's Miranda v. Arizona (1966).", "That's Barron v. Baltimore (1833)."]}, {"t": "mc", "ch": 3, "q": "A federal grant for a broad policy area, with loose conditions that give states more flexibility, is a:", "c": ["Categorical grant", "Block grant", "Federal coasting license", "Unfunded mandate"], "a": 1, "x": "Block grants cover broad policy areas with looser conditions (though 'creeping categorization' can add strings); Reagan consolidated grants into block grants in 1981.", "w": ["Categorical grants are narrow, with strict rules and little discretion.", "", "That was the federal license in Gibbons v. Ogden, not a grant.", "A mandate is a required obligation (stick), not a grant of money (carrot)."]}, {"t": "mc", "ch": 1, "q": "C. Wright Mills's The Power Elite argued that:", "c": ["The market decides what is produced and who gets goods", "Policy comes from ongoing compromises among many actors", "A small business, military, and political elite holds power", "Power is spread among many groups that compete and bargain"], "a": 2, "x": "Elite theory: a small elite (business, military, political) holds power, top-down.", "w": ["That's capitalism (Adam Smith), an economic idea, not a theory of political power.", "That's the tradeoffs perspective.", "", "That's pluralism (Robert Dahl, Who Governs?)."]}, {"t": "mc", "ch": 13, "q": "If the chief justice votes with the dissent, who assigns the majority opinion?", "c": ["The most junior justice in the majority", "The most senior justice in the majority", "The solicitor general, who argued the case", "The chief justice, as head of the Court"], "a": 1, "x": "The chief assigns only when in the majority; otherwise the most senior justice in the majority assigns it.", "w": ["Seniority, not juniority, decides the assignment.", "", "The SG is an advocate for the U.S., not a member of the Court.", "The chief assigns only when the chief is in the majority."]}, {"t": "w", "ch": 4, "q": "Explain the difference between procedural and substantive due process. Give one course example of substantive due process.", "m": "Procedural due process asks whether government followed constitutionally adequate procedures (notice, a hearing, fair process) before depriving a person of life, liberty, or property. Substantive due process protects certain fundamental liberties themselves from government interference, not just the procedures. Example: Griswold v. Connecticut (1965) protected marital privacy (contraception); Lawrence (2003) and Obergefell (2015) also rest on due-process liberty. It differs from selective incorporation, which applies listed Bill of Rights rights; substantive DP can protect unlisted liberties.", "k": ["Procedural = fair procedures (notice/hearing) before deprivation", "Substantive = protects fundamental liberties themselves", "A correct example (Griswold, Lawrence, or Obergefell)", "Notes it can protect unlisted rights (≠ selective incorporation)"]}, {"t": "w", "ch": 2, "q": "What was Madison's argument in Federalist No. 51 about why the structure of government would prevent abuse of power?", "m": "Madison argued power is divided twice: between national and state governments (federalism) and among separate branches within the national government. Each branch's officeholders have 'personal motives' (ambition) to defend their own powers and resist encroachment by the others, so 'ambition counteracting ambition' lets the structure itself check abuse. The parts of government keep each other in their proper places.", "k": ["Double division: federalism + separation of powers", "Officeholders' ambition / 'personal motives' to resist encroachment", "Ambition counteracting ambition → the structure checks itself", "Links to checks and balances as protection against tyranny"]}, {"t": "w", "ch": 5, "q": "How did Little Rock (1957) illustrate both federalism conflict and the limits of judicial implementation?", "m": "After Brown v. Board (1954), Arkansas state officials resisted integrating schools, setting the state against federal court orders and federal supremacy (federalism conflict). Because courts lack the 'sword or purse,' they couldn't enforce their own ruling; President Eisenhower federalized the Arkansas National Guard and sent federal troops to escort nine Black students. It shows court rulings depend on other branches for implementation.", "k": ["Context: Brown (1954) and Arkansas's resistance", "Federalism: state vs. federal court orders/supremacy", "Eisenhower federalized the Guard and sent troops; nine Black students", "Lesson: courts depend on other branches to implement (no sword or purse)"]}];const L="ABCD";let Q,ans,mark,done,tid;
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function lab(q,j){return j==null?'(no answer)':(q.c.length==2?'':L[j]+'. ')+q.c[j]}
function init(){Q=shuf(QB);ans={};mark={};done=false;render()}
function render(){const box=document.getElementById('qs');box.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='card';d.id='q'+i;
const ty=q.t=='tf'?'True/False':q.t=='mc'?'Multiple choice':'Written';
d.innerHTML=`<div class="qn">Question ${i+1} of ${Q.length} · ${ty} · Ch. ${q.ch}</div><div>${esc(q.q)}</div>`;
if(q.t=='w'){const ta=document.createElement('textarea');ta.placeholder='Type your answer…';ta.oninput=()=>ans[i]=ta.value;d.appendChild(ta);
const cb=document.createElement('button');cb.className='btn';cb.textContent='Check my answer';cb.style.marginTop='8px';const rv=document.createElement('div');rv.className='ex';rv.hidden=true;
rv.innerHTML='<b>Model answer:</b> '+esc(q.m)+'<div style="margin-top:6px"><b>Key points (self-grade):</b></div><ul class="kp">'+q.k.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul><div class="row mk"></div>';
const mk=rv.querySelector('.mk');[['Got it',1],['Partial',0.5],['Missed',0]].forEach(([t,v])=>{const b=document.createElement('button');b.className='btn';b.textContent=t;b.onclick=()=>{if(done)return;mark[i]=v;[...mk.children].forEach(x=>x.classList.remove('on'));b.classList.add('on')};mk.appendChild(b)});
cb.onclick=()=>{rv.hidden=false;cb.hidden=true};d.appendChild(cb);d.appendChild(rv)}
else{const w=document.createElement('div');if(q.c.length==2)w.className='tf';
q.c.forEach((c,j)=>{const b=document.createElement('button');b.className='ch';b.textContent=(q.c.length==2?'':L[j]+'. ')+c;b.onclick=()=>{if(done)return;ans[i]=j;[...w.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};w.appendChild(b)});d.appendChild(w)}
box.appendChild(d)})}
function submit(){if(done)return;done=true;clearInterval(tid);let s=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i);const e=document.createElement('div');e.className='ex';e.style.whiteSpace='pre-line';
if(q.t=='w'){const v=mark[i]??0;s+=v;d.classList.add(v==1?'right':'wrong');d.querySelector('div.ex')&&(d.querySelector('div.ex').hidden=false);d.querySelectorAll('button').forEach(b=>{if(b.textContent=='Check my answer')b.hidden=true});
e.textContent=(mark[i]==null?'Not self-marked (counted 0).':'Self-marked: '+(v==1?'Got it':v==0.5?'Partial':'Missed')+'.')+' (Ch. '+q.ch+')';d.appendChild(e);return}
const bs=d.querySelectorAll('.ch'),ok=ans[i]===q.a;if(ok)s++;d.classList.add(ok?'right':'wrong');bs[q.a].classList.add('ok');if(!ok&&ans[i]!=null)bs[ans[i]].classList.add('bad');
let msg=ok?'Correct. '+q.x:(ans[i]!=null?'Wrong. Your answer ('+lab(q,ans[i])+'): '+q.w[ans[i]]+' Correct answer: '+lab(q,q.a)+'. '+q.x:'Wrong. Correct answer: '+lab(q,q.a)+'. '+q.x);
const wl=q.w.map((r,j)=>j!==q.a&&r?'\n• '+lab(q,j)+' — '+r:'').join('');e.textContent=msg+' (Ch. '+q.ch+')'+(wl?'\nWhy the other choices are wrong:'+wl:'');d.appendChild(e)});
document.getElementById('score').textContent=`Score: ${s} / ${Q.length} (${Math.round(100*s/Q.length)}%)`;document.getElementById('res').hidden=false;document.getElementById('sub').hidden=true;window.scrollTo(0,0)}
document.getElementById('sub').onclick=()=>{const n=Q.filter((q,i)=>q.t=='w'?mark[i]==null:ans[i]==null).length;if(n&&!confirm(n+' unanswered/unmarked. Submit anyway?'))return;submit()};
document.getElementById('copy').onclick=()=>{const t=Q.map((q,i)=>{if(q.t=='w')return (mark[i]??0)==1?null:`Q${i+1} (written): ${q.q}\nMy answer: ${ans[i]||'(blank)'}\nKey points: ${q.k.join('; ')}\nChapter ${q.ch}`;return ans[i]===q.a?null:`Q${i+1}: ${q.q}\nMy answer: ${lab(q,ans[i])}\nCorrect: ${lab(q,q.a)}\nChapter ${q.ch}`}).filter(Boolean).join('\n\n')||'No wrong answers!';
const m=document.getElementById('msg');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent='Copied.',()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();m.textContent='Copied.'})};
document.getElementById('retake').onclick=()=>{clearInterval(tid);document.getElementById('timer').textContent='';document.getElementById('tbtn').hidden=false;document.getElementById('res').hidden=true;document.getElementById('sub').hidden=false;document.getElementById('msg').textContent='';init();window.scrollTo(0,0)};
document.getElementById('tbtn').onclick=e=>{e.target.hidden=true;let t=900;const el=document.getElementById('timer');const f=()=>{el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t--<=0){clearInterval(tid);alert('Time is up!');submit()}};f();tid=setInterval(f,1000)};
init();</script></body></html>
