<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS-201 Unit 1 Practice Exam</title>
<style>:root{--bg:#111418;--panel:#1a1f27;--panel2:#222935;--line:#2c3441;--text:#e6e9ef;--muted:#9aa4b2;--accent:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 80px}.top{position:sticky;top:0;background:var(--bg);padding:12px 0;display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:18px;margin:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}.btn.p{background:#1d4ed8;border-color:#2563eb}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}.qn{color:var(--muted);font-size:13px}
.ch{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px}
.tf{display:flex;gap:8px}.tf .ch{text-align:center}.ch.sel{border-color:var(--accent);background:#1e3a5f}.ch.ok{border-color:#22c55e;background:rgba(34,197,94,.18)}.ch.bad{border-color:#ef4444;background:rgba(239,68,68,.18)}
.card.right{border-color:#22c55e}.card.wrong{border-color:#ef4444}.ex{margin-top:8px;color:var(--muted);font-size:14px}#score{font-size:20px;font-weight:600}#timer{font-variant-numeric:tabular-nums}.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}</style></head>
<body><div class="wrap"><div class="top"><h1>HIS-201 Unit 1 Practice</h1><div><span id="timer"></span> <button class="btn" id="tbtn">Start 60:00 timer</button></div></div>
<div id="res" class="card" hidden><div id="score"></div><div class="row"><button class="btn" id="copy">Copy my wrong answers</button><button class="btn" id="retake">Retake</button></div><div id="msg" class="ex"></div></div>
<div id="qs"></div><div class="row"><button class="btn p" id="sub">Submit</button></div><p class="ex"><a style="color:var(--accent)" href="../">Back to flashcards</a></p></div>
<script>const Q=[{"q": "The text links Native Americans' lack of immunity to Eurasian diseases mainly to:", "c": ["Their relatively few domesticated animals", "The Americas' north-south axis", "The extinction of megafauna", "Their small, scattered villages"], "a": 0, "x": "Eurasian diseases came from domesticated animals; Native peoples had few.", "ch": 1}, {"q": "T/F: Hohokam irrigation along Arizona's Salt and Gila Rivers was the most extensive in precontact North America.", "c": ["True", "False"], "a": 0, "x": "The book calls it the most extensive in precontact North America.", "ch": 1}, {"q": "Which society was patrilineal, with property and prestige descending through men?", "c": ["Iroquois", "Natchez", "Algonquins", "Hurons"], "a": 2, "x": "Natchez and Iroquois could be matrilineal; Algonquins were patrilineal.", "ch": 1}, {"q": "Athapaskan speakers later called Apaches and Navajos arrived in the Southwest:", "c": ["About 10,000 years ago with the first farmers", "One or two centuries before European contact", "With Coronado's expedition", "After the Pueblo Revolt"], "a": 1, "x": "They arrived one or two centuries before contact.", "ch": 1}, {"q": "All of the following were Martin Luther's teachings EXCEPT:", "c": ["Justification by faith alone", "Only Scripture is infallible", "Every person should interpret the Bible", "Christians should reshape society and government by biblical law"], "a": 3, "x": "Reshaping society by biblical law was Calvin's emphasis; Luther favored the existing order.", "ch": 2}, {"q": "Who received England's first colonial charter in 1578, covering land not held by a Christian prince?", "c": ["Walter Raleigh", "Richard Hakluyt", "Humphrey Gilbert", "John White"], "a": 2, "x": "Elizabeth granted Gilbert the first charter in 1578.", "ch": 2}, {"q": "Columbus's second voyage became colonization for all of the following reasons EXCEPT:", "c": ["The Taino had West African-style military power", "Rumors of gold", "A vulnerable Taino population", "A climate healthier than West Africa's"], "a": 0, "x": "Taino chiefdoms LACKED West African-style military power.", "ch": 2}, {"q": "T/F: Portuguese experts rejected Columbus's plan because they correctly judged his globe too large.", "c": ["True", "False"], "a": 1, "x": "They judged his globe too SMALL.", "ch": 2}, {"q": "The Black Death killed roughly what share of Europe's population?", "c": ["One-tenth", "One-half", "Three-quarters", "One-quarter"], "a": 3, "x": "It killed one-quarter; some cities lost 70%.", "ch": 2}, {"q": "The text makes the point that Cort\u00e9s conquered Tenochtitl\u00e1n chiefly by:", "c": ["Outnumbering the Aztecs with Spanish soldiers", "Exploiting Aztec enemies with a huge Native army while smallpox struck", "Winning Moctezuma's voluntary surrender", "Allying with the Incas"], "a": 1, "x": "Cort\u00e9s recruited a large Native army; smallpox killed millions in 1520\u20131521.", "ch": 2}, {"q": "Spain's two-stage policy in Florida was to:", "c": ["First win or threaten Native alliances, then place Franciscan missions and soldiers among allied villages", "First send Jesuit traders, then build sugar plantations", "First import settlers, then buy Indian land", "First build presidios in Texas, then move east"], "a": 0, "x": "The book's two-stage Florida policy.", "ch": 3}, {"q": "Which combination best explains the Chesapeake crisis of the 1660s?", "c": ["The Navigation Acts raised tobacco prices and drew new servants", "The Yamasee War destroyed Virginia's plantations", "Tobacco overproduction lowered prices while freed servants became tenants or moved into Indian country", "Pueblo raids cut Virginia's trade"], "a": 2, "x": "Overproduction lowered prices; freed servants became tenants or moved west.", "ch": 3}, {"q": "T/F: In the 1620s Chesapeake, women outnumbered men six to one.", "c": ["True", "False"], "a": 1, "x": "MEN outnumbered women six to one.", "ch": 3}, {"q": "Which colonist found Virginia tobacco profitable for overseas sale?", "c": ["John Smith", "John Rolfe", "Nathaniel Bacon", "William Berkeley"], "a": 1, "x": "John Rolfe found tobacco profitable.", "ch": 3}, {"q": "Late-17th-century Virginia slave laws did all of the following EXCEPT:", "c": ["Make manumission harder", "Bar free Black settlers from having white servants", "Outlaw interracial marriage", "Grant slaves the right to jury trials"], "a": 3, "x": "The laws restricted, never expanded, slaves' rights.", "ch": 3}, {"q": "Who received Georgia's 1732 charter with fellow trustees?", "c": ["Lord Baltimore", "William Penn", "James Oglethorpe", "Nathaniel Bacon"], "a": 2, "x": "George II granted Oglethorpe and trustees a 21-year charter.", "ch": 3}, {"q": "Who called Massachusetts Bay a 'city upon a hill'?", "c": ["John Winthrop", "William Penn", "Roger Williams", "Anne Hutchinson"], "a": 0, "x": "John Winthrop.", "ch": 4}, {"q": "Unlike Spain, which relied on Franciscans, France sent which order to missionize its Indian allies?", "c": ["Franciscans", "Quakers", "Separatists", "Jesuits"], "a": 3, "x": "France engaged Jesuits, fired by the Counter-Reformation.", "ch": 4}, {"q": "T/F: Separatists wanted to reform the Church of England from within.", "c": ["True", "False"], "a": 1, "x": "Separatists GAVE UP on the Church of England.", "ch": 4}, {"q": "The Iroquois fought the Beaver Wars mainly to gain:", "c": ["Dutch farmland along the Hudson", "New hunting grounds and captives to replenish their numbers", "Control of French missions", "Access to Spanish silver"], "a": 1, "x": "Iroquois sought new hunting grounds and captives.", "ch": 4}, {"q": "Early New England's stability came from all of the following EXCEPT:", "c": ["A large enslaved labor force", "Migration in family groups", "Long lifespans", "Shared Puritanism and self-government"], "a": 0, "x": "Family groups, long lives and shared faith; slaves were not key.", "ch": 4}, {"q": "Which was a feature of James II's Dominion of New England?", "c": ["It guaranteed freedom of worship", "It created Pennsylvania", "It abolished the northern colonial assemblies", "It repealed the Navigation Acts"], "a": 2, "x": "James abolished all northern colonial assemblies.", "ch": 4}, {"q": "The 17th-century witchcraft trials took place in:", "c": ["Plymouth", "Salem", "Jamestown", "Charles Town"], "a": 1, "x": "Salem, Massachusetts.", "ch": 4}, {"q": "Spain colonized California, its last major North American project, mainly out of fear of:", "c": ["The French in Louisiana", "English traders", "Comanche raids", "Russians moving south from Alaska"], "a": 3, "x": "California was sparked by fear of Russians.", "ch": 5}, {"q": "Unlike French Canada, Louisiana was:", "c": ["A colony of farm communities that grew by natural increase", "Home to about 75,000 French settlers by 1760", "Unhealthy, with few settlers and dependent on African slaves", "Free of Indian conflict"], "a": 2, "x": "Canada grew by natural increase; Louisiana was unhealthy with few settlers.", "ch": 5}, {"q": "T/F: The Great Awakening first appeared in the 1730s among Presbyterians and Anglicans.", "c": ["True", "False"], "a": 1, "x": "It began among Presbyterians and CONGREGATIONALISTS.", "ch": 5}, {"q": "The Scots-Irish were:", "c": ["Descendants of 17th-century Scots who had settled in northern Ireland", "Irish Catholics fleeing English rule", "Highland Scots recruited by Georgia", "English Puritans who moved to Ireland"], "a": 0, "x": "Book definition of Scots-Irish.", "ch": 5}, {"q": "Under Spanish law, a woman in New Spain had all of the following rights EXCEPT:", "c": ["Keeping legal control of her personal property", "Ownership of her dowry", "Inheriting equally with her brothers", "Inheriting all land before her brothers"], "a": 3, "x": "She inherited EQUALLY with brothers, not before them.", "ch": 5}, {"q": "Britain's hands-off colonial policy before 1760 is called:", "c": ["Salutary neglect", "Benign neglect", "Mercantilism", "The balanced constitution"], "a": 1, "x": "The book's term is 'benign neglect.'", "ch": 5}, {"q": "Who personified the Enlightenment yet 'looked on in admiration' at a Whitefield sermon?", "c": ["Benjamin Franklin", "Jonathan Edwards", "William Penn", "John Winthrop"], "a": 0, "x": "Franklin admired Whitefield's preaching in Philadelphia.", "ch": 5}],L="ABCD";let ans={},done=false,tid=null;
function render(){const box=document.getElementById('qs');box.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='card';d.id='q'+i;
d.innerHTML=`<div class="qn">Question ${i+1} of ${Q.length}</div><div>${q.q}</div>`;const w=document.createElement('div');if(q.c.length==2)w.className='tf';
q.c.forEach((c,j)=>{const b=document.createElement('button');b.className='ch';b.textContent=(q.c.length==2?'':L[j]+'. ')+c;b.onclick=()=>{if(done)return;ans[i]=j;[...w.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};w.appendChild(b)});
d.appendChild(w);box.appendChild(d)})}
function lab(q,j){return j==null?'(no answer)':(q.c.length==2?'':L[j]+'. ')+q.c[j]}
function submit(){if(done)return;done=true;clearInterval(tid);let s=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i),bs=d.querySelectorAll('.ch'),ok=ans[i]===q.a;if(ok)s++;
d.classList.add(ok?'right':'wrong');bs[q.a].classList.add('ok');if(!ok&&ans[i]!=null)bs[ans[i]].classList.add('bad');
const e=document.createElement('div');e.className='ex';e.textContent=(ok?'Correct. ':'Wrong. Correct answer: '+lab(q,q.a)+'. ')+q.x+' (Ch. '+q.ch+')';d.appendChild(e)});
document.getElementById('score').textContent=`Score: ${s} / ${Q.length} (${Math.round(100*s/Q.length)}%)`;const r=document.getElementById('res');r.hidden=false;document.getElementById('sub').hidden=true;window.scrollTo(0,0)}
document.getElementById('sub').onclick=()=>{const n=Q.length-Object.keys(ans).length;if(n&&!confirm(n+' unanswered. Submit anyway?'))return;submit()};
document.getElementById('copy').onclick=()=>{const t=Q.map((q,i)=>ans[i]===q.a?null:`Q${i+1}: ${q.q}\nMy answer: ${lab(q,ans[i])}\nCorrect: ${lab(q,q.a)}\nChapter ${q.ch}`).filter(Boolean).join('\n\n')||'No wrong answers!';
const m=document.getElementById('msg');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent='Copied.',()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();m.textContent='Copied.'})};
document.getElementById('retake').onclick=()=>{ans={};done=false;clearInterval(tid);document.getElementById('timer').textContent='';document.getElementById('tbtn').hidden=false;document.getElementById('res').hidden=true;document.getElementById('sub').hidden=false;document.getElementById('msg').textContent='';render();window.scrollTo(0,0)};
document.getElementById('tbtn').onclick=e=>{e.target.hidden=true;let t=3600;const el=document.getElementById('timer');const f=()=>{el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t--<=0){clearInterval(tid);alert('Time is up!');submit()}};f();tid=setInterval(f,1000)};
render();</script></body></html>
