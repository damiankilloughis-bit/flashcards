<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ENG-205 Practice — Midsummer Act 5</title>
<style>:root{--bg:#111418;--panel:#1a1f27;--panel2:#222935;--line:#2c3441;--text:#e6e9ef;--muted:#9aa4b2;--accent:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 80px}.top{position:sticky;top:0;background:var(--bg);padding:12px 0;display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:18px;margin:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}.btn.p{background:#1d4ed8;border-color:#2563eb}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}.qn{color:var(--muted);font-size:13px}
.ch{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px}
.tf{display:flex;gap:8px}.tf .ch{text-align:center}.ch.sel{border-color:var(--accent);background:#1e3a5f}.ch.ok{border-color:#22c55e;background:rgba(34,197,94,.18)}.ch.bad{border-color:#ef4444;background:rgba(239,68,68,.18)}
.card.right{border-color:#22c55e}.card.wrong{border-color:#ef4444}.ex{margin-top:8px;color:var(--muted);font-size:14px}#score{font-size:20px;font-weight:600}#timer{font-variant-numeric:tabular-nums}.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}</style></head>
<body><div class="wrap"><div class="top"><h1>ENG-205 Practice — Midsummer Act 5</h1><div><span id="timer"></span> <button class="btn" id="tbtn">Start 15:00 timer</button></div></div>
<div id="res" class="card" hidden><div id="score"></div><div class="row"><button class="btn" id="copy">Copy my wrong answers</button><button class="btn" id="retake">Retake</button></div><div id="msg" class="ex"></div></div>
<div id="qs"></div><div class="row"><button class="btn p" id="sub">Submit</button></div></div>
<script>const Q=[{"q": "Which three figures does Theseus say “are of imagination all compact” (5.1.8–10)?", "c": ["the lunatic, the lover, and the poet", "the duke, the amazon, and the fairy", "the prologue, the wall, and the moon", "the lion, the tiger, and the bear"], "a": 0, "x": "Theseus groups “the lunatic, the lover, and the poet” as people whose “shaping fantasies” apprehend more than “cool reason” comprehends.", "w": [null, "Theseus and Hippolyta are listening to the lovers’ story; he is not grouping himself with fairies, whom he doubts as “fairy toys.”", "Those are roles in the mechanicals’ play, discussed later in the scene.", "A bush supposed a bear is his example of night-time fear, not the three-figure list."]}, {"q": "According to Theseus, the poet’s pen gives “airy nothing”", "c": ["a bush supposed a bear", "a local habitation and a name", "a tedious brief scene of tragical mirth", "a fortnight of nightly revels"], "a": 1, "x": "In 5.1.17–19 he says imagination “bodies forth / The forms of things unknown,” and “the poet’s pen / Turns them to shapes, and gives to airy nothing / A local habitation and a name.”", "w": ["That is his later example of ordinary night-time fear, not what the poet’s pen does.", null, "That is how the Pyramus entertainment is billed on Philostrate’s paper.", "Theseus promises a fortnight of revels at the end of the scene, after the play."]}, {"q": "How does Hippolyta answer Theseus’s claim that the lovers’ night is only “fairy toys”?", "c": ["She agrees that “cool reason” should dismiss the whole story.", "She says the story grows to “something of great constancy.”", "She asks Philostrate to cancel every wedding entertainment.", "She insists the mechanicals invented the story to amuse the court."], "a": 1, "x": "She argues that “all the story of the night told over, / And all their minds transfigur’d so together, / More witnesseth than fancy’s images, / And grows to something of great constancy.”", "w": ["She pushes back against Theseus’s skepticism rather than agreeing with it.", null, "Philostrate is called later to offer entertainments; she does not cancel them.", "The mechanicals were not present for the lovers’ story and do not invent it."]}, {"q": "How much time does Theseus want a play or masque to “wear away” after supper?", "c": ["until the next new moon", "a fortnight", "one hour", "three hours"], "a": 3, "x": "He asks, “what masques, what dances shall we have, / To wear away this long age of three hours / Between our after-supper and bed-time?”", "w": ["The “four happy days” and “another moon” belong to Act 1’s wedding countdown, already completed.", "A fortnight is how long he later says they will “hold… this solemnity,” after midnight, not the after-supper gap.", "He names three hours, not one.", null]}, {"q": "Which entertainment does Theseus finally choose to hear?", "c": ["the battle with the Centaurs, sung to the harp", "the riot of the tipsy Bacchanals tearing the Thracian singer", "the thrice three Muses mourning for the death of Learning", "the tedious brief scene of young Pyramus and his love Thisbe"], "a": 3, "x": "He rejects the first three and is caught by “very tragical mirth.” Despite Philostrate’s warning, he says, “And we will hear it.”", "w": ["He rejects this because he has already told that story to Hippolyta “in glory of my kinsman Hercules.”", "He calls this “an old device,” played when he last came from Thebes a conqueror (the Thracian singer is Orpheus).", "He calls this “some satire keen and critical, / Not sorting with a nuptial ceremony.”", null]}, {"q": "“Very tragical mirth” and “hot ice” are best described as", "c": ["oxymorons, conjoining normally incompatible terms", "soliloquies, private speeches delivered as if the speaker were alone", "pastoral images set among shepherds", "blank verse, unrhymed iambic pentameter"], "a": 0, "x": "Theseus reads “a tedious brief scene” of “very tragical mirth,” then “Merry and tragical! tedious and brief! / That is, hot ice and wonderous strange snow.” Each pair yokes opposites, which is an oxymoron.", "w": [null, "These lines are Theseus reading and commenting, not a character alone on stage revealing private thought.", "The phrases describe the mechanicals’ mixed-genre play, not a shepherd setting.", "The device in question is the clash of terms, not the meter of the speech."]}, {"q": "Theseus agrees to hear the mechanicals’ play because, he says,", "c": ["Philostrate has already called it the wittiest play in Athens.", "never anything can be amiss when simpleness and duty tender it.", "Hippolyta has asked to see wretchedness overcharged.", "the actors are great clerks who have premeditated their welcomes."], "a": 1, "x": "Philostrate says the play is “nothing,” but Theseus answers, “I will hear that play; / For never anything can be amiss, / When simpleness and duty tender it” (5.1.88–90).", "w": ["Philostrate tries to stop the play and says there is “not one word apt, one player fitted.”", null, "Hippolyta says the opposite: she does not love to see “wretchedness o’er-charg’d.”", "Theseus later recalls great clerks who froze in greeting him; the mechanicals are “hard-handed men,” not those clerks."]}, {"q": "When Theseus says Quince “doth not stand upon points,” he means that Quince", "c": ["misuses punctuation and pauses in the wrong places", "refuses to come forward until the trumpets flourish", "will not play the part of Wall unless he has lime and hair", "insists the prologue be written in eight and six"], "a": 0, "x": "Quince’s prologue, wrongly stopped, seems to say the opposite of his courtesy. Lysander adds that he “knows not the stop,” and “it is not enough to speak, but to speak true.”", "w": [null, "A flourish of trumpets does announce him, but “points” here means punctuation, not stage cues.", "Snout, not Quince, presents Wall; “points” is not about costumes.", "“Eight and six” was Quince’s meter plan in Act 3, Scene 1, not the court’s joke here."]}, {"q": "In the mechanicals’ performance, who presents Wall, Moonshine, and Lion?", "c": ["Quince as Wall, Bottom as Moonshine, and Flute as Lion", "Snout as Wall, Starveling as Moonshine, and Snug as Lion", "Starveling as Wall, Snug as Moonshine, and Snout as Lion", "Snug as Wall, Flute as Moonshine, and Bottom as Lion"], "a": 1, "x": "Snout says, “I, one Snout by name, present a wall”; Starveling has “lanthorn, dog, and bush of thorn” as Moonshine; Snug says, “I, one Snug the joiner, am” the lion. Bottom is Pyramus and Flute is Thisbe.", "w": ["Quince is the Prologue, Bottom is Pyramus, and Flute is Thisbe.", null, "This reverses the actual casting of Wall, Moonshine, and Lion.", "Snug is Lion, Flute is Thisbe, and Bottom is Pyramus, not Lion."]}, {"q": "What happens after Thisbe says, “This is old Ninny’s tomb. Where is my love?”", "c": ["Wall refuses to open a cranny, so the lovers go home unharmed.", "Theseus stops the play and asks immediately for the epilogue.", "The lion roars, Thisbe drops her mantle and flees, and Pyramus later stabs himself.", "Oberon anoints Pyramus so that he falls in love with the lion."], "a": 2, "x": "The lion roars, Thisbe flees and drops her mantle, the lion tears it, and Pyramus, finding it “stain’d with blood,” stabs himself; Thisbe then returns and stabs herself too.", "w": ["The wall scene is already over; Wall has exited after discharging his part.", "Theseus refuses an epilogue only after both lovers have “died” and Bottom offers one.", null, "Oberon’s love-juice plot was in the woods in Acts 2–4; it does not enter the inner play."]}, {"q": "Theseus tells Hippolyta, “The best in this kind are but shadows, and the worst are no worse, if”", "c": ["simpleness and duty tender them", "the wall is down that parted their fathers", "imagination amend them", "the iron tongue of midnight hath told twelve"], "a": 2, "x": "After she calls the play “the silliest stuff that ever I heard,” he says the best plays are only shadows, “and the worst are no worse, if imagination amend them” (5.1.209–210).", "w": ["That is his earlier reason for hearing the play at all, not this reply about shadows.", "Bottom says this later, after “dying,” when he offers an epilogue or a dance.", null, "Midnight’s “iron tongue” comes after the Bergomask, when he sends the lovers to bed."]}, {"q": "After Pyramus and Thisbe “die,” what does Theseus accept from the company?", "c": ["their epilogue, so the dead players can excuse the play", "a Bergomask dance, and he tells them to let the epilogue alone", "Bottom's promised ballad called “Bottom's Dream”", "the battle with the Centaurs as a second entertainment"], "a": 1, "x": "Bottom offers “the epilogue, or to hear a Bergomask dance.” Theseus says the play “needs no excuse” because “the players are all dead,” then: “But come, your Bergomask: let your epilogue alone.”", "w": ["He expressly refuses the epilogue.", null, "Bottom planned that ballad when he woke in Act 4, Scene 1; he does not sing it here.", "Theseus had already rejected the Centaurs entertainment earlier in the scene."]}, {"q": "When the iron tongue of midnight has told twelve, Theseus says it is almost", "c": ["fairy time", "May Day", "Saint Valentine", "the vaward of the day"], "a": 0, "x": "He says, “The iron tongue of midnight hath told twelve; / Lovers, to bed; ’tis almost fairy time,” then promises to hold the solemnity a fortnight.", "w": [null, "The rite of May was already “perform’d” at the start of Act 4, Scene 1.", "In 4.1 Theseus joked that “Saint Valentine is past” when the lovers were found asleep.", "“The vaward of the day” is Theseus’s phrase in 4.1 for early morning, before the hunt."]}, {"q": "In the Cummings edition, Puck’s closing speech (“If we shadows have offended…”) comes in", "c": ["Act 4, Scene 2, after Bottom returns to Quince’s house", "the mechanicals’ prologue to Pyramus and Thisbe", "Act 5, Scene 2, after Oberon and Titania bless the three couples", "Act 3, Scene 2, when he squeezes the remedy onto Lysander’s eyes"], "a": 2, "x": "This edition lists Act 5, Scene 2 as Puck’s closing poem, with no setting. Oberon and Titania first bless the palace and the “couples three”; then Puck, alone, asks the audience to take the play as a dream.", "w": ["Act 4, Scene 2 ends with Bottom hurrying the mechanicals to the palace; there is no epilogue there.", "The bungled prologue is Quince’s, and it opens the inner play in 5.1.", null, "In 3.2 Puck recites “Jack shall have Jill,” not “If we shadows have offended.”"]}, {"q": "Puck’s last request in the play is", "c": ["that Oberon give the changeling boy back to Titania at once", "that the court ladies not be afeard of Snug the joiner", "“Give me your hands, if we be friends, / And Robin shall restore amends.”", "that Theseus agree to hear their epilogue after all"], "a": 2, "x": "After asking the audience to think they have “but slumber’d here,” he closes, “Give me your hands, if we be friends, / And Robin shall restore amends” (5.2.70–71).", "w": ["The boy has already been given to Oberon in Act 4; Puck does not ask this now.", "That reassurance is Snug’s speech as Lion in 5.1.", null, "Theseus has already refused the mechanicals’ epilogue; Puck’s speech is a different, play-wide appeal."]}];
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function reshuffle(){shuf(Q);Q.forEach(q=>{const o=shuf(q.c.map((_,i)=>i));const c=o.map(i=>q.c[i]),w=o.map(i=>q.w[i]);q.a=o.indexOf(q.a);q.c=c;q.w=w})}
reshuffle();L="ABCD";let ans={},done=false,tid=null;
function render(){const box=document.getElementById('qs');box.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='card';d.id='q'+i;
d.innerHTML=`<div class="qn">Question ${i+1} of ${Q.length}</div><div>${q.q}</div>`;const w=document.createElement('div');if(q.c.length==2)w.className='tf';
q.c.forEach((c,j)=>{const b=document.createElement('button');b.className='ch';b.textContent=(q.c.length==2?'':L[j]+'. ')+c;b.onclick=()=>{if(done)return;ans[i]=j;[...w.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};w.appendChild(b)});
d.appendChild(w);box.appendChild(d)})}
function lab(q,j){return j==null?'(no answer)':(q.c.length==2?'':L[j]+'. ')+q.c[j]}
function submit(){if(done)return;done=true;clearInterval(tid);let s=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i),bs=d.querySelectorAll('.ch'),ok=ans[i]===q.a;if(ok)s++;
d.classList.add(ok?'right':'wrong');bs[q.a].classList.add('ok');if(!ok&&ans[i]!=null)bs[ans[i]].classList.add('bad');
const e=document.createElement('div');e.className='ex';
let msg;
if(ok){msg='Correct. '+q.x;}
else if(ans[i]!=null){msg='Wrong. Your answer ('+lab(q,ans[i])+'): '+q.w[ans[i]]+' Correct answer: '+lab(q,q.a)+'. '+q.x;}
else{msg='Wrong. Correct answer: '+lab(q,q.a)+'. '+q.x;}
const wl=q.w.map((r,j)=>j!==q.a&&r?'\n• '+lab(q,j)+' — '+r:'').join('');e.style.whiteSpace='pre-line';e.textContent=msg+(wl?'\nWhy the other choices are wrong:'+wl:'');d.appendChild(e)});
document.getElementById('score').textContent=`Score: ${s} / ${Q.length} (${Math.round(100*s/Q.length)}%)`;const r=document.getElementById('res');r.hidden=false;document.getElementById('sub').hidden=true;window.scrollTo(0,0)}
document.getElementById('sub').onclick=()=>{const n=Q.length-Object.keys(ans).length;if(n&&!confirm(n+' unanswered. Submit anyway?'))return;submit()};
document.getElementById('copy').onclick=()=>{const t=Q.map((q,i)=>ans[i]===q.a?null:`Q${i+1}: ${q.q}\nMy answer: ${lab(q,ans[i])}\nCorrect: ${lab(q,q.a)}`).filter(Boolean).join('\n\n')||'No wrong answers!';
const m=document.getElementById('msg');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent='Copied.',()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();m.textContent='Copied.'})};
document.getElementById('retake').onclick=()=>{ans={};reshuffle();done=false;clearInterval(tid);document.getElementById('timer').textContent='';document.getElementById('tbtn').hidden=false;document.getElementById('res').hidden=true;document.getElementById('sub').hidden=false;document.getElementById('msg').textContent='';render();window.scrollTo(0,0)};
document.getElementById('tbtn').onclick=e=>{e.target.hidden=true;let t=900;const el=document.getElementById('timer');const f=()=>{el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t--<=0){clearInterval(tid);alert('Time is up!');submit()}};f();tid=setInterval(f,1000)};
render();</script></body></html>
