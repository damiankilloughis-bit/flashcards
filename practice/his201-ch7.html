<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS-201 Ch. 7 Practice</title>
<style>:root{--bg:#111418;--panel:#1a1f27;--panel2:#222935;--line:#2c3441;--text:#e6e9ef;--muted:#9aa4b2;--accent:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 80px}.top{position:sticky;top:0;background:var(--bg);padding:12px 0;display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:18px;margin:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}.btn.p{background:#1d4ed8;border-color:#2563eb}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}.qn{color:var(--muted);font-size:13px}
.ch{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px}
.tf{display:flex;gap:8px}.tf .ch{text-align:center}.ch.sel{border-color:var(--accent);background:#1e3a5f}.ch.ok{border-color:#22c55e;background:rgba(34,197,94,.18)}.ch.bad{border-color:#ef4444;background:rgba(239,68,68,.18)}
.card.right{border-color:#22c55e}.card.wrong{border-color:#ef4444}.ex{margin-top:8px;color:var(--muted);font-size:14px}#score{font-size:20px;font-weight:600}#timer{font-variant-numeric:tabular-nums}.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}</style></head>
<body><div class="wrap"><div class="top"><h1>HIS-201 Ch. 7 Practice</h1><div><span id="timer"></span> <button class="btn" id="tbtn">Start 60:00 timer</button></div></div>
<div id="res" class="card" hidden><div id="score"></div><div class="row"><button class="btn" id="copy">Copy my wrong answers</button><button class="btn" id="retake">Retake</button></div><div id="msg" class="ex"></div></div>
<div id="qs"></div><div class="row"><button class="btn p" id="sub">Submit</button></div><p class="ex"><a style="color:var(--accent)" href="../">Back to flashcards</a></p></div>
<script>const Q=[{"q":"Which of these  WAS NOT  among the actions taken by the Continental Congress, before the Declaration of Independence, that seemed to be the actions of an independent government?","c":["Drafting the “Olive Branch Petition”.","Creation of a Continental Army.","Invading Canada.","Opening American trade to other nations."],"a":0,"ch":7,"x":"The Olive Branch (July 1775) affirmed loyalty to George III and sought reconciliation [p.142]—not independent-government behavior. Creating the army, opening trade to all nations but Britain (Apr 1776), and the 1775 Quebec siege did look sovereign [pp.142–43,153]."},{"q":"Twenty years after the treaty ending the French and Indian War in 1763 in North America another Treaty of Paris brought the American Revolution to a close.","c":["True","False"],"a":0,"ch":7,"x":"True: 1763 + 20 = 1783, and the Treaty of Paris ending the Revolution is dated Sept 3, 1783 [p.159]."},{"q":"Valley Forge was where Washington’s Continental Army wintered and came close to breaking apart in the winter of 1777-78.","c":["True","False"],"a":0,"ch":7,"x":"True: ~11,000 wintered at Valley Forge 1777–78; hunger, cold, and disease killed ~2,500; Congress lacked money and supplies [p.151]. Open mutinies came a bit later (1779–81) [p.152]."},{"q":"Tories was the term used by the rebels to refer to American loyalists.","c":["True","False"],"a":0,"ch":7,"x":"True: rebels called loyalists \"tories\" [p.144]."},{"q":"This was the colonists’ attempt at reconciling with the British monarch in hopes of avoiding a war with England.","c":["Olive Branch Petition.","Declaration of Independence.","Delaration of the Rights of Man and the Citizen.","Bill of Rights."],"a":0,"ch":7,"x":"John Dickinson's Olive Branch Petition (July 1775) affirmed loyalty and asked George III to disavow his ministers [p.142]. The Declaration rejected Britain; the other two aren't American Revolution documents in these notes."},{"q":"Which is the best statement of why the British signed the peace treaty granting American independence?","c":["The Americans had driven the British army out of North America.","The French had driven the British navy from the high seas.","The timing of the occasional American victories led to a global situation where the British needed to salvage the rest of their empire by cutting their American losses.","They had sent a commission offering peace on pre-war terms, which the Congress accepted in all particulars except refusing to remain in the empire."],"a":2,"ch":7,"x":"Yorktown ended British will, and setbacks in India, the West Indies, Florida, and Gibraltar pushed Britain to cut losses [pp.158–59]. Britain still held NYC and other posts; France hadn't swept the seas; no such accepted pre-war commission appears in the notes."},{"q":"The ranks of loyalists included","c":["a disproportionate number of New Englanders.","a majority of southern Anglicans.","a large number of recent emigrants from the British Isles.","middle-class artisans in the port towns of the middle colonies."],"a":2,"ch":7,"x":"Loyalists included recent British immigrants and Highland Scots [p.144]. Loyalty concentrated in the mid-Atlantic and South, not New England; notes say Anglicans outside the South; they name big-city merchants, not middle-class artisans."},{"q":"What is one of the difficulties that arose for the French that helped to change the course of the Seven Years' War?","c":["The British blockade on the St. Lawrence left the French without vital supplies.","Some of France's Indian allies went to war with one another.","France's alliance with Austria fell apart and put a strain on their troops in Europe.","France's monarch lost interest in the North American colonies."],"a":0,"ch":7,"x":"Ch. 6 fact: the 1757 British blockade of the St. Lawrence cut arms, ammunition, and metal goods, so France couldn't keep Indian alliances [Ch.6 pp.120–21]. The other options aren't supported in the notes."},{"q":"Which of the following best explains why the French fought against Britain in the American Revolution?","c":["They expected to be able to regain territory in North America.","They sympathized with the republican principles by which the Americans fought.","The successful British occupation of Philadelphia convinced them that the Americans were losing and needed help.","They feared that the Americans would reconcile with Britain, their historic enemy."],"a":3,"ch":7,"x":"Notes stress Vergennes wanted revenge for 1763 and entered after Saratoga showed Americans could win [pp.150–51]. Among the options, D best fits (a restored Anglo-American partnership would block that revenge); the 1783 treaty names no new French land [p.159]; C is backwards (Saratoga, not Philadelphia, brought France in)."},{"q":"The term used for an American colonist supportive of the independence movement during the American Revolution was a Huguenot.","c":["True","False"],"a":1,"ch":7,"x":"False: independence supporters were Patriots/rebels [pp.146,160]. Huguenot means French Protestant, not a Revolution loyalty label."},{"q":"In one of the final turning points of the Revolutionary War, scholars find that the primary result of the Battle of ____________________ found the British ____________________","c":["Cowpens/able to declare victory in the war in the South.","Yorktown/forced to surrender their army and begin peace negotiations.","Oriskany/warning their Indian allies to stop raiding civilian homesteads on the Northwest Territory frontier.","Trenton/unable to continue recruiting German soldiers to fight for them."],"a":1,"ch":7,"x":"Cornwallis surrendered at Yorktown Oct 19, 1781; Lord North said \"Oh, God, it is over,\" and peace followed [pp.158–59]. Cowpens was an American win; Trenton revived rebel morale earlier; Oriskany isn't framed that way here."},{"q":"The Declaration of Independence based the case for independence on the argument that monarchical government violated both reason and the Bible.","c":["True","False"],"a":1,"ch":7,"x":"False: Jefferson blamed George III's \"long train of abuses\" and grounded rights in nature/consent; unlike Common Sense, the Declaration did not attack monarchy itself [p.143]."},{"q":"The chapter introduction tells the story of the Battle of Bunker Hill to make the point that","c":["Americans won their revolution by pitting dedicated amateur soldiers against the might of Britain’s professional redcoats.","initially the war went badly for the Americans, testing their commitment to liberty and independence.","a key question in that battle and throughout the war was whether Americans would really fight to win their independence.","declaring independence was one thing, but after the Declaration, actually fighting against the authority of one’s own king was quite another."],"a":2,"ch":7,"x":"The opener \"Will He Fight?\" shows Breed's/Bunker Hill proved Americans would fight and raised that question for rebels, loyalists, and slaves [pp.140–41]. D is chronologically off (Bunker Hill was before the Declaration); A overstates amateurs-vs-pros as the chapter thesis."},{"q":"Which statement about the regulars of the Continental Army is true?","c":["Most of the soldiers were older, propertied farmers with families, whose substantial farms, left to the care of wives and children in their long absence, fell into disrepair.","Despite the hardships, Continental soldiers—who had enlisted for the sake of liberty—refused the temptations of desertion and mutiny that plagued the hired armies of Europe.","While local partisans in the South often ran at the first encounter with the enemy, the Continental Army proved its mettle in a series of victories in the Carolinas and Georgia.","In social composition and military tactics, the American army came to resemble the British army."],"a":3,"ch":7,"x":"Continentals became long-term drilled regulars (von Steuben) drawn from the poorest/least free [pp.146,151–52]—like European armies. A is backwards; B is wrong (desertion and mutinies happened [pp.146,152]); C overstates—southern success mixed Continentals with valuable militia [pp.155–56]."},{"q":"George Washington’s desire to create a professional military establishment","c":["was at first undermined by the republican fear of standing armies.","was eventually fulfilled by the power of the Second Continental Congress to draft soldiers.","diminished quickly because he came to rely almost wholly on the militia.","rose quickly because he concentrated on offensive military strategy rather than on discipline."],"a":0,"ch":7,"x":"Washington needed dependable regulars, but republican leaders feared standing armies and idealized citizen-soldiers [p.146]. Congress recommended a draft but couldn't force states [p.146]; he kept seeking a regular army and fought defensively with discipline [pp.148,152]."},{"q":"A principal military contribution that the French brought to the patriot cause was","c":["the quality of their commanders.","their navy.","the superiority of their weapons.","the surplus uniforms that they issued to American troops."],"a":1,"ch":7,"x":"The French navy (de Grasse) was key at Yorktown, trapping Cornwallis by sea [pp.158–59]; the notes also flag French naval strength neutralizing British advantages [p.154]."},{"q":"The term used for an American colonist supportive of the independence movement during the American Revolution was a Patriot.","c":["True","False"],"a":0,"ch":7,"x":"True: independence supporters were called Patriots (or rebels) [pp.146,160]."},{"q":"The final and decisive American victory was the surrender of the British force trapped at _____________.","c":["Yorktown","Boston","Philadelphia","Charleston"],"a":0,"ch":7,"x":"Cornwallis surrendered the trapped British force at Yorktown on Oct 19, 1781 [p.158]. Boston was evacuated early; Philadelphia and Charleston were British occupations/captures, not the decisive American win."},{"q":"During the first year of the Revolution, American war aims shifted from a desire for redress of grievances to a demand for complete independence. All of the following influenced this shift, EXCEPT","c":["the impact of Tom Paine’s Common Sense.","Washington’s refusal to command the Continental Army until independence was declared.","congressional actions that would be appropriate only to an independent government.","British actions to crush American resistance by force."],"a":1,"ch":7,"x":"Washington accepted command in June 1775—before independence [p.146]. Common Sense, Congress's sovereign-style acts (army, trade, state governments), and British force (rejecting Olive Branch, shutting trade, Dunmore) did push the shift [pp.142–43]."},{"q":"The Declaration of Independence based the case for independence on King George III’s infringements on American liberty.","c":["True","False"],"a":0,"ch":7,"x":"True: Part 2 is a long list of grievances blamed on George III (Parliament mentioned once) [p.143]. Pair with Q12—it was not an attack on monarchy in the abstract."}];L="ABCD";let ans={},done=false,tid=null;
function render(){const box=document.getElementById('qs');box.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='card';d.id='q'+i;
d.innerHTML=`<div class="qn">Question ${i+1} of ${Q.length}</div><div>${q.q}</div>`;const w=document.createElement('div');if(q.c.length==2)w.className='tf';
q.c.forEach((c,j)=>{const b=document.createElement('button');b.className='ch';b.textContent=(q.c.length==2?'':L[j]+'. ')+c;b.onclick=()=>{if(done)return;ans[i]=j;[...w.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};w.appendChild(b)});
d.appendChild(w);box.appendChild(d)})}
function lab(q,j){return j==null?'(no answer)':(q.c.length==2?'':L[j]+'. ')+q.c[j]}
function submit(){if(done)return;done=true;clearInterval(tid);let s=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i),bs=d.querySelectorAll('.ch'),ok=ans[i]===q.a;if(ok)s++;
d.classList.add(ok?'right':'wrong');bs[q.a].classList.add('ok');if(!ok&&ans[i]!=null)bs[ans[i]].classList.add('bad');
const e=document.createElement('div');e.className='ex';e.textContent=(ok?'Correct. ':'Wrong. Correct answer: '+lab(q,q.a)+'. ')+q.x+' (Ch. '+q.ch+')';d.appendChild(e)});
document.getElementById('score').textContent=`Score: ${s} / ${Q.length} (${Math.round(100*s/Q.length)}%)`;const r=document.getElementById('res');r.hidden=false;document.getElementById('sub').hidden=true;window.scrollTo(0,0)}
document.getElementById('sub').onclick=()=>{const n=Q.length-Object.keys(ans).length;if(n&&!confirm(n+' unanswered. Submit anyway?'))return;submit()};
document.getElementById('copy').onclick=()=>{const t=Q.map((q,i)=>ans[i]===q.a?null:`Q${i+1}: ${q.q}\nMy answer: ${lab(q,ans[i])}\nCorrect: ${lab(q,q.a)}\nChapter ${q.ch}`).filter(Boolean).join('\n\n')||'No wrong answers!';
const m=document.getElementById('msg');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent='Copied.',()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();m.textContent='Copied.'})};
document.getElementById('retake').onclick=()=>{ans={};done=false;clearInterval(tid);document.getElementById('timer').textContent='';document.getElementById('tbtn').hidden=false;document.getElementById('res').hidden=true;document.getElementById('sub').hidden=false;document.getElementById('msg').textContent='';render();window.scrollTo(0,0)};
document.getElementById('tbtn').onclick=e=>{e.target.hidden=true;let t=3600;const el=document.getElementById('timer');const f=()=>{el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t--<=0){clearInterval(tid);alert('Time is up!');submit()}};f();tid=setInterval(f,1000)};
render();</script></body></html>
