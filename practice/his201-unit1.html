<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HIS-201 Unit 1 Practice Exam</title>
<style>:root{--bg:#111418;--panel:#1a1f27;--panel2:#222935;--line:#2c3441;--text:#e6e9ef;--muted:#9aa4b2;--accent:#60a5fa}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 80px}.top{position:sticky;top:0;background:var(--bg);padding:12px 0;display:flex;gap:8px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);z-index:5}
h1{font-size:18px;margin:0}.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}.btn.p{background:#1d4ed8;border-color:#2563eb}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin:14px 0}.qn{color:var(--muted);font-size:13px}
.ch{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px}
.tf{display:flex;gap:8px}.tf .ch{text-align:center}.ch.sel{border-color:var(--accent);background:#1e3a5f}.ch.ok{border-color:#22c55e;background:rgba(34,197,94,.18)}.ch.bad{border-color:#ef4444;background:rgba(239,68,68,.18)}
.card.right{border-color:#22c55e}.card.wrong{border-color:#ef4444}.ex{margin-top:8px;color:var(--muted);font-size:14px}#score{font-size:20px;font-weight:600}#timer{font-variant-numeric:tabular-nums}.row{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}</style></head>
<body><div class="wrap"><div class="top"><h1>HIS-201 Unit 1 Practice</h1><div><span id="timer"></span> <button class="btn" id="tbtn">Start 60:00 timer</button></div></div>
<div id="res" class="card" hidden><div id="score"></div><div class="row"><button class="btn" id="copy">Copy my wrong answers</button><button class="btn" id="retake">Retake</button></div><div id="msg" class="ex"></div></div>
<div id="qs"></div><div class="row"><button class="btn p" id="sub">Submit</button></div><p class="ex"><a style="color:var(--accent)" href="../">Back to flashcards</a></p></div>
<script>const Q=[{"q": "The agricultural revolution in Mesoamerica mattered most because stored crops let people:", "c": ["Abandon villages to follow herds", "Settle permanently and specialize as craftworkers, merchants and priests", "Avoid all contact with neighbors", "Stop hunting forever"], "a": 1, "x": "Stored crops allowed settled life and specialized work.", "ch": 1}, {"q": "T/F: The Mogollon were especially renowned for their exquisite pottery.", "c": ["True", "False"], "a": 0, "x": "Mogollon became renowned potters.", "ch": 1}, {"q": "Ancestral Pueblo peoples (Anasazi) built their largest settlement center at:", "c": ["Paquime", "Cahokia", "Chaco Canyon", "Tenochtitl\u00e1n"], "a": 2, "x": "Chaco Canyon was the largest Ancestral Pueblo center.", "ch": 1}, {"q": "All of the following were Eastern Woodlands peoples EXCEPT the:", "c": ["Algonquins", "Iroquois", "Hohokam", "Hurons"], "a": 2, "x": "The Hohokam lived in southern Arizona.", "ch": 1}, {"q": "The Black Death helped set the stage for European expansion because it:", "c": ["Forced kings to give up power", "Ended the Crusades", "Wiped out Muslim traders", "Left survivors with better wages, lower prices and more land"], "a": 3, "x": "Population loss brought better wages, lower prices, more land.", "ch": 2}, {"q": "In what year did Sultan Mehmet II conquer Constantinople, alarming Europe?", "c": ["1453", "1521", "1347", "1492"], "a": 0, "x": "Mehmet II took Constantinople in 1453.", "ch": 2}, {"q": "'Virgin soil epidemics' were:", "c": ["Diseases Native Americans gave Europeans", "Epidemics striking peoples with no acquired immunity, like smallpox in Mexico", "Plagues spread by rats in Europe", "Crop failures in newly plowed land"], "a": 1, "x": "Smallpox exploited the Americas' lack of acquired immunity.", "ch": 2}, {"q": "T/F: The Columbian Exchange was the transfer of plants, animals and germs between the Americas, Eurasia and Africa after Columbus's landfall.", "c": ["True", "False"], "a": 0, "x": "Book definition of the Columbian exchange.", "ch": 2}, {"q": "What share of extracted American silver did Spain's Crown claim?", "c": ["One-fifth", "One-tenth", "One-half", "All of it"], "a": 0, "x": "The Crown claimed one-fifth.", "ch": 2}, {"q": "The chapter's account of Ireland makes the point that:", "c": ["England's conquest of Ireland became a model and justification for brutal colonization in America", "Irish settlers founded Roanoke", "Ireland was England's most profitable colony", "England learned to respect native customs"], "a": 0, "x": "The Irish campaign became a model and precedent for brutality.", "ch": 2}, {"q": "The 1680 Pueblo Revolt broke out after:", "c": ["Spanish forced labor and suppression of Pueblo religion", "Tobacco planters seized Pueblo land", "The Yamasee War spread west", "French traders armed the Pueblos"], "a": 0, "x": "Labor demands and suppression of religious practices.", "ch": 3}, {"q": "Virginia's headright system gave land to:", "c": ["Freed slaves", "Only Anglican ministers", "Indians who converted", "Sponsors for each immigrant whose passage they paid"], "a": 3, "x": "50 acres per immigrant whose passage was paid.", "ch": 3}, {"q": "T/F: The House of Burgesses, first meeting in 1619, began a strong tradition of royal absolutism in Virginia.", "c": ["True", "False"], "a": 1, "x": "It began a representative-government tradition.", "ch": 3}, {"q": "Who led the 1676 frontier rebellion against Governor William Berkeley?", "c": ["John Smith", "John Rolfe", "Nathaniel Bacon", "John Coode"], "a": 2, "x": "Nathaniel Bacon led the frontier movement.", "ch": 3}, {"q": "Compared with the Chesapeake gentry, early South Carolina planters:", "c": ["Were mostly Catholic", "Grew tobacco with English servants", "Banned slavery", "Came largely from Barbados and grew rice with enslaved Africans"], "a": 3, "x": "Barbados immigrants dominated; rice and slaves.", "ch": 3}, {"q": "All of the following describe Georgia under its trustees EXCEPT:", "c": ["Large slave plantations from the start", "Buffer against Spanish Florida", "Ban on slavery", "Ban on hard liquor"], "a": 0, "x": "Trustees banned slavery and capped holdings at 500 acres.", "ch": 3}, {"q": "Champlain founded Quebec in 1608 along which river to pursue the fur trade?", "c": ["Ohio", "St. Lawrence", "Hudson", "Mississippi"], "a": 1, "x": "Quebec sits up the St. Lawrence valley.", "ch": 4}, {"q": "T/F: In the Beaver Wars, Iroquois armed by the French destroyed the Hurons.", "c": ["True", "False"], "a": 1, "x": "The Iroquois traded with the Dutch, not the French.", "ch": 4}, {"q": "Separatists were Puritans who:", "c": ["Gave up on reforming the Church of England", "Stayed loyal to the pope", "Rejected predestination", "Settled in Virginia"], "a": 0, "x": "Separatists gave up on the Church of England.", "ch": 4}, {"q": "Unlike Chesapeake migrants, New England migrants:", "c": ["Grew tobacco", "Were mostly young single servants", "Came in family groups with a balanced sex ratio", "Died younger"], "a": 2, "x": "Family groups, balanced sex ratio.", "ch": 4}, {"q": "Which pair was banished from Massachusetts Bay for religious dissent?", "c": ["Roger Williams and Anne Hutchinson", "Metacom and Powhatan", "John Winthrop and William Penn", "John Smith and Pocahontas"], "a": 0, "x": "Williams and Hutchinson were banished.", "ch": 4}, {"q": "The Dominion of New England ended because:", "c": ["Penn bought it", "The Dutch retook New York", "The Glorious Revolution brought William and Mary, who dismantled it", "Metacom's War destroyed it"], "a": 2, "x": "William and Mary dismantled the Dominion.", "ch": 4}, {"q": "First-generation New England colonists lived to an average age of about:", "c": ["85", "35", "48", "70"], "a": 3, "x": "About 70, nearly twice as long as Virginians.", "ch": 4}, {"q": "Spain pushed missions and presidios into Texas mainly as a:", "c": ["Buffer against French encroachment", "Base against Russia", "Refuge for Protestants", "Sugar colony"], "a": 0, "x": "Texas was a buffer against the French.", "ch": 5}, {"q": "After the 1729 Natchez uprising, French Louisiana:", "c": ["Expelled the Choctaw", "Joined New Spain", "Became a cotton colony", "Stopped importing slaves"], "a": 3, "x": "Authorities stopped importing slaves.", "ch": 5}, {"q": "Backcountry life in the 1700s featured all of the following EXCEPT:", "c": ["Isolation from courthouses and churches", "Few slaves or servants", "Self-sufficient farming", "Good roads to send crops to market"], "a": 3, "x": "No roads or navigable rivers, so families were self-sufficient.", "ch": 5}, {"q": "All of the following were results of the Great Awakening EXCEPT:", "c": ["Presbyterian and Baptist churches spread", "Colonists became more religiously divided", "Churches split", "Rational Christianity became most colonists' faith"], "a": 3, "x": "The Awakening was partly a reaction against rational Christianity.", "ch": 5}, {"q": "T/F: The 1739 Stono Rebellion was a slave uprising in Virginia.", "c": ["True", "False"], "a": 1, "x": "Stono was in South Carolina.", "ch": 5}, {"q": "Most white colonists were proud to be English because:", "c": ["England's church ran colonial schools", "Britain taxed them heavily", "Britain's benign neglect gave them more land, opportunity and self-government", "They had titled aristocrats"], "a": 2, "x": "Benign neglect let colonists prosper and govern themselves.", "ch": 5}, {"q": "Which colonist was most impressed by the Enlightenment's useful knowledge and invented a stove?", "c": ["William Penn", "Jonathan Edwards", "George Whitefield", "Benjamin Franklin"], "a": 3, "x": "Franklin valued useful knowledge and experimentation.", "ch": 5}],L="ABCD";let ans={},done=false,tid=null;
function render(){const box=document.getElementById('qs');box.innerHTML='';Q.forEach((q,i)=>{const d=document.createElement('div');d.className='card';d.id='q'+i;
d.innerHTML=`<div class="qn">Question ${i+1} of ${Q.length}</div><div>${q.q}</div>`;const w=document.createElement('div');if(q.c.length==2)w.className='tf';
q.c.forEach((c,j)=>{const b=document.createElement('button');b.className='ch';b.textContent=(q.c.length==2?'':L[j]+'. ')+c;b.onclick=()=>{if(done)return;ans[i]=j;[...w.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};w.appendChild(b)});
d.appendChild(w);box.appendChild(d)})}
function lab(q,j){return j==null?'(no answer)':(q.c.length==2?'':L[j]+'. ')+q.c[j]}
function submit(){if(done)return;done=true;clearInterval(tid);let s=0;Q.forEach((q,i)=>{const d=document.getElementById('q'+i),bs=d.querySelectorAll('.ch'),ok=ans[i]===q.a;if(ok)s++;
d.classList.add(ok?'right':'wrong');bs[q.a].classList.add('ok');if(!ok&&ans[i]!=null)bs[ans[i]].classList.add('bad');
const e=document.createElement('div');e.className='ex';e.textContent=(ok?'Correct. ':'Wrong. Correct answer: '+lab(q,q.a)+'. ')+q.x+' (Ch. '+q.ch+')';d.appendChild(e)});
document.getElementById('score').textContent=`Score: ${s} / ${Q.length} (${Math.round(100*s/Q.length)}%)`;const r=document.getElementById('res');r.hidden=false;document.getElementById('sub').hidden=true;window.scrollTo(0,0)}
document.getElementById('sub').onclick=()=>{const n=Q.length-Object.keys(ans).length;if(n&&!confirm(n+' unanswered. Submit anyway?'))return;submit()};
document.getElementById('copy').onclick=()=>{const t=Q.map((q,i)=>ans[i]===q.a?null:`Q${i+1}: ${q.q}\nMy answer: ${lab(q,ans[i])}\nCorrect: ${lab(q,q.a)}\nChapter ${q.ch}`).filter(Boolean).join('\n\n')||'No wrong answers!';
const m=document.getElementById('msg');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>m.textContent='Copied.',()=>{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();m.textContent='Copied.'})};
document.getElementById('retake').onclick=()=>{ans={};done=false;clearInterval(tid);document.getElementById('timer').textContent='';document.getElementById('tbtn').hidden=false;document.getElementById('res').hidden=true;document.getElementById('sub').hidden=false;document.getElementById('msg').textContent='';render();window.scrollTo(0,0)};
document.getElementById('tbtn').onclick=e=>{e.target.hidden=true;let t=3600;const el=document.getElementById('timer');const f=()=>{el.textContent=String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');if(t--<=0){clearInterval(tid);alert('Time is up!');submit()}};f();tid=setInterval(f,1000)};
render();</script></body></html>
